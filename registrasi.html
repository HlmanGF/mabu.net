<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran MabuNet</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; 
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4; 
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .form-container {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            color: var(--text-main);
            margin-bottom: 5px;
        }
        h2 span {
            color: var(--accent);
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .section-title {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 5px;
        }

        button.submit-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        @media (max-width: 500px) {
            .grid-2-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Formulir <span>Pendaftaran</span></h2>
        <p class="subtitle">Isi data diri Anda, dan pesan akan langsung dikirim ke sistem admin kami.</p>

        <form id="regForm">
            <div class="form-group">
                <label>Pilih Paket Internet</label>
                <!-- Value di bawah ini sudah disesuaikan dengan ID Paket MabuNet -->
                <select id="paket" required>
                    <option value="">-- Pilih Paket --</option>
                    <option value="5mbps_100">5 Mbps - Rp 100.000</option>
                    <option value="10mbps_150">10 Mbps - Rp 150.000</option>
                    <option value="10mbps_180">10 Mbps - Rp 180.000</option>
                    <option value="15mbps_200">15 Mbps - Rp 200.000</option>
                    <option value="20mbps_250">20 Mbps - Rp 250.000</option>
                    <option value="25mbps_300">25 Mbps - Rp 300.000</option>
                </select>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group">
                    <label>No. HP / WhatsApp Aktif</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 08123456789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Pilih Blok Rumah</label>
                <select id="blok_rumah" required>
                    <option value="">-- Pilih Blok --</option>
                    <option value="Mabu">Mabu</option>
                    <option value="Ranau">Ranau</option>
                    <option value="RG">RG</option>
                    <option value="Pesona">Pesona</option>
                    <option value="PLT">PLT</option>
                </select>
            </div>

            <div class="form-group">
                <label>Detail Alamat (No. Rumah)</label>
                <textarea id="detail_alamat" rows="2" placeholder="Contoh: No. 12 / Patokan rumah warna biru" required></textarea>
            </div>

            <div class="section-title">Pengaturan WiFi (Wajib Diisi)</div>
            <p class="subtitle" style="margin-bottom: 15px;">Tentukan nama dan password untuk jaringan WiFi di rumah Anda.</p>

                <div class="form-group">
