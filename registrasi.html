<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran MabuNet</title>
    <!-- Firebase SDK (Gunakan versi yang sama dengan admin MabuNet Anda) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a; /* Warna latar belakang gelap */
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #06b6d4; /* Warna cyan/biru muda */
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .form-container {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 600px;
        }

        h2 {
            color: var(--text-main);
            margin-bottom: 5px;
        }
        h2 span {
            color: var(--accent);
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .grid-2-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .section-title {
            color: var(--accent);
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 5px;
        }

        button.submit-btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }

        button.submit-btn:hover {
            opacity: 0.9;
        }

        /* Responsive untuk HP */
        @media (max-width: 500px) {
            .grid-2-col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Formulir <span>Pendaftaran</span></h2>
        <p class="subtitle">Isi data diri Anda, dan pesan akan langsung dikirim ke sistem admin kami.</p>

        <form id="regForm">
            <div class="form-group">
                <label>Pilih Paket Internet</label>
                <select id="paket" required>
                    <option value="">-- Pilih Paket --</option>
                    <option value="Standar 10 Mbps - Rp 150.000">Standar 10 Mbps - Rp 150.000</option>
                    <option value="Standar 15 Mbps - Rp 200.000">Standar 15 Mbps - Rp 200.000</option>
                    <option value="Standar 20 Mbps - Rp 250.000">Standar 20 Mbps - Rp 250.000</option>
                    <option value="Standar 25 Mbps - Rp 300.000">Standar 25 Mbps - Rp 300.000</option>
                    <option value="Standar 30 Mbps - Rp 350.000">Standar 30 Mbps - Rp 350.000</option>
                    <option value="Netflix 10 Mbps - Rp 200.000">Netflix 10 Mbps - Rp 200.000</option>
                    <option value="Netflix 15 Mbps - Rp 250.000">Netflix 15 Mbps - Rp 250.000</option>
                    <option value="Netflix 20 Mbps - Rp 300.000">Netflix 20 Mbps - Rp 300.000</option>
                    <option value="Netflix 25 Mbps - Rp 350.000">Netflix 25 Mbps - Rp 350.000</option>
                    <option value="Netflix 30 Mbps - Rp 400.000">Netflix 30 Mbps - Rp 400.000</option>
                </select>
            </div>

            <div class="grid-2-col">
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
                </div>
                <div class="form-group">
                    <label>No. HP / WhatsApp Aktif</label>
                    <input type="tel" id="whatsapp" placeholder="Contoh: 08123456789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Alamat Lengkap / Blok Rumah</label>
                <textarea id="alamat" rows="3" placeholder="Contoh: Perumahan Mabu Park Blok A No. 12" required></textarea>
            </div>

            <div class="section-title">Pengaturan WiFi (Wajib Diisi)</div>
            <p class="subtitle" style="margin-bottom: 15px;">Tentukan nama dan password untuk jaringan WiFi di rumah Anda.</p>

            <div class="grid-2-col">
                <div class="form-group">
                    <label>Request Nama WiFi (SSID)</label>
                    <input type="text" id="ssid" placeholder="Contoh: RumahKeluarga" required>
                </div>
                <div class="form-group">
                    <label>Request Password WiFi</label>
                    <input type="text" id="password_wifi" placeholder="Minimal 8 karakter" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="btnSubmit">Kirim Pendaftaran</button>
        </form>
    </div>

    <script>
        // 1. MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "DOMAIN_ANDA.firebaseapp.com",
            projectId: "PROJECT_ID_ANDA",
            storageBucket: "BUCKET_ANDA.appspot.com",
            messagingSenderId: "SENDER_ID_ANDA",
            appId: "APP_ID_ANDA"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. LOGIKA PENGIRIMAN FORM
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            // Ambil nilai dari form
            const nama = document.getElementById('nama').value;
            const whatsapp = document.getElementById('whatsapp').value;
            const alamat = document.getElementById('alamat').value;
            const paket = document.getElementById('paket').value;
            const ssid = document.getElementById('ssid').value;
            const password_wifi = document.getElementById('password_wifi').value;

            // GENERATE NAMA PPPoE OTOMATIS
            // Logika: Kata pertama dari nama (huruf kecil) + 3 angka terakhir No WA
            // Contoh: "Ade Hilman" dan WA "08123456789" -> "ade789"
            const namaDepan = nama.split(' ')[0].toLowerCase().replace(/[^a-z]/g, '');
            const digitWA = whatsapp.slice(-3);
            const pppoe_secret = `${namaDepan}${digitWA}`;

            try {
                // Simpan ke collection 'pelanggan' (atau buat collection 'pendaftar_baru' jika ingin dipisah)
                await db.collection('pelanggan').add({
                    nama: nama,
                    whatsapp: whatsapp,
                    alamat: alamat,
                    paket: paket,
                    ssid: ssid,
                    password_wifi: password_wifi,
                    pppoe: pppoe_secret, // Hasil generate otomatis
                    status: 'Calon Pelanggan', // Status pembeda dari pelanggan aktif
                    tanggal_daftar: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert("Pendaftaran berhasil! Tim MabuNet akan segera menghubungi WhatsApp Anda.");
                document.getElementById('regForm').reset();
                
            } catch (error) {
                console.error("Error menambah dokumen: ", error);
                alert("Terjadi kesalahan sistem. Silakan coba lagi.");
            } finally {
                btn.innerText = "Kirim Pendaftaran";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
