<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MABUNET Hotfix Fase 3.1</title>
<style>
body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #0f172a; }
.card { background: white; padding: 28px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
h1 { color: #1A2C5B; margin: 0 0 8px; font-size: 22px; }
.sub { color: #64748b; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
.step { padding: 16px; border: 2px dashed #e2e8f0; border-radius: 12px; margin: 16px 0; }
.step-label { font-weight: 700; margin: 0 0 10px; font-size: 14px; }
button { background: #1A2C5B; color: white; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
button:disabled { opacity: .4; cursor: not-allowed; }
button:hover:not(:disabled) { background: #111D42; }
#log { font-family: ui-monospace, monospace; font-size: 11px; background: #0f172a; color: #a5f3fc; padding: 14px; border-radius: 8px; max-height: 400px; overflow-y: auto; margin-top: 16px; white-space: pre-wrap; display: none; line-height: 1.6; }
#log.show { display: block; }
.ok { color: #10b981; font-weight: bold; }
.err { color: #ef4444; font-weight: bold; }
.info { color: #fbbf24; }
code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔧 Hotfix Fase 3.1</h1>
  <p class="sub">Memperbaiki 3 fungsi JS yang gagal di-patch: <b>previewBillProof</b>, <b>tutupPaymentProof</b>, dan <b>bukaPaymentProof</b>.</p>

  <div class="step">
    <p class="step-label">1. Pilih file <code>index.html</code> hasil Fase 3:</p>
    <input type="file" id="fileInput" accept=".html,.htm">
  </div>

  <div class="step">
    <p class="step-label">2. Klik tombol:</p>
    <button id="patchBtn" disabled>⚡ Terapkan Hotfix & Download</button>
  </div>

  <div id="log"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const patchBtn = document.getElementById('patchBtn');
const logDiv = document.getElementById('log');
let originalContent = '';
let originalFilename = 'index.html';

const log = (msg, cls) => {
  logDiv.classList.add('show');
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = msg;
  logDiv.appendChild(span);
};

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) { patchBtn.disabled = true; return; }
  originalFilename = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    originalContent = ev.target.result;
    patchBtn.disabled = false;
    logDiv.innerHTML = '';
    log('[OK] File dimuat: ' + file.name + ' (' + originalContent.length.toLocaleString() + ' karakter)', 'ok');
    const isFase3 = originalContent.indexOf('id="payStatusBadge"') !== -1;
    log(isFase3 ? '[INFO] Terdeteksi: HTML Fase 3 sudah ada ✓' : '[WARN] Fase 3 BELUM ada!', isFase3 ? 'info' : 'err');
  };
  reader.readAsText(file);
});

patchBtn.addEventListener('click', () => {
  patchBtn.disabled = true;
  logDiv.innerHTML = '';
  log('Memulai hotfix Fase 3.1...', 'info');
  try {
    let modified = originalContent;
    let applied = 0, failed = 0;

    // FIX 1: bukaPaymentProof() alert -> showToast
    const oldAlert = 'alert("Anda harus login untuk mengirim bukti pembayaran lewat aplikasi.");';
    if (modified.indexOf(oldAlert) !== -1) {
      modified = modified.replace(oldAlert, 'showToast("Silakan login terlebih dahulu untuk upload bukti.", "error");');
      log('[OK] Fix 1: alert() di bukaPaymentProof() diganti showToast()', 'ok'); applied++;
    } else {
      log('[WARN] Fix 1: alert() di bukaPaymentProof() tidak ditemukan (mungkin sudah diganti)', 'info');
    }

    // FIX 2: previewBillProof() hide placeholder
    const rxPreview = /function previewBillProof\(event\)\s*\{[\s\S]*?reader\.readAsDataURL\(file\);\s*\}\s*\}/;
    if (modified.match(rxPreview)) {
      const newPreview = `function previewBillProof(event) {
        const file = event.target.files[0];
        if(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                tempBillProofBase64 = e.target.result;
                var prev = document.getElementById('billProofPreview');
                var ph = document.getElementById('billProofPlaceholder');
                if (prev) { prev.src = tempBillProofBase64; prev.classList.remove('hidden'); }
                if (ph) ph.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }
    }`;
      modified = modified.replace(rxPreview, newPreview);
      log('[OK] Fix 2: previewBillProof() diupdate — placeholder di-hide', 'ok'); applied++;
    } else {
      log('[FAIL] Fix 2: Fungsi previewBillProof() tidak ditemukan', 'err'); failed++;
    }

    // FIX 3: tutupPaymentProof() reset placeholder
    const rxTutup = /function tutupPaymentProof\(\)\s*\{[\s\S]*?document\.getElementById\('billProofPreview'\)\.src\s*=\s*"";\s*\}/;
    if (modified.match(rxTutup)) {
      const newTutup = `function tutupPaymentProof() {
        document.getElementById('paymentProofContent').classList.add('translate-y-full');
        setTimeout(() => { document.getElementById('paymentProofModal').classList.add('hidden'); document.getElementById('paymentProofModal').classList.remove('flex'); }, 300);
        tempBillProofBase64 = null;
        var inp = document.getElementById('billProofInput');
        var prev = document.getElementById('billProofPreview');
        var ph = document.getElementById('billProofPlaceholder');
        if (inp) inp.value = "";
        if (prev) { prev.classList.add('hidden'); prev.src = ""; }
        if (ph) ph.classList.remove('hidden');
    }`;
      modified = modified.replace(rxTutup, newTutup);
      log('[OK] Fix 3: tutupPaymentProof() diupdate — reset placeholder', 'ok'); applied++;
    } else {
      log('[FAIL] Fix 3: Fungsi tutupPaymentProof() tidak ditemukan', 'err'); failed++;
    }

    log('', '');
    if (failed > 0) {
      log('=== GAGAL ===', 'err');
      log('File TIDAK di-download.', 'err');
      patchBtn.disabled = false;
      return;
    }

    log('=== SELESAI ===', 'ok');
    log('Berhasil: ' + applied, 'ok');

    const blob = new Blob([modified], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = originalFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    log('', '');
    log('[DONE] File di-download: ' + originalFilename, 'ok');
    log('Selanjutnya: replace di GitHub → hard-refresh.', 'info');
    patchBtn.disabled = false;

  } catch (e) {
    log('[ERROR] ' + e.message, 'err');
    patchBtn.disabled = false;
  }
});
</script>
</body>
</html>
