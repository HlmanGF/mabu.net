<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mabunet - Daftar Tagihan Belum Lunas</title>
    <!-- Tailwind CSS CDN untuk styling yang cepat dan rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        
        <!-- Header Halaman -->
        <div class="mb-4">
            <h2 class="text-xl font-bold text-gray-800">Tagihan Belum Lunas</h2>
            <p class="text-xs text-gray-500">Kelola dan pantau status langganan pelanggan yang melewati jatuh tempo.</p>
        </div>

        <!-- Daftar Kontainer Tagihan -->
        <div class="space-y-3" id="list-tagihan">

            <!-- Item Pelanggan 1 -->
            <div class="bg-white shadow-sm rounded-lg p-3 flex flex-col md:flex-row items-center justify-between gap-4 border border-gray-100">
                <!-- Kiri: Status & Nama Pelanggan + Jatuh Tempo -->
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <span class="bg-red-100 text-red-600 text-xs px-2.5 py-1 rounded-full font-semibold whitespace-nowrap">
                        ⚠️ Belum Lunas
                    </span>
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm md:text-base">Ahmad Fauzi (N1)</h4>
                        <p class="text-xs text-red-500 font-medium">Jatuh Tempo: 10 November 2026</p>
                    </div>
                </div>

                <!-- Kanan: Nominal & Tombol Aksi dalam Satu Baris -->
                <div class="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto border-t md:border-t-0 pt-2 md:pt-0">
                    <div class="text-right">
                        <span class="text-xs text-gray-500 block">Nominal</span>
                        <span class="font-bold text-gray-900 text-sm">Rp 150.000</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="aksiIsolir('N1')" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs rounded-md font-medium transition cursor-pointer">
                            Isolir
                        </button>
                        <button onclick="aksiLunas('N1')" class="px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white text-xs rounded-md font-medium transition cursor-pointer">
                            Lunas
                        </button>
                    </div>
                </div>
            </div>

            <!-- Item Pelanggan 2 -->
            <div class="bg-white shadow-sm rounded-lg p-3 flex flex-col md:flex-row items-center justify-between gap-4 border border-gray-100">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <span class="bg-red-100 text-red-600 text-xs px-2.5 py-1 rounded-full font-semibold whitespace-nowrap">
                        ⚠️ Belum Lunas
                    </span>
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm md:text-base">Siti Rahma (N2)</h4>
                        <p class="text-xs text-red-500 font-medium">Jatuh Tempo: 12 November 2026</p>
                    </div>
                </div>

                <div class="flex items-center justify-between md:justify-end gap-4 w-full md:w-auto border-t md:border-t-0 pt-2 md:pt-0">
                    <div class="text-right">
                        <span class="text-xs text-gray-500 block">Nominal</span>
                        <span class="font-bold text-gray-900 text-sm">Rp 175.000</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <button onclick="aksiIsolir('N2')" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs rounded-md font-medium transition cursor-pointer">
                            Isolir
                        </button>
                        <button onclick="aksiLunas('N2')" class="px-3 py-1.5 bg-green-500 hover:bg-green-600 text-white text-xs rounded-md font-medium transition cursor-pointer">
                            Lunas
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- Script Pendukung Interaksi Tombol -->
    <script>
        function aksiIsolir(username) {
            alert('Perintah Isolir dikirim untuk pelanggan: ' + username);
            // Tambahkan logika fetch ke backend/Firebase Anda di sini
        }

        function aksiLunas(username) {
            alert('Pelanggan ' + username + ' ditandai Lunas.');
            // Tambahkan logika update pembayaran ke database Anda di sini
        }
    </script>

</body>
</html>
