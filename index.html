<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MABUNET - Master Billing & Network</title>
  
  <!-- Setup Tailwind CSS & Dark Mode Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .scanner-line { position: absolute; width: 100%; height: 2px; background: #4ade80; box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80; animation: scan 1.5s linear infinite; }
    .pulse-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
    @keyframes ring { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0); } }
    .animate-ring { animation: ring 0.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Users, LayoutDashboard, LogOut, Check, Wifi, BookOpen, 
      Fingerprint, Lock, User, Settings, Camera, ShieldAlert, ToggleLeft, ToggleRight,
      Bell, BellRing, Plus, Edit3, Trash2, FileText, ChevronRight, Volume2, VolumeX, CloudLightning, Server,
      Eye, EyeOff, Sun, Moon
    } from 'https://esm.sh/lucide-react@0.292.0';
    
    // --- IMPORT FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
      authDomain: "billing-mabunet.firebaseapp.com",
      projectId: "billing-mabunet",
      storageBucket: "billing-mabunet.firebasestorage.app",
      messagingSenderId: "362703627315",
      appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46",
      measurementId: "G-2DBSV96KHP"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) { 
      console.error("Gagal menghubungkan Firebase:", e); 
    }

    // --- DATA DEFAULT ADMIN (Diperbarui dengan kolom email) ---
    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '08999999977', email: 'hilman@mabunet.com', photo: '', status: 'Aktif' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', email: '', photo: '', status: 'Aktif' },
      { id: 'admin3', username: 'admin3', password: '123', name: 'Admin Teknisi', role: 'Teknisi & CS', phone: '081200000003', email: '', photo: '', status: 'Aktif' }
    ];

    const PACKAGES = [
      { id: '5mbps_100', speed: '5 Mbps', price: 100000, label: '5 Mbps - Rp 100.000' },
      { id: '10mbps_150', speed: '10 Mbps', price: 150000, label: '10 Mbps - Rp 150.000' },
      { id: '10mbps_180', speed: '10 Mbps', price: 180000, label: '10 Mbps - Rp 180.000' },
      { id: '15mbps_200', speed: '15 Mbps', price: 200000, label: '15 Mbps - Rp 200.000' },
      { id: '20mbps_250', speed: '20 Mbps', price: 250000, label: '20 Mbps - Rp 250.000' },
      { id: '25mbps_300', speed: '25 Mbps', price: 300000, label: '25 Mbps - Rp 300.000' }
    ];
    const BLOCKS = ['Semua Blok', 'Mabu', 'Ranau', 'RG', 'Pesona', 'PLT'];
    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const YEARS = [2024, 2025, 2026, 2027, 2028, 2029, 2030];

    function App() {
      const [admins, setAdmins] = useState(INITIAL_ADMINS);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [isScanning, setIsScanning] = useState(false);
      const [showPassword, setShowPassword] = useState(false); // State Lihat Password
      
      const [isDarkMode, setIsDarkMode] = useState(true); // State Tema Gelap/Terang
      
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editProfile, setEditProfile] = useState({});
      
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');

      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [formData, setFormData] = useState({ name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '' });
      const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: 'Operasional', description: '', notes: '', amount: '' });
      const [editingCustomer, setEditingCustomer] = useState(null);

      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || { speed: 'Custom', price: 0 };
      const todayDay = new Date().getDate();

      // Efek Ganti Tema
      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      // Sinkronisasi Firebase
      useEffect(() => {
        if (!db) { setIsDbLoading(false); return; }
        try {
          const unsubAdmins = onSnapshot(collection(db, 'admins'), (snapshot) => {
            if (snapshot.empty) {
              INITIAL_ADMINS.forEach(async (adm) => { await setDoc(doc(db, 'admins', adm.id), adm); });
            } else {
              const cloudAdmins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAdmins(cloudAdmins);
              setCurrentUser(prevUser => {
                if (prevUser) {
                  const updatedUser = cloudAdmins.find(a => a.id === prevUser.id);
                  return updatedUser || prevUser;
                }
                return prevUser;
              });
            }
          });

          const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => (a.block || '').localeCompare(b.block || ''));
            setCustomers(data); setIsDbLoading(false);
          });

          const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setExpenses(data);
          });

          return () => { unsubAdmins(); unsubCustomers(); unsubExpenses(); };
        } catch(e) { console.error(e); setIsDbLoading(false); }
      }, []);

      // CRUD Functions
      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { await updateDoc(doc(db, 'customers', editingCustomer.id), formData); } 
        else { await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        await addDoc(collection(db, 'expenses'), { ...expenseForm, admin: currentUser.name });
        setIsExpenseModalOpen(false);
      };

      const handleDeleteCustomer = async (id) => {
        if(confirm("Yakin hapus pelanggan ini?")) await deleteDoc(doc(db, 'customers', id));
      };

      // Login Logic
      const handleLogin = (e) => {
        if(e) e.preventDefault();
        setLoginError('');
        const user = admins.find(a => a.username === loginForm.username && a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun Anda dinonaktifkan oleh Super Admin.');
          setCurrentUser(user); 
          setEditProfile(user);
          localStorage.setItem('mabunet_device_user', user.id); 
        } else { setLoginError('Username atau Password salah!'); }
      };

      const handleFingerprintScan = () => {
        setIsScanning(true); setLoginError('');
        setTimeout(() => {
          setIsScanning(false);
          const savedUserId = localStorage.getItem('mabunet_device_user');
          if (savedUserId) {
            const user = admins.find(a => a.id === savedUserId);
            if (user && user.status === 'Aktif') {
              setCurrentUser(user); 
              setEditProfile(user);
              return;
            }
          }
          setLoginError('Perangkat belum dikenali. Silakan Login Manual satu kali untuk menyimpan akses.');
        }, 2000);
      };

      // Profile Edit Logic
      const handlePhotoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setEditProfile({ ...editProfile, photo: reader.result });
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        if (!db) return alert("Firebase belum tersambung!");
        try {
          const updateData = {
            name: editProfile.name,
            username: editProfile.username,
            password: editProfile.password,
            email: editProfile.email || ''
          };
          // Hanya Admin 1 yang bisa save Phone & Photo
          if (currentUser.id === 'admin1') {
            updateData.phone = editProfile.phone;
            updateData.photo = editProfile.photo;
          }
          await updateDoc(doc(db, 'admins', currentUser.id), updateData);
          alert('Profil berhasil diperbarui!');
        } catch (error) { alert('Gagal menyimpan profil.'); }
      };

      const toggleAdminStatus = async (adminId, currentStatus) => {
        if (!db) return;
        const newStatus = currentStatus === 'Aktif' ? 'Tidak Aktif' : 'Aktif';
        await updateDoc(doc(db, 'admins', adminId), { status: newStatus });
      };

      // WA Logic
      const sendWAInvoice = (cust) => {
        const pkg = getPackage(cust.packageId);
        const text = `*TAGIHAN MABUNET*\nYth. Bapak/Ibu: *${cust.name}* (Blok ${cust.block})\nBulan: *${MONTHS[selectedMonth]} ${selectedYear}*\nTagihan: *${formatIDR(pkg.price)}*\nJatuh Tempo: *Tgl ${cust.dueDate}*\n\nMohon bayar ke BCA 1234567890. Abaikan jika sudah lunas.`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };
      
      const sendWAReceipt = (cust, monthKey) => {
        const pkg = getPackage(cust.packageId); const [y, m] = monthKey.split('-');
        const text = `*KUITANSI MABUNET*\nTerima kasih Bapak/Ibu *${cust.name}*.\nPembayaran internet paket *${pkg.speed}* untuk bulan *${MONTHS[parseInt(m) - 1]} ${y}* sebesar *${formatIDR(pkg.price)}* berstatus *LUNAS*.`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Calculations
      const activeCustomersList = customers.filter(c => c.status === 'Aktif');
      const dueCustomers = activeCustomersList.filter(c => !c.payments || !c.payments[currentPeriodKey]).sort((a, b) => a.dueDate - b.dueDate);
      const customersDueToday = dueCustomers.filter(c => c.dueDate === todayDay);
      
      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const actualPaidRevenue = activeCustomersList.filter(c => c.payments && c.payments[currentPeriodKey]).reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const totalExpenseAmount = expenses.filter(e => e.date && e.date.startsWith(currentPeriodKey)).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const netProfit = actualPaidRevenue - totalExpenseAmount;

      const filteredCustomers = customers.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : (c.notes || '').includes(filterBlock) || c.block.includes(filterBlock);
        return matchSearch && matchBlock;
      });

      useEffect(() => { if (alarmEnabled && customersDueToday.length > 0) audioRef.current.play().catch(e => console.log(e)); }, [alarmEnabled, customersDueToday.length]);

      // ==========================================
      // VIEW: SCREEN LOGIN
      // ==========================================
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-100 via-slate-200 to-slate-200 dark:from-slate-800 dark:via-slate-950 dark:to-slate-950 transition-colors duration-300">
            <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-300 dark:border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl relative overflow-hidden my-8">
              <div className="absolute -top-20 -right-20 w-40 h-40 bg-indigo-600/20 blur-3xl rounded-full"></div>
              
              {!db && (
                <div className="mb-4 p-2 bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-[10px] rounded-lg text-center font-bold">
                  ⚠️ KONEKSI FIREBASE TERGANGGU. COBA REFRESH.
                </div>
              )}

              {/* Tema Toggle di Login */}
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-4 right-4 text-slate-500 hover:text-indigo-500 transition-colors">
                {isDarkMode ? <Sun size={20}/> : <Moon size={20}/>}
              </button>

              <div className="text-center mb-6 relative z-10">
                <div className="inline-flex p-3 rounded-2xl bg-indigo-600/10 dark:bg-indigo-600/20 text-indigo-600 dark:text-indigo-400 mb-4 pulse-glow"><Wifi size={36} /></div>
                <h1 className="text-3xl font-extrabold tracking-tight text-slate-800 dark:text-white">MABU<span className="text-indigo-600 dark:text-indigo-400">NET</span></h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 uppercase font-semibold">Real-time Cloud Gateway</p>
              </div>

              {loginError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs rounded-xl flex items-center gap-2"><ShieldAlert size={14}/> {loginError}</div>}

              <form onSubmit={handleLogin} className="space-y-4 relative z-10 mt-6">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><User size={16} /></div>
                  <input type="text" placeholder="Username (misal: admin2)" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                </div>
                
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><Lock size={16} /></div>
                  <input type={showPassword ? "text" : "password"} placeholder="Password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-10 py-2.5 text-sm outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400">
                    {showPassword ? <EyeOff size={16}/> : <Eye size={16}/>}
                  </button>
                </div>
                
                <div className="flex justify-end">
                  <button type="button" onClick={() => alert('Silakan hubungi Super Admin (Hilman) untuk mereset atau mengecek password Anda.')} className="text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Lupa Password?</button>
                </div>

                <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow-lg hover:bg-indigo-700 transition-colors">Masuk Aplikasi</button>
              </form>

              <div className="w-full border-t border-slate-300 dark:border-slate-800 my-6 relative z-10"><span className="absolute left-1/2 -translate-x-1/2 -top-2.5 bg-white dark:bg-slate-900 px-2 text-xs text-slate-500 font-semibold transition-colors">ATAU</span></div>

              <div className="mt-2 flex flex-col items-center relative z-10">
                <button onClick={handleFingerprintScan} disabled={isScanning} className="relative group flex flex-col items-center gap-2">
                  <div className={`w-14 h-14 rounded-2xl flex items-center justify-center border transition-all overflow-hidden relative ${isScanning ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-600 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>
                    <Fingerprint size={28} strokeWidth={isScanning ? 2 : 1.5} className={isScanning ? 'opacity-50' : ''}/>
                    {isScanning && <div className="scanner-line"></div>}
                  </div>
                  <span className={`text-[10px] font-semibold text-center ${isScanning ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400'}`}>
                    {isScanning ? 'Memindai...' : 'Login Fingerprint'} <br/> <span className="font-normal text-[8px] opacity-70">(Ingat Perangkat Saya)</span>
                  </span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW: MAIN DASHBOARD
      // ==========================================
      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col relative transition-colors duration-300">
          
          {/* HEADER (MOBILE ONLY) */}
          <header className="md:hidden fixed top-0 inset-x-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 z-40 flex items-center justify-between px-4 shadow-sm dark:shadow-lg transition-colors">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900 flex items-center justify-center overflow-hidden border border-indigo-500/30">
                {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover" /> : <User size={20} className="text-indigo-600 dark:text-indigo-400" />}
              </div>
              <div>
                <h2 className="font-bold text-sm leading-tight text-slate-800 dark:text-slate-200">{currentUser.name}</h2>
                <p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold">{currentUser.role}</p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-500 hover:text-indigo-500">
                {isDarkMode ? <Sun size={18}/> : <Moon size={18}/>}
              </button>
              {db ? <Server size={18} className="text-emerald-500 dark:text-emerald-400" /> : <Server size={18} className="text-rose-500 dark:text-rose-400 animate-pulse" />}
            </div>
          </header>

          {/* RESPONSIVE NAV-BAR (BOTTOM DI HP, KIRI DI PC) */}
          <aside className="fixed z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-slate-200 dark:border-slate-800 flex items-center shadow-[0_-4px_24px_rgba(0,0,0,0.05)] dark:shadow-[0_0_24px_rgba(0,0,0,0.5)] 
                            inset-x-0 bottom-0 h-16 flex-row justify-around px-2 border-t transition-colors
                            md:inset-y-0 md:left-0 md:w-20 md:h-screen md:flex-col md:justify-start md:py-6 md:px-0 md:border-r md:border-t-0 md:shadow-[4px_0_24px_rgba(0,0,0,0.05)]">
            
            {/* Profile Avatar (PC Only) */}
            <div className="hidden md:flex w-12 h-12 rounded-2xl bg-indigo-100 dark:bg-indigo-900 items-center justify-center overflow-hidden mb-8 border border-indigo-500/30 shadow-lg shadow-indigo-500/20 cursor-pointer" title={currentUser.name}>
              {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover" /> : <User size={24} className="text-indigo-600 dark:text-indigo-400" />}
            </div>
            
            {/* Nav Icons */}
            <nav className="flex flex-row md:flex-col gap-2 md:gap-4 w-full md:px-4 items-center justify-around md:justify-start flex-1">
              
              <button onClick={() => setActiveTab('dashboard')} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <LayoutDashboard size={22} />
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium">Dashboard</span>
              </button>
              
              <button onClick={() => setActiveTab('customers')} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'customers' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <div className="relative">
                  <Users size={22} />
                  {isDbLoading && <span className="absolute -top-1 -right-1 w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></span>}

                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium">Data Pelanggan</span>
              </button>
              
              <button onClick={() => setActiveTab('ledger')} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <BookOpen size={22} />
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium">Buku Kas</span>
              </button>
              
              <div className="hidden md:block w-full h-px bg-slate-200 dark:bg-slate-800 my-2"></div>
              <div className="md:hidden w-px h-8 bg-slate-200 dark:bg-slate-800 mx-1"></div>
              
              <button onClick={() => setActiveTab('settings')} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <Settings size={22} />
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium">Pengaturan</span>
              </button>

              {/* Logout Icon (Mobile Only) */}
              <button onClick={() => { setCurrentUser(null); localStorage.removeItem('mabunet_device_user'); }} className="md:hidden relative group flex justify-center p-3 rounded-xl text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all">
                <LogOut size={22} />
              </button>
            </nav>
            
            {/* Bottom System Icons (PC Only) */}
            <div className="hidden md:flex mt-auto px-4 w-full flex-col gap-4 items-center">
              
              {/* Theme Toggle PC */}
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="relative group flex justify-center p-3 rounded-xl text-amber-500 hover:bg-amber-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-all">
                {isDarkMode ? <Sun size={22}/> : <Moon size={22}/>}
                <span className="absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium">Ubah Tema</span>
              </button>

              <div className="relative group cursor-help">
                {db ? <Server size={18} className="text-emerald-500 dark:text-emerald-400" /> : <Server size={18} className="text-rose-500 dark:text-rose-400 animate-pulse" />}
                <span className="absolute left-10 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700">Status Server</span>
              </div>
              
              <button onClick={() => { setCurrentUser(null); localStorage.removeItem('mabunet_device_user'); }} className="relative group w-full flex justify-center p-3 rounded-xl text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all">
                <LogOut size={22} />
                <span className="absolute left-16 top-1/2 -translate-y-1/2 bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-rose-200 dark:border-rose-900 font-bold">Keluar</span>
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 w-full pt-20 pb-24 px-4 md:pt-8 md:pb-8 md:px-8 md:ml-20 overflow-y-auto space-y-6">
            
            {activeTab !== 'settings' && (
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
                <div className="flex items-center gap-4">
                  <h2 className="text-xl font-bold">Periode Aktif</h2>

                    {alarmEnabled ? <Volume2 size={16}/> : <VolumeX size={16}/>} {alarmEnabled ? 'Alarm ON' : 'Alarm OFF'}
                  </button>
                </div>
                <div className="flex items-center gap-2">
                  <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none transition-colors">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                  <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                </div>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Total Pelanggan</p><h3 className="text-3xl font-extrabold">{customers.length}</h3><p className="text-xs text-emerald-600 dark:text-emerald-400 mt-2">{activeCustomersList.length} Aktif</p></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Potensi Omset</p><h3 className="text-2xl font-extrabold">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Telah Terbayar</p><h3 className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">{formatIDR(actualPaidRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl font-extrabold ${netProfit >= 0 ? 'text-indigo-600 dark:text-indigo-400' : 'text-rose-600 dark:text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                {customersDueToday.length > 0 && (
                  <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-500/50 p-5 rounded-2xl shadow-[0_4px_20px_rgba(244,63,94,0.1)] dark:shadow-[0_0_20px_rgba(244,63,94,0.2)] transition-colors">
                    <div className="flex items-center gap-4">
                      <div className="p-3 bg-rose-200 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full animate-ring"><BellRing size={28}/></div>
                      <div><h3 className="text-lg font-bold text-rose-700 dark:text-rose-400">Peringatan Jatuh Tempo Hari Ini! (Tgl {todayDay})</h3><p className="text-sm text-slate-600 dark:text-slate-300">Ada {customersDueToday.length} pelanggan yang harus ditagih hari ini.</p></div>
                    </div>
                  </div>
                )}

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-xl transition-colors">
                  <div className="p-5 border-b border-slate-200 dark:border-slate-800"><h3 className="font-bold flex items-center gap-2"><Bell size={18} className="text-rose-500 dark:text-rose-400"/> Daftar Tagihan Belum Lunas ({dueCustomers.length})</h3></div>
                  <div className="overflow-x-auto p-2">
                    <table className="w-full text-left text-sm min-w-[700px]">
                      <thead><tr className="text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800"><th className="py-3 px-4">Pelanggan</th><th className="py-3 px-4">Tagihan</th><th className="py-3 px-4">Jatuh Tempo</th><th className="py-3 px-4 text-right">Aksi</th></tr></thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {dueCustomers.map(cust => (
                          <tr key={cust.id} className={cust.dueDate === todayDay ? 'bg-rose-50 dark:bg-rose-500/10' : 'hover:bg-slate-50 dark:hover:bg-slate-800/40'}>
                            <td className="py-3 px-4"><span className="text-xs bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded mr-2">{cust.block}</span>{cust.name}</td>
                            <td className="py-3 px-4 font-semibold">{formatIDR(getPackage(cust.packageId).price)}</td>
                            <td className={`py-3 px-4 font-bold ${cust.dueDate === todayDay ? 'text-rose-600 dark:text-rose-400' : 'text-slate-600 dark:text-slate-300'}`}>Tgl {cust.dueDate}</td>
                            <td className="py-3 px-4 text-right space-x-2">
                              <button onClick={() => sendWAInvoice(cust)} className="px-3 py-1.5 bg-rose-600 rounded-lg text-white text-xs font-semibold hover:bg-rose-700">WA Tagih</button>
                              <button onClick={() => togglePayment(cust.id, currentPeriodKey)} className="px-3 py-1.5 bg-indigo-600 rounded-lg text-white text-xs font-semibold hover:bg-indigo-700">Set Lunas</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-6">
                <div className="flex flex-wrap gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
                  <input type="text" placeholder="Cari Nama/Blok..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm flex-1 text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors"/>
                  <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors">{BLOCKS.map(b => <option key={b}>{b}</option>)}</select>
                  <button onClick={() => { setEditingCustomer(null); setFormData({name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: ''}); setIsCustomerModalOpen(true); }} className="px-4 py-2 bg-indigo-600 rounded-xl text-white text-sm font-semibold shadow-lg hover:bg-indigo-700">Tambah Baru</button>
                </div>

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-x-auto shadow-xl transition-colors">
                  {isDbLoading ? (
                    <div className="p-12 text-center text-slate-500 dark:text-slate-400 animate-pulse">Memuat Data dari Cloud...</div>
                  ) : customers.length === 0 ? (
                    <div className="p-12 text-center text-rose-500 font-bold">Data Pelanggan Kosong!</div>
                  ) : (
                    <table className="w-full text-left text-sm min-w-[1200px]">
                      <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-3 px-4 w-48">Pelanggan</th>
                          <th className="py-3 px-4">Paket</th>
                          {MONTHS.map((m, i) => <th key={i} className="py-3 px-2 text-center text-[10px] uppercase tracking-wider">{m.substring(0,3)}</th>)}
                          <th className="py-3 px-4 text-right">Opsi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {filteredCustomers.map(cust => (
                          <tr key={cust.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                            <td className="py-3 px-4">
                              <div className="font-bold text-indigo-600 dark:text-indigo-300">{cust.block}</div>
                              <div className="font-semibold">{cust.name}</div>
                              <div className={`text-[10px] border px-1 py-0.5 rounded inline-block mt-1 ${cust.status === 'Aktif' ? 'text-emerald-700 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/30 bg-emerald-100 dark:bg-emerald-500/10' : 'text-rose-700 dark:text-rose-400 border-rose-300 dark:border-rose-500/30 bg-rose-100 dark:bg-rose-500/10'}`}>{cust.status}</div>
                            </td>
                            <td className="py-3 px-4 text-xs"><span className="font-medium text-slate-800 dark:text-slate-100">{getPackage(cust.packageId).speed}</span><br/><span className="text-slate-500 dark:text-slate-400">{formatIDR(getPackage(cust.packageId).price)}</span><br/><span className="text-amber-600 dark:text-amber-400 font-bold">Tgl {cust.dueDate}</span></td>
                            
                            {MONTHS.map((m, i) => {
                              const monthKey = `${selectedYear}-${String(i + 1).padStart(2, '0')}`;
                              const isPaid = cust.payments && cust.payments[monthKey];
                              return (
                                <td key={i} className="py-3 px-1 text-center">
                                  <button onClick={() => togglePayment(cust.id, monthKey)} className={`w-8 h-8 rounded-lg flex items-center justify-center border transition-all ${isPaid ? 'bg-emerald-100 dark:bg-emerald-500/20 border-emerald-500 text-emerald-600 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                                    {isPaid ? <Check size={16} strokeWidth={3} /> : <span className="text-[10px]">{i+1}</span>}
                                  </button>
                                </td>
                              );
                            })}
                            
                            <td className="py-3 px-4 text-right space-x-1">
                              <button onClick={() => sendWAReceipt(cust, currentPeriodKey)} className="p-2 hover:text-emerald-500 text-slate-400" title="Kirim Nota"><FileText size={16} /></button>
                              <button onClick={() => { setEditingCustomer(cust); setFormData(cust); setIsCustomerModalOpen(true); }} className="p-2 hover:text-indigo-500 text-slate-400" title="Edit"><Edit3 size={16} /></button>
                              <button onClick={() => handleDeleteCustomer(cust.id)} className="p-2 hover:text-rose-500 text-slate-400" title="Hapus"><Trash2 size={16} /></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'ledger' && (
              <div className="space-y-6">
                <div className="flex justify-between bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
                  <h3 className="text-lg font-bold">Buku Kas Pengeluaran</h3>
                  <button onClick={() => setIsExpenseModalOpen(true)} className="px-4 py-2 bg-rose-600 rounded-xl text-white text-sm font-semibold flex gap-2 shadow-lg hover:bg-rose-700"><Plus size={16}/> Catat Kas</button>
                </div>
                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-xl transition-colors">
                  <table className="w-full text-left text-sm min-w-[700px]">
                    <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800"><tr><th className="py-3 px-4">Tanggal</th><th className="py-3 px-4">Uraian</th><th className="py-3 px-4">Catatan Manual</th><th className="py-3 px-4">Admin</th><th className="py-3 px-4">Nominal</th></tr></thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {expenses.filter(e => e.date.startsWith(currentPeriodKey)).map(exp => (
                        <tr key={exp.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                          <td className="py-3 px-4">{exp.date}</td>
                          <td className="py-3 px-4 font-medium"><span className="text-[10px] bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded mr-2 border border-slate-200 dark:border-slate-700">{exp.category}</span>{exp.description}</td>
                          <td className="py-3 px-4 text-slate-500 dark:text-slate-400 italic">{exp.notes || '-'}</td>
                          <td className="py-3 px-4 text-xs">{exp.admin}</td>
                          <td className="py-3 px-4 font-bold text-rose-600 dark:text-rose-400">{formatIDR(exp.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB: SETTINGS (PROFIL & ADMIN) */}
            {activeTab === 'settings' && (
              <div className="space-y-6 max-w-4xl mx-auto">
                <h2 className="text-2xl font-bold border-b border-slate-200 dark:border-slate-800 pb-4 transition-colors">Pengaturan Aplikasi</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  
                  {/* PROFIL SAYA (TAMPIL UNTUK SEMUA ADMIN TAPI DIBATASI BERDASARKAN ROLE) */}
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xl transition-colors">
                    <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-indigo-600 dark:text-indigo-400"><User size={20}/> Profil Saya ({currentUser.role})</h3>
                    <form onSubmit={handleSaveProfile} className="space-y-4">
                      
                      {/* Foto profil HANYA BISA DIEDIT ADMIN 1 */}
                      {currentUser.id === 'admin1' ? (
                        <div className="flex items-center gap-4 mb-6">
                          <div className="relative w-20 h-20 rounded-full border-2 border-indigo-500 overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center group">
                            {editProfile.photo ? <img src={editProfile.photo} className="w-full h-full object-cover" /> : <User size={32} className="text-slate-400" />}
                            <label className="absolute inset-0 bg-black/60 flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer"><Camera size={20} className="text-white" /><input type="file" accept="image/*" onChange={handlePhotoUpload} className="hidden" /></label>
                          </div>
                          <div><p className="text-sm font-semibold">Foto Profil</p><p className="text-xs text-slate-500 dark:text-slate-400">Klik ikon foto untuk mengubah.</p></div>
                        </div>
                      ) : (
                        <div className="flex items-center gap-4 mb-6">
                           <div className="w-16 h-16 rounded-full border-2 border-slate-300 dark:border-slate-700 overflow-hidden bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
                            {editProfile.photo ? <img src={editProfile.photo} className="w-full h-full object-cover" /> : <User size={28} className="text-slate-400" />}
                          </div>
                          <div><p className="text-sm font-semibold text-slate-500">Foto Profil Kunci</p><p className="text-xs text-slate-400">Hubungi Super Admin.</p></div>
                        </div>
                      )}
                      
                      <div><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nama Lengkap</label><input type="text" required value={editProfile.name} onChange={e => setEditProfile({...editProfile, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                      <div><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Username (Nickname Login)</label><input type="text" required value={editProfile.username} onChange={e => setEditProfile({...editProfile, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                      
                      <div className="relative">
                        <label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Password Baru</label>
                        <input type={showPassword ? "text" : "password"} required value={editProfile.password} onChange={e => setEditProfile({...editProfile, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl pl-4 pr-10 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" />
                        <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute bottom-2 right-3 text-slate-400 hover:text-indigo-500">
                          {showPassword ? <EyeOff size={16}/> : <Eye size={16}/>}
                        </button>
                      </div>

                      <div><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Email Anda</label><input type="email" placeholder="Contoh: admin@gmail.com" value={editProfile.email} onChange={e => setEditProfile({...editProfile, email: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                      
                      {/* WA HANYA BISA DIEDIT ADMIN 1 */}
                      {currentUser.id === 'admin1' && (
                        <div><label className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Nomor WhatsApp Pribadi</label><input type="text" required value={editProfile.phone} onChange={e => setEditProfile({...editProfile, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                      )}
                      
                      <button type="submit" className="w-full py-2.5 mt-2 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg hover:bg-indigo-700">Simpan Profil</button>
                    </form>
                  </div>
                  
                  {/* KELOLA AKSES ADMIN (HANYA MUNCUL UNTUK SUPER ADMIN/ADMIN 1) */}
                  {currentUser.id === 'admin1' && (
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-xl transition-colors">
                      <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-rose-600 dark:text-rose-400"><ShieldAlert size={20}/> Kelola Akses Admin</h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">Matikan tombol di bawah jika Anda ingin memblokir Admin lain agar tidak bisa masuk ke aplikasi.</p>
                      <div className="space-y-3">
                        {admins.filter(a => a.id !== 'admin1').map(admin => (
                          <div key={admin.id} className={`flex items-center justify-between p-4 rounded-xl border transition-colors ${admin.status === 'Aktif' ? 'bg-slate-50 dark:bg-slate-800/50 border-slate-200 dark:border-slate-700' : 'bg-rose-50 dark:bg-rose-950/20 border-rose-200 dark:border-rose-900/50'}`}>
                            <div><p className="font-bold text-sm text-slate-800 dark:text-slate-100">{admin.name}</p><p className="text-xs text-slate-500 dark:text-slate-400">Username: <span className="text-slate-600 dark:text-slate-300 font-mono">{admin.username}</span></p></div>
                            <button onClick={() => toggleAdminStatus(admin.id, admin.status)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${admin.status === 'Aktif' ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400' : 'bg-rose-100 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400'}`}>
                              {admin.status === 'Aktif' ? 'Akses Aktif' : 'Akses Diblokir'}
                              {admin.status === 'Aktif' ? <ToggleRight size={18}/> : <ToggleLeft size={18}/>}
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  
                </div>
              </div>
            )}
          </main>

          {/* MODALS CRUD PELANGGAN/KAS */}
          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-lg p-6 shadow-2xl transition-colors">
                <h3 className="text-lg font-bold mb-4 text-slate-800 dark:text-slate-100">{editingCustomer ? 'Edit Pelanggan' : 'Tambah Pelanggan Baru'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <input type="text" required placeholder="Blok (Misl: A2)" value={formData.block} onChange={e => setFormData({...formData, block: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm uppercase text-slate-800 dark:text-slate-100"/>
                    <input type="text" required placeholder="Nama Pelanggan" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  </div>
                  <input type="text" placeholder="No HP/WA (0812...)" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  <select value={formData.packageId} onChange={e => setFormData({...formData, packageId: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100">{PACKAGES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}</select>
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" required placeholder="Tgl Tempo (1-31)" min="1" max="31" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: parseInt(e.target.value)})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                    <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"><option value="Aktif">Aktif</option><option value="Tidak Aktif">Tidak Aktif</option><option value="Isolir">Isolir</option></select>
                  </div>
                  <input type="text" placeholder="Keterangan (Opsional)" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsCustomerModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg hover:bg-indigo-700">Simpan ke Cloud</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isExpenseModalOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 dark:bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl transition-colors">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100"><CloudLightning size={20} className="text-indigo-600 dark:text-indigo-400"/> Input Kas Keluar</h3>
                <form onSubmit={handleSaveExpense} className="space-y-4">
                  <input type="date" required value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100">
                    <option value="Operasional">Operasional</option><option value="Maintenance">Maintenance</option><option value="Lainnya">Lainnya</option>
                  </select>
                  <input type="text" required placeholder="Uraian Singkat" value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  <textarea placeholder="Catatan Manual (Opsional)" rows="2" value={expenseForm.notes} onChange={e => setExpenseForm({...expenseForm, notes: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm resize-none text-slate-800 dark:text-slate-100"></textarea>
                  <input type="number" required placeholder="Nominal (Rp)" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-800 dark:text-slate-100"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-rose-600 text-white font-semibold shadow-lg hover:bg-rose-700">Simpan Pengeluaran</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
