    const compressImageFile = (file, maxWidth = 900, quality = 0.75) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width; let height = img.height;
            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject; img.src = event.target.result;
        };
        reader.onerror = reject; reader.readAsDataURL(file);
      });
    };

      if (typeof direct === 'string' && (direct.startsWith('data:image') || direct.startsWith('http') || direct.startsWith('blob:'))) return direct;
      for (const key of Object.keys(obj)) {
        const val = obj[key];
        if (typeof val === 'string' && val.startsWith('data:image/')) return val;
      }
      return null;
    };

      const handleSelectChatImage = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const compressed = await compressImageFile(file, 900, 0.75);
          setChatImagePreview(compressed);
        } catch (err) { alert("Gagal memproses gambar: " + err.message); }
        e.target.value = null;
      };

      const handleStartNewChatWithCustomer = async (cust) => {
        if (!cust || !db) return;
        const existing = tickets.find(t => 
          t.status !== 'Closed' && (
            t.customerId === cust.id || 
            (t.phone && cust.phone && cleanPhone(t.phone) === cleanPhone(cust.phone)) ||
            (t.customerName && t.customerName.toLowerCase() === cust.name.toLowerCase())
          )
        );
        if (existing) {
          setActiveTicket(existing);
          setIsNewChatModalOpen(false);
          return;
        }
        try {
          const newDoc = await addDoc(collection(db, 'tickets'), {
            customerId: cust.id,
            customerName: cust.name,
            name: cust.name,
            block: cust.block,
            phone: cust.phone || '',
            pppoe_user: cust.pppoe_user || '',
            issueType: 'Obrolan Layanan MABUNET',
            subject: 'Obrolan Layanan MABUNET',
            status: 'In Progress',
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
            time: Date.now(),
            messages: []
          });
          setActiveTicket({
            id: newDoc.id,
            customerId: cust.id,
            customerName: cust.name,
            name: cust.name,
            block: cust.block,
            phone: cust.phone || '',
            issueType: 'Obrolan Layanan MABUNET',
            status: 'In Progress'
          });
          setIsNewChatModalOpen(false);
        } catch (err) { alert("Gagal membuat ruang obrolan: " + err.message); }
      };

      const handleSendChat = async (e) => {
          e.preventDefault();
          if ((!newChatInput.trim() && !chatImagePreview) || !activeTicket) return;
          const textVal = newChatInput.trim() || (chatImagePreview ? '📷 Mengirim Foto' : '');
          const imgVal = chatImagePreview || null;

          const msgObj = {
              id: 'msg_' + Date.now(),
              sender: currentUser.name,
              senderName: currentUser.name,
              senderType: 'admin',
              role: 'admin',
              isAdmin: true,
              text: textVal,
              message: textVal,
              attachmentUrl: imgVal,
              imageUrl: imgVal,
              image: imgVal,
              time: Date.now(),
              dateStr: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
          };
          try {
              setNewChatInput('');
              setChatImagePreview(null);

              await addDoc(collection(db, 'tickets', activeTicket.id, 'messages'), {
                  ...msgObj,
                  timestamp: serverTimestamp()
              });
              await updateDoc(doc(db, 'tickets', activeTicket.id), {
                  status: 'In Progress',
                  lastReply: textVal,
                  lastImage: imgVal || null,
                  updatedAt: serverTimestamp(),
                  messages: arrayUnion(msgObj),
                  chats: arrayUnion(msgObj)
              });
          } catch (err) { alert("Gagal kirim pesan: " + err.message); }
      };

      const closeTicket = async (ticketId) => {
          if (confirm("Tandai obrolan ini sebagai Selesai?")) {
              await updateDoc(doc(db, 'tickets', ticketId), { status: 'Closed' });
              setActiveTicket(null);
          }
      };

      const handleApprove = async (approvalData) => {
          const info = getApprovalInfo(approvalData);
          if (!confirm(`Yakin menyetujui (Approve) permohonan dari ${info.name}?`)) return;
          try {
              const custDoc = info.matched || customers.find(c => c.id === approvalData.customerId);
              if (!custDoc) throw new Error("Data pelanggan tidak ditemukan!");

              const targetPkg = approvalData.targetPackageId || approvalData.newPackageId || approvalData.packageId;
              if (approvalData.type === 'upgrade' || approvalData.category === 'upgrade') {
                  await addDoc(collection(db, 'mikrotik_commands'), {
                      action: 'UPGRADE_PACKAGE',
                      pppoeUser: custDoc.pppoe_user,
                      packageId: targetPkg
                  });
                  await updateDoc(doc(db, 'customers', custDoc.id), { packageId: targetPkg, pendingUpgrade: firebase.firestore.FieldValue.delete() });
              } else {
                  const monthKey = approvalData.monthKey || approvalData.period || currentPeriodKey;
                  await updateDoc(doc(db, 'customers', custDoc.id), { [`payments.${monthKey}`]: true });
              }

              await updateDoc(doc(db, 'approvals', approvalData.id), {
                  status: 'approved',
                  approvedBy: currentUser.name,
                  approvedAt: serverTimestamp()
              });
              alert("Proses Approve Berhasil!");
          } catch (err) { alert("Gagal memproses approval: " + err.message); }
      };

      const handleRejectApprove = async (approvalId) => {
          if (confirm("Tolak permohonan ini?")) {
              await updateDoc(doc(db, 'approvals', approvalId), { status: 'rejected', rejectedBy: currentUser.name });
          }
      };

      // FUNGSI LAINNYA (Customer, Expense, Mikrotik)
      const handleSaveMikrotikData = async (e) => {
          e.preventDefault();
          try {
              let actionName = ''; let payload = {};
              if (mikrotikFormType === 'secret') {
                  actionName = editingMikrotikData ? 'EDIT_SECRET' : 'ADD_SECRET';
                  payload = { name: mikrotikForm.name, password: mikrotikForm.password, profile: mikrotikForm.profile, comment: mikrotikForm.comment };
              } else if (mikrotikFormType === 'hotspot_user') {
                  actionName = editingMikrotikData ? 'EDIT_HOTSPOT_USER' : 'ADD_HOTSPOT_USER';
                  payload = { name: mikrotikForm.name, password: mikrotikForm.password, profile: mikrotikForm.profile, server: mikrotikForm.server, comment: mikrotikForm.comment };
              } else if (mikrotikFormType === 'ip_binding') {
                  actionName = editingMikrotikData ? 'EDIT_IP_BINDING' : 'ADD_IP_BINDING';
                  payload = { macAddress: mikrotikForm.macAddress, address: mikrotikForm.address, type: mikrotikForm.type, server: mikrotikForm.server, comment: mikrotikForm.comment };
              }
              if (editingMikrotikData) payload.targetId = editingMikrotikData.id;
              await addDoc(collection(db, 'mikrotik_commands'), { action: actionName, ...payload });
              setIsMikrotikModalOpen(false);
          } catch(err) { alert("Gagal: " + err.message); }
      }
      
      const runMikrotikCommand = async (action, id, itemName, alertMessage) => {
          if(confirm(alertMessage || `Jalankan aksi pada ${itemName}?`)){
              try { await addDoc(collection(db, 'mikrotik_commands'), { action: action, targetId: id }); } catch(err) { alert("Gagal: " + err.message); }
          }
      }

      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { await updateDoc(doc(db, 'customers', editingCustomer.id), formData); } 
        else { await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        const finalApplicant = expenseForm.applicantSelect === 'Manual' ? expenseForm.applicantCustom : expenseForm.applicantSelect;
        const dataToSave = { date: expenseForm.date, category: expenseForm.category, applicant: finalApplicant, description: expenseForm.description, amount: expenseForm.amount, admin: currentUser.name };
        if (editingExpense) { await updateDoc(doc(db, 'expenses', editingExpense.id), dataToSave); } 
        else { await addDoc(collection(db, 'expenses'), dataToSave); }
        setIsExpenseModalOpen(false); setEditingExpense(null);
      };

      const handleDeleteCustomer = async (id) => {
        if(confirm(`Yakin ingin menghapus data pelanggan ini?`)) { await deleteDoc(doc(db, 'customers', id)); }
      };

      const handleDeleteExpense = async (id) => {
        if(confirm("Yakin hapus catatan pengeluaran ini?")) { await deleteDoc(doc(db, 'expenses', id)); }
      };

      const toggleIsolirManual = async (cust) => {
        if(confirm(`Yakin ${cust.status === 'Aktif' ? 'ISOLIR' : 'AKTIFKAN'} internet pelanggan ${cust.name}?`)) {
          await updateDoc(doc(db, 'customers', cust.id), { status: cust.status === 'Aktif' ? 'Non-Aktif' : 'Aktif' });
        }
      };

      const handleLogin = (e) => {
        if(e) e.preventDefault(); setLoginError('');
        const user = admins.find(a => a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun dinonaktifkan.');
          setCurrentUser(user); setEditProfile(user);
          localStorage.setItem('mabunet_session', user.id); 
        } else { setLoginError('Password salah!'); }
      };

      const handleLogout = () => { setCurrentUser(null); localStorage.removeItem('mabunet_session'); };

      const netProfit = actualPaidRevenue - displayedExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const filteredCustomers = customers.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : (c.notes || '').includes(filterBlock) || c.block.includes(filterBlock);
        return matchSearch && matchBlock;
      });
      const unreadTicketsCount = tickets.filter(t => !t.status || t.status === 'New' || t.status === 'Open' || t.status === 'Baru').length;

      return (
        <div className="flex h-screen w-full bg-kai-bg dark:bg-slate-900 text-slate-800 dark:text-slate-100 overflow-hidden">
          
          {/* SIDEBAR DESKTOP */}
          <aside className={`hidden lg:flex flex-col h-full bg-kai-blue text-white shadow-xl z-40 relative transition-all duration-300 ${isSidebarCollapsed ? 'w-20' : 'w-64'}`}>
            <div className={`p-5 flex items-center ${isSidebarCollapsed ? 'justify-center px-0' : 'gap-3'}`}>
              <img src="./mabunetlogo.png" className="w-8 h-8 object-contain shrink-0" onError={(e) => { e.target.style.display = 'none'; }} />
              {!isSidebarCollapsed && (
                <div><h2 className="font-black text-lg tracking-tight">MABUNET</h2><p className="text-[9px] font-bold text-kai-orange uppercase tracking-widest">Admin Panel</p></div>
              )}
            </div>

            {!isSidebarCollapsed && (
              <div className="px-5 mb-6 mt-2">
                <div className="bg-kai-bluedark rounded-xl p-3 flex items-center gap-3">
                  <div className="w-9 h-9 rounded-full overflow-hidden bg-slate-700 shrink-0 border border-slate-600">
                    {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover" /> : <User className="w-full h-full p-1.5 text-slate-300" />}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="font-bold text-sm truncate">{currentUser.name}</p>
                    <p className="text-[9px] font-black text-slate-400 truncate uppercase mt-0.5">{currentUser.role}</p>
                  </div>
                </div>
              </div>
            )}

            <nav className="flex-1 px-3 overflow-y-auto custom-scrollbar">
              <SidebarItem id="dashboard" icon={LayoutDashboard} label="Beranda" />
              <SidebarItem id="customers" icon={Users} label="Data Pelanggan" badgeCount={pendingApprovals.length} />
              <SidebarItem id="tickets" icon={MessageCircle} label="Chat & Layanan" badgeCount={unreadTicketsCount} />
              <SidebarItem id="ledger" icon={Wallet} label="Kas Keuangan" />
              {currentUser.id === 'admin1' && <SidebarItem id="mikrotik" icon={Server} label="MikroTik" />}
              <SidebarItem id="portal" icon={Globe} label="Portal Web" />
              <div className="my-3 h-px bg-kai-bluedark mx-2"></div>
              <SidebarItem id="settings" icon={Settings} label="Pengaturan" />
            </nav>

            <div className="p-3 border-t border-kai-bluedark">
              <button onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)} className="w-full flex items-center justify-center gap-2 p-2 rounded-lg text-xs font-bold hover:bg-kai-bluedark text-slate-400 mb-1">
                {isSidebarCollapsed ? <ChevronRight className="w-4 h-4"/> : <><ChevronLeft className="w-4 h-4"/> Sembunyikan</>}
              </button>
              <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 p-2 text-rose-400 rounded-lg text-xs font-bold hover:bg-kai-bluedark"><LogOut className="w-4 h-4"/> Keluar</button>
            </div>
          </aside>

          {/* MAIN CONTENT AREA */}
          <div className="flex-1 flex flex-col h-full overflow-hidden relative">
            <div className="hidden lg:flex items-center justify-end p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 gap-3">
              <div className="flex items-center bg-slate-100 dark:bg-slate-800 rounded-full px-4 py-1.5 gap-2">
                <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-transparent text-sm font-bold outline-none cursor-pointer text-kai-blue dark:text-white">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-transparent text-sm font-bold outline-none cursor-pointer text-kai-blue dark:text-white">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
              </div>
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-kai-orange">{isDarkMode ? <Sun className="w-4 h-4"/> : <Moon className="w-4 h-4"/>}</button>
            </div>

            <main className="flex-1 overflow-y-auto pb-24 lg:pb-8 custom-scrollbar relative">
              <div className="lg:hidden w-full bg-kai-blue px-4 pt-6 pb-20 rounded-b-[40px] text-white absolute top-0 left-0 right-0 z-0">
                <div className="flex justify-between items-center mb-6">
                  <div><p className="text-xs text-slate-300">Selamat datang,</p><h2 className="font-bold text-lg">{currentUser.name}</h2></div>
                  <div className="flex gap-2">
                    <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full bg-kai-bluedark text-slate-300">{isDarkMode ? <Sun className="w-4 h-4"/> : <Moon className="w-4 h-4"/>}</button>
                    <div className="w-10 h-10 rounded-full bg-white overflow-hidden border-2 border-kai-orange">
                      {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover"/> : <User className="w-full h-full p-2 text-slate-800"/>}
                    </div>
                  </div>
                </div>
              </div>

              <div className="relative z-10 mt-24 lg:mt-6 px-4 lg:px-8 max-w-6xl mx-auto space-y-4">
                
                {/* --- DASHBOARD --- */}
                {activeTab === 'dashboard' && (
                  <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-sm border border-slate-200 dark:border-slate-700">
                    <h2 className="text-lg font-black text-kai-blue dark:text-white mb-2">Selamat Datang di MABUNET Admin</h2>
                    <p className="text-xs text-slate-500">Gunakan menu **Chat & Layanan** di samping untuk membalas pesan klien secara terpusat dalam aplikasi.</p>
                  </div>
                )}

                {/* --- CUSTOMERS --- */}
                {activeTab === 'customers' && (
                  <div className="space-y-4">
                    <h2 className="font-black text-xl text-white lg:text-kai-blue dark:text-white">Data Pelanggan & Persetujuan</h2>
                    {pendingApprovals.length > 0 && (
                      <div className="bg-orange-50 dark:bg-orange-900/20 border border-kai-orange/30 rounded-2xl p-4 shadow-sm mb-4">
                        <h3 className="font-bold text-sm text-kai-orangedark dark:text-orange-400 mb-3 flex items-center gap-2"><AlertCircle className="w-4 h-4"/> Menunggu Persetujuan ({pendingApprovals.length})</h3>
                        <div className="space-y-2">
                          {pendingApprovals.map(approval => {
                            const appInfo = getApprovalInfo(approval);
                            const targetPkg = approval.targetPackageId || approval.newPackageId || approval.packageId;
                            const proofUrl = extractImageFromObj(approval);
                            return (
                              <div key={approval.id} className="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                <div className="flex items-start gap-3">
                                  <div className={`p-2 rounded-lg ${approval.type === 'upgrade' ? 'bg-blue-50 text-kai-blue' : 'bg-emerald-50 text-emerald-600'}`}>
                                    {approval.type === 'upgrade' ? <Activity className="w-5 h-5"/> : <FileCheck className="w-5 h-5"/>}
                                  </div>
                                  <div>
                                    <p className="font-bold text-sm text-slate-800 dark:text-white">{appInfo.name} {appInfo.block ? `(Blok ${appInfo.block})` : ''}</p>
                                    <p className="text-[10px] text-slate-500">{approval.type === 'upgrade' ? `Request Upgrade ke ${getPackage(targetPkg).speed}` : `Kirim Bukti Bayar`}</p>
                                    {proofUrl && (
                                      <button type="button" onClick={() => setPreviewLightbox(proofUrl)} className="text-[10px] font-bold text-kai-blue mt-1 inline-flex items-center gap-1 hover:underline"><ImageIcon className="w-3 h-3"/> Lihat Bukti Transfer</button>
                                    )}
                                  </div>
                                </div>
                                <div className="flex gap-2">
                                  <button onClick={() => handleRejectApprove(approval.id)} className="px-3 py-1.5 bg-rose-50 text-rose-600 text-xs font-bold rounded-lg">Tolak</button>
                                  <button onClick={() => handleApprove(approval)} className="px-3 py-1.5 bg-kai-blue text-white text-xs font-bold rounded-lg shadow-sm">Approve</button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* --- CHAT & LAYANAN (1 NAMA 1 THREAD) --- */}
                {activeTab === 'tickets' && (
                  <div className="h-[calc(100vh-160px)] lg:h-[calc(100vh-110px)] flex flex-col md:flex-row gap-4 relative">
                    
                    {/* DAFTAR KLIEN SEBELAH KIRI (1 KLIEN 1 BARIS) */}
                    <div className={`w-full md:w-1/3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm flex flex-col ${activeTicket ? 'hidden md:flex' : 'flex'}`}>
                      <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                        <div>
                          <h3 className="font-black text-lg text-kai-blue dark:text-white">Chat & Layanan</h3>
                          <p className="text-[10px] text-slate-500">1 Baris per Klien</p>
                        </div>
                        <button onClick={() => setIsNewChatModalOpen(true)} className="px-3 py-2 bg-kai-orange text-white rounded-xl text-[10px] font-bold flex items-center gap-1 shadow-sm">
                          <Plus className="w-3.5 h-3.5"/> Chat Baru
                        </button>
                      </div>
                      <div className="flex-1 overflow-y-auto custom-scrollbar p-2 space-y-2">
                        {tickets.length === 0 ? (
                          <div className="text-center text-slate-400 text-xs font-bold py-10">Belum ada obrolan.</div>
                        ) : (
                          tickets.map(ticket => {
                            const tInfo = getTicketInfo(ticket);
                            const isSelected = activeTicket?.id === ticket.id;
                            const hasPhoto = !!tInfo.initialImg || !!ticket.lastImage;
                            const statusColor = ticket.status === 'Closed' ? 'bg-slate-200 text-slate-500' : 'bg-emerald-100 text-emerald-700';
                            
                            return (
                              <button 
                                key={ticket.id} 
                                onClick={() => setActiveTicket(ticket)}
                                className={`w-full text-left p-3 rounded-2xl transition-all border flex items-center gap-3 ${isSelected ? 'bg-kai-blue border-kai-blue text-white shadow-md' : 'bg-slate-50 dark:bg-slate-900 border-slate-100 dark:border-slate-800 hover:bg-slate-100'}`}
                              >
                                {/* FOTO PROFIL KLIEN */}
                                <img src={tInfo.photo} className="w-11 h-11 rounded-full object-cover border-2 border-white/20 shrink-0 shadow-sm" />
                                
                                <div className="flex-1 min-w-0">
                                  <div className="flex justify-between items-center mb-0.5">
                                    <span className={`font-extrabold text-xs truncate ${isSelected ? 'text-white' : 'text-slate-900 dark:text-white'}`}>{tInfo.name}</span>
                                    <span className={`text-[7px] font-bold px-1.5 py-0.5 rounded shrink-0 ${statusColor}`}>{ticket.status || 'Aktif'}</span>
                                  </div>
                                  {tInfo.block && <span className={`text-[9px] font-bold block mb-1 ${isSelected ? 'text-orange-300' : 'text-kai-orange'}`}>Blok {tInfo.block}</span>}
                                  <p className={`text-[10px] truncate ${isSelected ? 'text-blue-100' : 'text-slate-500'}`}>{hasPhoto ? '📷 ' : ''}{ticket.lastReply || tInfo.initialMsg || tInfo.subject}</p>
                                </div>
                              </button>
                            );
                          })
                        )}
                      </div>
                    </div>

                    {/* RUANG OBROLAN SEBELAH KANAN */}
                    {activeTicket ? (() => {
                      const activeInfo = getTicketInfo(activeTicket);
                      return (
                        <div className="flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-sm flex flex-col h-full overflow-hidden">
                          <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900/50">
                            <div className="flex items-center gap-3 min-w-0">
                              <button onClick={() => setActiveTicket(null)} className="md:hidden p-2 bg-white dark:bg-slate-800 rounded-full shadow-sm shrink-0"><ArrowLeft className="w-4 h-4"/></button>
                              <img src={activeInfo.photo} className="w-10 h-10 rounded-full object-cover border shrink-0" />
                              <div className="min-w-0">
                                <h3 className="font-extrabold text-sm text-kai-blue dark:text-white truncate">{activeInfo.name} {activeInfo.block ? `(Blok ${activeInfo.block})` : ''}</h3>
                                <p className="text-[10px] font-semibold text-slate-500 truncate">{activeInfo.subject} {activeInfo.phone ? `• WA: ${activeInfo.phone}` : ''}</p>
                              </div>
                            </div>
                            {activeTicket.status !== 'Closed' && (
                              <button onClick={() => closeTicket(activeTicket.id)} className="px-3 py-1.5 bg-rose-50 hover:bg-rose-500 hover:text-white text-rose-500 text-xs font-bold rounded-lg transition-colors shrink-0">Selesai</button>
                            )}
                          </div>

                          <div ref={chatScrollRef} className="flex-1 overflow-y-auto custom-scrollbar p-4 bg-kai-bg dark:bg-slate-950 space-y-3">
                            {(activeInfo.initialMsg || activeInfo.initialImg) && (
                              <div className="flex justify-start">
                                <div className="max-w-[80%] rounded-2xl p-3 shadow-sm bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-tl-none">
                                  <p className="text-[10px] font-extrabold text-kai-orange mb-1">{activeInfo.name}</p>
                                  {activeInfo.initialMsg && <p className="text-xs whitespace-pre-line">{activeInfo.initialMsg}</p>}
                                  {activeInfo.initialImg && (
                                    <img src={activeInfo.initialImg} onClick={() => setPreviewLightbox(activeInfo.initialImg)} className="mt-2 rounded-xl max-h-60 w-auto object-cover cursor-pointer border border-slate-200" />
                                  )}
                                </div>
                              </div>
                            )}

                            {chatMessages.map((msg, idx) => {
                              const isAdmin = msg.senderType === 'admin' || msg.role === 'admin' || msg.isAdmin === true || msg.sender === currentUser.name;
                              const msgText = msg.text || msg.message || '';
                              const imgAttachment = extractImageFromObj(msg);
                              return (
                                <div key={msg.id || idx} className={`flex ${isAdmin ? 'justify-end' : 'justify-start'}`}>
                                  <div className={`max-w-[80%] rounded-2xl p-3 shadow-sm ${isAdmin ? 'bg-kai-blue text-white rounded-tr-none' : 'bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 rounded-tl-none'}`}>
                                    <p className={`text-[10px] font-extrabold mb-1 ${isAdmin ? 'text-blue-200' : 'text-kai-orange'}`}>{isAdmin ? (msg.sender || currentUser.name) : activeInfo.name}</p>
                                    {msgText && <p className="text-xs whitespace-pre-line">{msgText}</p>}
                                    {imgAttachment && (
                                      <img src={imgAttachment} onClick={() => setPreviewLightbox(imgAttachment)} className="mt-2 rounded-xl max-h-60 w-auto object-cover cursor-pointer border border-white/20" />
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          {chatImagePreview && (
                            <div className="px-4 py-2 bg-slate-100 dark:bg-slate-800 border-t flex items-center justify-between">
                              <div className="flex items-center gap-2"><img src={chatImagePreview} className="w-12 h-12 rounded-lg object-cover border border-kai-blue" /><span className="text-xs font-bold">Foto siap dikirim</span></div>
                              <button type="button" onClick={() => setChatImagePreview(null)} className="p-1 bg-rose-100 text-rose-600 rounded-full"><X className="w-4 h-4"/></button>
                            </div>
                          )}

                          <form onSubmit={handleSendChat} className="p-3 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 flex items-center gap-2">
                            <input ref={chatCameraInputRef} type="file" accept="image/*" capture="environment" onChange={handleSelectChatImage} className="hidden" />
                            <input ref={chatGalleryInputRef} type="file" accept="image/*" onChange={handleSelectChatImage} className="hidden" />
                            
                            <button type="button" onClick={() => chatCameraInputRef.current?.click()} className="p-2.5 bg-slate-100 dark:bg-slate-700 text-kai-blue dark:text-white rounded-xl"><Camera className="w-5 h-5"/></button>
                            <button type="button" onClick={() => chatGalleryInputRef.current?.click()} className="p-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl"><ImageIcon className="w-5 h-5"/></button>

                            <input type="text" value={newChatInput} onChange={e => setNewChatInput(e.target.value)} placeholder={`Ketik pesan ke ${activeInfo.name}...`} className="flex-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none" />
                            <button type="submit" disabled={!newChatInput.trim() && !chatImagePreview} className="p-3 bg-kai-orange text-white rounded-xl disabled:opacity-50 shadow-sm"><Send className="w-4 h-4"/></button>
                          </form>
                        </div>
                      );
                    })() : (
                      <div className="hidden md:flex flex-1 items-center justify-center border-2 border-dashed border-slate-200 dark:border-slate-700 rounded-2xl">
                        <div className="text-center text-slate-400"><MessageCircle className="w-12 h-12 mx-auto mb-2 opacity-50"/><p className="text-xs font-bold">Pilih klien di samping untuk mulai mengobrol.</p></div>
                      </div>
                    )}
                  </div>
                )}

                {/* --- PORTAL & SETTINGS --- */}
                {activeTab === 'portal' && (
                  <div className="bg-white dark:bg-slate-800 p-6 rounded-3xl text-center shadow-sm">
                    <h3 className="text-lg font-black text-kai-blue dark:text-white mb-2">Portal Klien</h3>
                    <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl flex items-center justify-between gap-3 mb-4">
                      <span className="text-xs font-semibold select-all">{PORTAL_URL}</span>
                      <button onClick={() => navigator.clipboard.writeText(PORTAL_URL).then(() => alert("Tautan disalin!"))} className="p-2 bg-kai-blue text-white rounded-lg"><Copy className="w-4 h-4"/></button>
                    </div>
                  </div>
                )}
              </div>
            </main>

            {/* Mobile Nav */}
            <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 z-50 flex items-center justify-between px-1 pb-safe shadow-md">
              <button onClick={() => {setActiveTab('dashboard'); setActiveTicket(null);}} className={`flex flex-col items-center justify-center p-2 flex-1 ${activeTab === 'dashboard' ? 'text-kai-orange' : 'text-slate-400'}`}><LayoutDashboard className="w-5 h-5 mb-1"/><span className="text-[9px] font-bold">Beranda</span></button>
              <button onClick={() => {setActiveTab('customers'); setActiveTicket(null);}} className={`flex flex-col items-center justify-center p-2 flex-1 relative ${activeTab === 'customers' ? 'text-kai-orange' : 'text-slate-400'}`}><Users className="w-5 h-5 mb-1"/>{pendingApprovals.length > 0 && <span className="absolute top-1.5 right-2 bg-rose-500 w-2 h-2 rounded-full animate-ping"></span>}<span className="text-[9px] font-bold">Pelanggan</span></button>
              <button onClick={() => {setActiveTab('tickets'); setActiveTicket(null);}} className={`flex flex-col items-center justify-center p-2 flex-1 relative ${activeTab === 'tickets' ? 'text-kai-orange' : 'text-slate-400'}`}><MessageCircle className="w-5 h-5 mb-1"/>{unreadTicketsCount > 0 && <span className="absolute top-1.5 right-2 bg-rose-500 w-2 h-2 rounded-full"></span>}<span className="text-[9px] font-bold">Chat</span></button>
              {currentUser?.id === 'admin1' && <button onClick={() => {setActiveTab('mikrotik'); setActiveTicket(null);}} className={`flex flex-col items-center justify-center p-2 flex-1 ${activeTab === 'mikrotik' ? 'text-kai-orange' : 'text-slate-400'}`}><Server className="w-5 h-5 mb-1"/><span className="text-[9px] font-bold">MikroTik</span></button>}
              <button onClick={() => {setActiveTab('settings'); setActiveTicket(null);}} className={`flex flex-col items-center justify-center p-2 flex-1 ${activeTab === 'settings' ? 'text-kai-orange' : 'text-slate-400'}`}><User className="w-5 h-5 mb-1"/><span className="text-[9px] font-bold">Profil</span></button>
            </nav>
          </div>

          {/* Modal Chat Baru */}
          {isNewChatModalOpen && (
            <div className="fixed inset-0 z-[65] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-slate-900 border rounded-3xl w-full max-w-sm p-6 shadow-2xl flex flex-col max-h-[80vh]">
                <div className="flex justify-between items-center mb-4"><h3 className="text-base font-extrabold text-kai-blue dark:text-white">Mulai Chat Pelanggan</h3><button onClick={() => setIsNewChatModalOpen(false)} className="p-1.5 bg-slate-100 dark:bg-slate-800 rounded-full"><X className="w-4 h-4"/></button></div>
                <input type="text" placeholder="Cari nama pelanggan..." value={chatCustomerSearch} onChange={e => setChatCustomerSearch(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-800 border rounded-xl px-3 py-2.5 text-xs font-bold mb-3 outline-none" />
                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-2">
                  {customers.filter(c => (c.name || '').toLowerCase().includes(chatCustomerSearch.toLowerCase())).map(c => (
                    <button key={c.id} onClick={() => handleStartNewChatWithCustomer(c)} className="w-full text-left p-3 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-kai-blue hover:text-white transition-colors flex justify-between items-center">
                      <div className="flex items-center gap-2">
                        <img src={c.foto_profil || `https://ui-avatars.com/api/?name=${encodeURIComponent(c.name)}&background=1A2C5B&color=fff`} className="w-8 h-8 rounded-full object-cover" />
                        <div><p className="font-bold text-xs">{c.name}</p><p className="text-[10px] opacity-75">Blok {c.block} • {c.phone || '-'}</p></div>
                      </div>
                      <MessageCircle className="w-4 h-4 shrink-0"/>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Lightbox Zoom Foto */}
          {previewLightbox && (
            <div className="fixed inset-0 z-[80] bg-black/85 flex flex-col items-center justify-center p-4" onClick={() => setPreviewLightbox(null)}>
              <button onClick={() => setPreviewLightbox(null)} className="absolute top-5 right-5 p-3 bg-white/20 text-white rounded-full"><X className="w-6 h-6"/></button>
              <img src={previewLightbox} className="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl" onClick={e => e.stopPropagation()} />
            </div>
          )}
        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
