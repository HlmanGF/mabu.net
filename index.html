<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MABUNET - Master Billing & Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .scanner-line { position: absolute; width: 100%; height: 2px; background: #4ade80; box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80; animation: scan 1.5s linear infinite; }
    .pulse-glow { box-shadow: 0 0 15px rgba(99, 102, 241, 0.5); animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
    @keyframes ring { 0% { transform: rotate(0); } 25% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0); } }
    .animate-ring { animation: ring 0.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Users, LayoutDashboard, LogOut, Check, Wifi, BookOpen, 
      Fingerprint, Lock, User, Settings, Camera, ShieldAlert, ToggleLeft, ToggleRight,
      Bell, BellRing, Plus, Edit3, Trash2, FileText, ChevronRight, Volume2, VolumeX, CloudLightning, Server
    } from 'https://esm.sh/lucide-react@0.292.0';
    
    // --- IMPORT FIREBASE ---
    import { initializeApp } from "https://esm.sh/firebase@10.6.0/app";
    import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, writeBatch } from "https://esm.sh/firebase@10.6.0/firestore";

    // ==============================================================
    // ⚠️ PASTE FIREBASE CONFIG ANDA DI SINI (Ganti isi di dalam kurung kurawal)
    // ==============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
    authDomain: "billing-mabunet.firebaseapp.com",
    projectId: "billing-mabunet",
    storageBucket: "billing-mabunet.firebasestorage.app",
    messagingSenderId: "362703627315",
    appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46",
    measurementId: "G-2DBSV96KHP"
    };

    // Inisialisasi Firebase
    let app, db;
    try {
      if(firebaseConfig.apiKey !== "ISI_API_KEY_ANDA") {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
      }
    } catch(e) { console.error("Firebase Setup Error", e); }

    // --- DATA KONSTANTA ---
    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '081234567890', photo: '', status: 'Aktif' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', photo: '', status: 'Aktif' },
      { id: 'admin3', username: 'admin3', password: '123', name: 'Admin Teknisi', role: 'Teknisi & CS', phone: '081200000003', photo: '', status: 'Aktif' }
    ];

    const PACKAGES = [
      { id: '5mbps_100', speed: '5 Mbps', price: 100000, label: '5 Mbps - Rp 100.000' },
      { id: '10mbps_150', speed: '10 Mbps', price: 150000, label: '10 Mbps - Rp 150.000' },
      { id: '10mbps_180', speed: '10 Mbps', price: 180000, label: '10 Mbps - Rp 180.000' },
      { id: '15mbps_200', speed: '15 Mbps', price: 200000, label: '15 Mbps - Rp 200.000' },
      { id: '20mbps_250', speed: '20 Mbps', price: 250000, label: '20 Mbps - Rp 250.000' },
      { id: '25mbps_300', speed: '25 Mbps', price: 300000, label: '25 Mbps - Rp 300.000' }
    ];
    const BLOCKS = ['Semua Blok', 'Mabu', 'Ranau', 'RG', 'Pesona', 'PLT'];
    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const YEARS = [2024, 2025, 2026, 2027, 2028, 2029, 2030];

    function App() {
      // System States
      const [admins, setAdmins] = useState(INITIAL_ADMINS);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [isScanning, setIsScanning] = useState(false);
      
      // UI States
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editProfile, setEditProfile] = useState({});
      
      // Filter States
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');

      // --- DATABASE STATES (REAL-TIME) ---
      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      // Alarm
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      // Modals
      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [formData, setFormData] = useState({ name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '' });
      const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: 'Operasional', description: '', notes: '', amount: '' });
      const [editingCustomer, setEditingCustomer] = useState(null);

      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || PACKAGES[1];
      const todayDay = new Date().getDate();

      // ==========================================
      // REAL-TIME DATABASE SYNC (FIREBASE EFFECT)
      // ==========================================
      useEffect(() => {
        if (!db) {
          setIsDbLoading(false);
          return;
        }
        
        // Listener Pelanggan
        const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setCustomers(data);
          setIsDbLoading(false);
        });

        // Listener Buku Kas
        const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setExpenses(data);
        });

        return () => { unsubCustomers(); unsubExpenses(); };
      }, []);

      // --- FIREBASE CRUD ACTIONS ---
      const togglePayment = async (custId, monthKey) => {
        if (!db) return alert("Firebase belum tersambung!");
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        
        // Update ke Firestore
        await updateDoc(doc(db, 'customers', custId), {
          [`payments.${monthKey}`]: !isPaid
        });
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (!db) return alert("Firebase belum tersambung!");
        
        if (editingCustomer) {
          await updateDoc(doc(db, 'customers', editingCustomer.id), formData);
        } else {
          await addDoc(collection(db, 'customers'), { ...formData, payments: {} });
        }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        if (!db) return alert("Firebase belum tersambung!");
        
        await addDoc(collection(db, 'expenses'), { ...expenseForm, admin: currentUser.name });
        setIsExpenseModalOpen(false);
      };

      const handleDeleteCustomer = async (id) => {
        if (!db) return;
        if(confirm("Yakin hapus pelanggan ini?")) {
          await deleteDoc(doc(db, 'customers', id));
        }
      };

      // --- WA & LOGIN LOGIC (Tetap Sama) ---
      const handleLogin = (e) => {
        if(e) e.preventDefault();
        setLoginError('');
        const user = admins.find(a => a.username === loginForm.username && a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun Anda dinonaktifkan oleh Super Admin.');
          setCurrentUser(user); setEditProfile(user);
        } else { setLoginError('Username atau Password salah!'); }
      };

      const handleFingerprintScan = () => {
        setIsScanning(true); setLoginError('');
        setTimeout(() => {
          setIsScanning(false);
          const superAdmin = admins.find(a => a.id === 'admin1');
          setCurrentUser(superAdmin); setEditProfile(superAdmin);
        }, 2000);
      };

      const sendWAInvoice = (cust) => {
        const pkg = getPackage(cust.packageId);
        const text = `*TAGIHAN MABUNET*\nYth. Bapak/Ibu: *${cust.name}* (Blok ${cust.block})\nBulan: *${MONTHS[selectedMonth]} ${selectedYear}*\nTagihan: *${formatIDR(pkg.price)}*\nJatuh Tempo: *Tgl ${cust.dueDate}*\n\nMohon bayar ke BCA 1234567890. Abaikan jika sudah lunas.`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };
      
      const sendWAReceipt = (cust, monthKey) => {
        const pkg = getPackage(cust.packageId); const [y, m] = monthKey.split('-');
        const text = `*KUITANSI MABUNET*\nTerima kasih Bapak/Ibu *${cust.name}*.\nPembayaran internet paket *${pkg.speed}* untuk bulan *${MONTHS[parseInt(m) - 1]} ${y}* sebesar *${formatIDR(pkg.price)}* berstatus *LUNAS*.`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // --- DATA CALCULATIONS ---
      const activeCustomersList = customers.filter(c => c.status === 'Aktif');
      const dueCustomers = activeCustomersList.filter(c => !c.payments || !c.payments[currentPeriodKey]).sort((a, b) => a.dueDate - b.dueDate);
      const customersDueToday = dueCustomers.filter(c => c.dueDate === todayDay);
      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const actualPaidRevenue = activeCustomersList.filter(c => c.payments && c.payments[currentPeriodKey]).reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const totalExpenseAmount = expenses.filter(e => e.date && e.date.startsWith(currentPeriodKey)).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const netProfit = actualPaidRevenue - totalExpenseAmount;

      const filteredCustomers = customers.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : (c.notes || '').includes(filterBlock) || c.block.includes(filterBlock);
        return matchSearch && matchBlock;
      });

      useEffect(() => { if (alarmEnabled && customersDueToday.length > 0) audioRef.current.play().catch(e => console.log(e)); }, [alarmEnabled, customersDueToday.length]);

      // ==========================================
      // VIEW: SCREEN LOGIN
      // ==========================================
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-800 via-slate-950 to-slate-950">
            <div className="bg-slate-900/80 backdrop-blur-xl border border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl relative overflow-hidden">
              <div className="absolute -top-20 -right-20 w-40 h-40 bg-indigo-600/20 blur-3xl rounded-full"></div>
              
              {!db && (
                <div className="mb-4 p-2 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-[10px] rounded-lg text-center font-bold">
                  ⚠️ FIREBASE BELUM TERHUBUNG! APLIKASI DALAM MODE OFFLINE.
                </div>
              )}

              <div className="text-center mb-8 relative z-10">
                <div className="inline-flex p-3 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-4 pulse-glow"><Wifi size={36} /></div>
                <h1 className="text-3xl font-extrabold tracking-tight">MABU<span className="text-indigo-400">NET</span></h1>
                <p className="text-xs text-slate-400 mt-1 uppercase font-semibold">Real-time Cloud Gateway</p>
              </div>

              {loginError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs rounded-xl flex items-center gap-2"><ShieldAlert size={14}/> {loginError}</div>}

              <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><User size={18} /></div>
                  <input type="text" placeholder="Username (Hilman)" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full bg-slate-950/50 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-indigo-500" />
                </div>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500"><Lock size={18} /></div>
                  <input type="password" placeholder="Password (Kosong,19)" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full bg-slate-950/50 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:border-indigo-500" />
                </div>
                <button type="submit" className="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold shadow-lg">Masuk Aplikasi</button>
              </form>

              <div className="mt-8 flex flex-col items-center relative z-10">
                <button onClick={handleFingerprintScan} disabled={isScanning} className="relative group flex flex-col items-center gap-3">
                  <div className={`w-16 h-16 rounded-2xl flex items-center justify-center border transition-all overflow-hidden relative ${isScanning ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                    <Fingerprint size={32} strokeWidth={isScanning ? 2 : 1.5} className={isScanning ? 'opacity-50' : ''}/>
                    {isScanning && <div className="scanner-line"></div>}
                  </div>
                  <span className={`text-xs font-semibold ${isScanning ? 'text-emerald-400' : 'text-slate-400'}`}>{isScanning ? 'Memindai...' : 'Gunakan Fingerprint'}</span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW: MAIN DASHBOARD
      // ==========================================
      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 md:h-screen sticky top-0 z-30">
            <div className="p-5 border-b border-slate-800">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-xl bg-indigo-900 flex items-center justify-center overflow-hidden">
                  {currentUser.photo ? <img src={currentUser.photo} className="w-full h-full object-cover" /> : <User size={24} className="text-indigo-400" />}
                </div>
                <div><h2 className="font-bold text-sm">{currentUser.name}</h2><p className="text-[10px] text-indigo-400 uppercase font-bold">{currentUser.role}</p></div>
              </div>
            </div>
            <nav className="p-4 space-y-2 flex-1">
              <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'dashboard' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}><LayoutDashboard size={18} /> Dashboard</button>
              <button onClick={() => setActiveTab('customers')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'customers' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}>
                <Users size={18} /> Data Pelanggan 
                {isDbLoading ? <span className="text-[10px] text-indigo-400 animate-pulse ml-auto">Loading...</span> : <span className="text-[10px] ml-auto bg-slate-800 px-2 py-0.5 rounded-full">{customers.length}</span>}
              </button>
              <button onClick={() => setActiveTab('ledger')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'ledger' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}><BookOpen size={18} /> Buku Kas</button>
              
              {currentUser.id === 'admin1' && (
                <div className="pt-4 mt-4 border-t border-slate-800">
                  <p className="px-4 text-xs font-bold text-slate-500 mb-2 uppercase">Super Admin</p>
                  <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'settings' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}><Settings size={18} /> Pengaturan Aplikasi</button>
                </div>
              )}
            </nav>
            <div className="p-4 border-t border-slate-800">
              {db && <div className="flex justify-center items-center gap-2 mb-3 text-[10px] text-emerald-400 font-bold"><Server size={12}/> Cloud Connected</div>}
              <button onClick={() => setCurrentUser(null)} className="w-full flex items-center justify-center gap-2 py-3 bg-rose-500/10 text-sm font-semibold text-rose-400 rounded-xl hover:bg-rose-500/20"><LogOut size={16} /> Keluar (Logout)</button>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            
            {activeTab !== 'settings' && (
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                <div className="flex items-center gap-4">
                  <h2 className="text-xl font-bold">Periode Aktif</h2>
                  <button onClick={() => setAlarmEnabled(!alarmEnabled)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${alarmEnabled ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/50' : 'bg-slate-800 text-slate-400 border-slate-700'}`}>
                    {alarmEnabled ? <Volume2 size={16}/> : <VolumeX size={16}/>} {alarmEnabled ? 'Alarm ON' : 'Alarm OFF'}
                  </button>
                </div>
                <div className="flex items-center gap-2">
                  <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                  <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                </div>
              </div>
            )}

            {/* TAB: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Total Pelanggan</p><h3 className="text-3xl font-extrabold">{customers.length}</h3><p className="text-xs text-emerald-400 mt-2">{activeCustomersList.length} Aktif</p></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Potensi Omset</p><h3 className="text-2xl font-extrabold">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Telah Terbayar</p><h3 className="text-2xl font-extrabold text-emerald-400">{formatIDR(actualPaidRevenue)}</h3></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl font-extrabold ${netProfit >= 0 ? 'text-indigo-400' : 'text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                {customersDueToday.length > 0 && (
                  <div className="bg-rose-950/40 border border-rose-500/50 p-5 rounded-2xl shadow-[0_0_20px_rgba(244,63,94,0.2)]">
                    <div className="flex items-center gap-4">
                      <div className="p-3 bg-rose-500/20 text-rose-400 rounded-full animate-ring"><BellRing size={28}/></div>
                      <div><h3 className="text-lg font-bold text-rose-400">Peringatan Jatuh Tempo Hari Ini! (Tgl {todayDay})</h3><p className="text-sm text-slate-300">Ada {customersDueToday.length} pelanggan yang harus ditagih hari ini.</p></div>
                    </div>
                  </div>
                )}

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                  <div className="p-5 border-b border-slate-800"><h3 className="font-bold flex items-center gap-2"><Bell size={18} className="text-rose-400"/> Daftar Tagihan Belum Lunas ({dueCustomers.length})</h3></div>
                  <div className="overflow-x-auto p-2">
                    <table className="w-full text-left text-sm min-w-[700px]">
                      <thead><tr className="text-slate-400 border-b border-slate-800"><th className="py-3 px-4">Pelanggan</th><th className="py-3 px-4">Tagihan</th><th className="py-3 px-4">Jatuh Tempo</th><th className="py-3 px-4 text-right">Aksi</th></tr></thead>
                      <tbody className="divide-y divide-slate-800">
                        {dueCustomers.map(cust => (
                          <tr key={cust.id} className={cust.dueDate === todayDay ? 'bg-rose-500/10' : 'hover:bg-slate-800/40'}>
                            <td className="py-3 px-4"><span className="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded mr-2">{cust.block}</span>{cust.name}</td>
                            <td className="py-3 px-4 font-semibold">{formatIDR(getPackage(cust.packageId).price)}</td>
                            <td className={`py-3 px-4 font-bold ${cust.dueDate === todayDay ? 'text-rose-400' : 'text-slate-300'}`}>Tgl {cust.dueDate}</td>
                            <td className="py-3 px-4 text-right space-x-2">
                              <button onClick={() => sendWAInvoice(cust)} className="px-3 py-1.5 bg-rose-600 rounded-lg text-xs font-semibold">WA Tagih</button>
                              <button onClick={() => togglePayment(cust.id, currentPeriodKey)} className="px-3 py-1.5 bg-indigo-600 rounded-lg text-xs font-semibold">Set Lunas</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: DATA PELANGGAN */}
            {activeTab === 'customers' && (
              <div className="space-y-6">
                <div className="flex flex-wrap gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <input type="text" placeholder="Cari Nama/Blok..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm flex-1"/>
                  <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm">{BLOCKS.map(b => <option key={b}>{b}</option>)}</select>
                  <button onClick={() => { setEditingCustomer(null); setFormData({name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: ''}); setIsCustomerModalOpen(true); }} className="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-semibold">Tambah Baru</button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-x-auto shadow-xl">
                  {isDbLoading ? (
                    <div className="p-12 text-center text-slate-400">Memuat Data dari Cloud Database...</div>
                  ) : (
                    <table className="w-full text-left text-sm min-w-[1200px]">
                      <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-3 px-4 w-48">Pelanggan</th>
                          <th className="py-3 px-4">Paket</th>
                          {MONTHS.map((m, i) => <th key={i} className="py-3 px-2 text-center text-[10px] uppercase tracking-wider">{m.substring(0,3)}</th>)}
                          <th className="py-3 px-4 text-right">Opsi</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {filteredCustomers.map(cust => (
                          <tr key={cust.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4">
                              <div className="font-bold text-indigo-300">{cust.block}</div>
                              <div className="font-semibold">{cust.name}</div>
                              <div className={`text-[10px] border px-1 py-0.5 rounded inline-block mt-1 ${cust.status === 'Aktif' ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10' : 'text-rose-400 border-rose-500/30 bg-rose-500/10'}`}>{cust.status}</div>
                            </td>
                            <td className="py-3 px-4 text-xs"><span className="font-medium">{getPackage(cust.packageId).speed}</span><br/><span className="text-slate-400">{formatIDR(getPackage(cust.packageId).price)}</span><br/><span className="text-amber-400 font-bold">Tgl {cust.dueDate}</span></td>
                            
                            {MONTHS.map((m, i) => {
                              const monthKey = `${selectedYear}-${String(i + 1).padStart(2, '0')}`;
                              const isPaid = cust.payments && cust.payments[monthKey];
                              return (
                                <td key={i} className="py-3 px-1 text-center">
                                  <button onClick={() => togglePayment(cust.id, monthKey)} className={`w-8 h-8 rounded-lg flex items-center justify-center border transition-all ${isPaid ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-500 hover:bg-slate-700'}`}>
                                    {isPaid ? <Check size={16} strokeWidth={3} /> : <span className="text-[10px]">{i+1}</span>}
                                  </button>
                                </td>
                              );
                            })}
                            
                            <td className="py-3 px-4 text-right space-x-1">
                              <button onClick={() => sendWAReceipt(cust, currentPeriodKey)} className="p-2 hover:text-emerald-400 text-slate-400" title="Kirim Nota"><FileText size={16} /></button>
                              <button onClick={() => { setEditingCustomer(cust); setFormData(cust); setIsCustomerModalOpen(true); }} className="p-2 hover:text-indigo-400 text-slate-400" title="Edit"><Edit3 size={16} /></button>
                              <button onClick={() => handleDeleteCustomer(cust.id)} className="p-2 hover:text-rose-400 text-slate-400" title="Hapus"><Trash2 size={16} /></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            )}

            {/* TAB: BUKU KAS */}
            {activeTab === 'ledger' && (
              <div className="space-y-6">
                <div className="flex justify-between bg-slate-900 p-5 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold">Buku Kas Pengeluaran</h3>
                  <button onClick={() => setIsExpenseModalOpen(true)} className="px-4 py-2 bg-rose-600 rounded-xl text-sm font-semibold flex gap-2"><Plus size={16}/> Catat Kas</button>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                  <table className="w-full text-left text-sm min-w-[700px]">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800"><tr><th className="py-3 px-4">Tanggal</th><th className="py-3 px-4">Uraian</th><th className="py-3 px-4">Catatan Manual</th><th className="py-3 px-4">Admin</th><th className="py-3 px-4">Nominal</th></tr></thead>
                    <tbody className="divide-y divide-slate-800">
                      {expenses.filter(e => e.date.startsWith(currentPeriodKey)).map(exp => (
                        <tr key={exp.id}>
                          <td className="py-3 px-4">{exp.date}</td>
                          <td className="py-3 px-4 font-medium"><span className="text-[10px] bg-slate-800 px-1 py-0.5 rounded mr-2">{exp.category}</span>{exp.description}</td>
                          <td className="py-3 px-4 text-slate-400 italic">{exp.notes || '-'}</td>
                          <td className="py-3 px-4 text-xs">{exp.admin}</td>
                          <td className="py-3 px-4 font-bold text-rose-400">{formatIDR(exp.amount)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
            
          </main>

          {/* MODALS */}
          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6">
                <h3 className="text-lg font-bold mb-4">{editingCustomer ? 'Edit Pelanggan' : 'Tambah Pelanggan Baru'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <input type="text" required placeholder="Blok (Misl: A2)" value={formData.block} onChange={e => setFormData({...formData, block: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm uppercase"/>
                    <input type="text" required placeholder="Nama Pelanggan" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  </div>
                  <input type="text" placeholder="No HP/WA (0812...)" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <select value={formData.packageId} onChange={e => setFormData({...formData, packageId: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">{PACKAGES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}</select>
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" required placeholder="Tgl Tempo (1-31)" min="1" max="31" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: parseInt(e.target.value)})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                    <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"><option value="Aktif">Aktif</option><option value="Tidak Aktif">Tidak Aktif</option><option value="Isolir">Isolir</option></select>
                  </div>
                  <input type="text" placeholder="Keterangan (Opsional)" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsCustomerModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-700">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Simpan ke Cloud</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isExpenseModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2"><CloudLightning size={20} className="text-indigo-400"/> Input Kas Keluar</h3>
                <form onSubmit={handleSaveExpense} className="space-y-4">
                  <input type="date" required value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    <option value="Operasional">Operasional</option><option value="Maintenance">Maintenance</option><option value="Lainnya">Lainnya</option>
                  </select>
                  <input type="text" required placeholder="Uraian Singkat" value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <textarea placeholder="Catatan Manual (Opsional)" rows="2" value={expenseForm.notes} onChange={e => setExpenseForm({...expenseForm, notes: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm resize-none"></textarea>
                  <input type="number" required placeholder="Nominal (Rp)" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-700">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-rose-600 font-semibold">Simpan Pengeluaran</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
