<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MABUNET - Master Billing & Network</title>
  
  <!-- PWA MANIFEST & ICON WEB MABUNET -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="./mabunetlogo.png" type="image/png">
  <link rel="apple-touch-icon" href="./mabunetlogo.png">
  <link rel="shortcut icon" href="./mabunetlogo.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: {} } }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    .dark ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    .scanner-line { position: absolute; width: 100%; height: 2px; background: #4ade80; box-shadow: 0 0 10px #4ade80, 0 0 20px #4ade80; animation: scan 1.5s linear infinite; }
    
    /* STRUK KASIR 58mm PRINT OVERRIDE */
    @media print {
      body * { visibility: hidden; }
      #print-receipt, #print-receipt * { visibility: visible; }
      #print-receipt { 
        position: absolute; left: 0; top: 0; width: 58mm; margin: 0; padding: 5px; 
        font-family: monospace; font-size: 11px; color: #000; background: #fff;
      }
      @page { margin: 0; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased min-h-screen transition-colors duration-300">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { 
      Users, LayoutDashboard, LogOut, Check, Wifi, BookOpen, 
      Fingerprint, Lock, User, Settings, Camera, ShieldAlert, ToggleLeft, ToggleRight,
      Bell, BellRing, Plus, Edit3, Trash2, FileText, ChevronRight, Volume2, VolumeX, CloudLightning, Server,
      Eye, EyeOff, Sun, Moon, Printer, Download, Activity, TrendingUp, UserCog
    } from 'https://esm.sh/lucide-react@0.292.0';
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, addDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

    // --- FIREBASE CONFIG ---
    const firebaseConfig = {
      apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
      authDomain: "billing-mabunet.firebaseapp.com",
      projectId: "billing-mabunet",
      storageBucket: "billing-mabunet.firebasestorage.app",
      messagingSenderId: "362703627315",
      appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46",
      measurementId: "G-2DBSV96KHP"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) { console.error("Gagal Firebase:", e); }

    // Registrasi PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW Error:', err));
    }

    const INITIAL_ADMINS = [
      { id: 'admin1', username: 'Hilman', password: 'Kosong,19', name: 'Hilman Fatahillah', role: 'Super Admin', phone: '08999999977', email: 'hilman@mabunet.com', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin2', username: 'admin2', password: '123', name: 'Admin Keuangan', role: 'Billing', phone: '081200000002', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' },
      { id: 'admin3', username: 'admin3', password: '123', name: 'Admin Teknisi', role: 'Teknisi & CS', phone: '081200000003', email: '', photo: '', status: 'Aktif', fingerprintEnabled: false, credentialId: '' }
    ];

    const PACKAGES = [
      { id: '5mbps_100', speed: '5 Mbps', price: 100000, label: '5 Mbps - Rp 100.000' },
      { id: '10mbps_150', speed: '10 Mbps', price: 150000, label: '10 Mbps - Rp 150.000' },
      { id: '10mbps_180', speed: '10 Mbps', price: 180000, label: '10 Mbps - Rp 180.000' },
      { id: '15mbps_200', speed: '15 Mbps', price: 200000, label: '15 Mbps - Rp 200.000' },
      { id: '20mbps_250', speed: '20 Mbps', price: 250000, label: '20 Mbps - Rp 250.000' },
      { id: '25mbps_300', speed: '25 Mbps', price: 300000, label: '25 Mbps - Rp 300.000' }
    ];
    const BLOCKS = ['Semua Blok', 'Mabu', 'Ranau', 'RG', 'Pesona', 'PLT'];
    const MONTHS = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const YEARS = [2024, 2025, 2026, 2027, 2028, 2029, 2030];

    function App() {
      const [admins, setAdmins] = useState(INITIAL_ADMINS);
      const [currentUser, setCurrentUser] = useState(null);
      const [loginForm, setLoginForm] = useState({ username: '', password: '' });
      const [loginError, setLoginError] = useState('');
      const [isScanning, setIsScanning] = useState(false);
      const [showPassword, setShowPassword] = useState(false); 
      const [isDarkMode, setIsDarkMode] = useState(true); 
      
      const [activeTab, setActiveTab] = useState('dashboard');
      const [editProfile, setEditProfile] = useState({});
      const [isEditingProfile, setIsEditingProfile] = useState(false); 
      
      // State Edit Admin Lain oleh Admin 1
      const [targetAdmin, setTargetAdmin] = useState(null);
      const [isTargetAdminModalOpen, setIsTargetAdminModalOpen] = useState(false);
      
      const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');

      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [auditLogs, setAuditLogs] = useState([]); 
      const [isDbLoading, setIsDbLoading] = useState(true);
      
      const [printData, setPrintData] = useState(null);
      const [alarmEnabled, setAlarmEnabled] = useState(false);
      const audioRef = useRef(new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'));

      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [formData, setFormData] = useState({ name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: '' });
      const [expenseForm, setExpenseForm] = useState({ date: new Date().toISOString().split('T')[0], category: 'Operasional', description: '', notes: '', amount: '' });
      const [editingCustomer, setEditingCustomer] = useState(null);

      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || { speed: 'Custom', price: 0 };
      const todayDay = new Date().getDate();

      useEffect(() => {
        if (isDarkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDarkMode]);

      // --- LOGGING HELPER ---
      const writeLog = async (actionDesc) => {
        if(!db || !currentUser) return;
        try {
          await addDoc(collection(db, 'logs'), { 
            time: new Date().getTime(), 
            dateStr: new Date().toLocaleString('id-ID'),
            admin: currentUser.name, 
            action: actionDesc 
          });
        } catch(e) {}
      };

      useEffect(() => {
        if (!db) { setIsDbLoading(false); return; }
        try {
          const unsubAdmins = onSnapshot(collection(db, 'admins'), (snapshot) => {
            if (snapshot.empty) {
              INITIAL_ADMINS.forEach(async (adm) => { await setDoc(doc(db, 'admins', adm.id), adm); });
            } else {
              const cloudAdmins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              setAdmins(cloudAdmins);
              
              // AUTO-LOGIN (MENCEGAH LOGOUT SAAT REFRESH)
              const sessionUid = localStorage.getItem('mabunet_session');
              setCurrentUser(prevUser => {
                const activeUid = prevUser ? prevUser.id : sessionUid;
                if (activeUid) {
                  const activeUser = cloudAdmins.find(a => a.id === activeUid);
                  if (activeUser && activeUser.status === 'Aktif') return activeUser;
                  else localStorage.removeItem('mabunet_session'); // Kick jika diblokir
                }
                return null;
              });
            }
          });
          const unsubCustomers = onSnapshot(collection(db, 'customers'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => (a.block || '').localeCompare(b.block || ''));
            setCustomers(data); setIsDbLoading(false);
          });
          const unsubExpenses = onSnapshot(collection(db, 'expenses'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setExpenses(data);
          });
          const unsubLogs = onSnapshot(collection(db, 'logs'), (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a,b) => b.time - a.time); 
            setAuditLogs(data);
          });
          return () => { unsubAdmins(); unsubCustomers(); unsubExpenses(); unsubLogs(); };
        } catch(e) { console.error(e); setIsDbLoading(false); }
      }, []);

      const togglePayment = async (custId, monthKey) => {
        if (!db) return;
        const cust = customers.find(c => c.id === custId);
        const isPaid = cust.payments && cust.payments[monthKey];
        await updateDoc(doc(db, 'customers', custId), { [`payments.${monthKey}`]: !isPaid });
        writeLog(isPaid ? `Membatalkan lunas tagihan: ${cust.name}` : `Menandai LUNAS tagihan: ${cust.name}`);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (editingCustomer) { 
          await updateDoc(doc(db, 'customers', editingCustomer.id), formData); 
          writeLog(`Mengedit data pelanggan: ${formData.name}`);
        } else { 
          await addDoc(collection(db, 'customers'), { ...formData, payments: {} }); 
          writeLog(`Menambah pelanggan baru: ${formData.name}`);
        }
        setIsCustomerModalOpen(false);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        await addDoc(collection(db, 'expenses'), { ...expenseForm, admin: currentUser.name });
        writeLog(`Mencatat kas keluar: ${formatIDR(expenseForm.amount)} (${expenseForm.description})`);
        setIsExpenseModalOpen(false);
      };

      const handleDeleteCustomer = async (id) => {
        const cust = customers.find(c => c.id === id);
        if(confirm("Yakin hapus pelanggan ini?")) {
          await deleteDoc(doc(db, 'customers', id));
          writeLog(`Menghapus pelanggan: ${cust.name}`);
        }
      };

      const handleLogin = (e) => {
        if(e) e.preventDefault();
        setLoginError('');
        const user = admins.find(a => a.username === loginForm.username && a.password === loginForm.password);
        if (user) {
          if (user.status !== 'Aktif') return setLoginError('Akun Anda dinonaktifkan.');
          setCurrentUser(user); setEditProfile(user);
          localStorage.setItem('mabunet_session', user.id); 
        } else { setLoginError('Username atau Password salah!'); }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('mabunet_session');
      };

      // FINGERPRINT LOGIC
      const registerFingerprint = async () => {
        try {
          if (!window.PublicKeyCredential) throw new Error("Perangkat tidak mendukung Fingerprint.");
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const userId = new Uint8Array(16); window.crypto.getRandomValues(userId);
          const pubKey = {
            challenge, rp: { name: "MABUNET", id: window.location.hostname },
            user: { id: userId, name: editProfile.username, displayName: editProfile.name },
            pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
            timeout: 60000, attestation: "none"
          };
          const credential = await navigator.credentials.create({ publicKey: pubKey });
          const credentialId = btoa(String.fromCharCode.apply(null, new Uint8Array(credential.rawId)));
          setEditProfile({...editProfile, credentialId: credentialId, fingerprintEnabled: true});
          alert("Sidik Jari terkait! Tekan 'Simpan Profil'.");
        } catch (err) { alert("Gagal mengaktifkan sidik jari."); }
      };

      const handleFingerprintScan = async () => {
        setIsScanning(true); setLoginError('');
        try {
          const savedUserId = localStorage.getItem('mabunet_device_user');
          if (!savedUserId) throw new Error('Perangkat belum dikenali. Login Manual dahulu lalu seting di Profil.');
          const savedUser = admins.find(a => a.id === savedUserId);
          if (!savedUser || savedUser.status !== 'Aktif') throw new Error('Akun dinonaktifkan atau hilang.');
          if (!savedUser.fingerprintEnabled || !savedUser.credentialId) throw new Error('Sidik Jari belum diaktifkan.');
          
          const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
          const rawId = Uint8Array.from(atob(savedUser.credentialId), c => c.charCodeAt(0));
          const assertion = await navigator.credentials.get({
            publicKey: { challenge, rpId: window.location.hostname, allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required" }
          });
          if (assertion) { 
            setCurrentUser(savedUser); 
            setEditProfile(savedUser);
            localStorage.setItem('mabunet_session', savedUser.id);
          }
        } catch (err) { setLoginError(err.message || 'Verifikasi Sidik Jari gagal.'); } finally { setIsScanning(false); }
      };

      // AUTO-CROP IMAGE NATIVE
      const handlePhotoUpload = (e, isTargetAdmin = false) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const size = Math.min(img.width, img.height);
              canvas.width = 400; canvas.height = 400;
              const ctx = canvas.getContext('2d');
              const startX = (img.width - size) / 2;
              const startY = (img.height - size) / 2;
              ctx.drawImage(img, startX, startY, size, size, 0, 0, 400, 400);
              
              if (isTargetAdmin) {
                setTargetAdmin({ ...targetAdmin, photo: canvas.toDataURL('image/jpeg', 0.8) });
              } else {
                setEditProfile({ ...editProfile, photo: canvas.toDataURL('image/jpeg', 0.8) });
              }
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        }
      };

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        try {
          const updateData = {
            name: editProfile.name, username: editProfile.username, password: editProfile.password,
            email: editProfile.email || '', fingerprintEnabled: editProfile.fingerprintEnabled || false,
            credentialId: editProfile.credentialId || ''
          };
          if (currentUser.id === 'admin1') { updateData.phone = editProfile.phone; updateData.photo = editProfile.photo; }
          await updateDoc(doc(db, 'admins', currentUser.id), updateData);
          alert('Profil berhasil diperbarui!'); setIsEditingProfile(false); 
        } catch (error) { alert('Gagal menyimpan profil.'); }
      };

      // ADMIN 1 MENGEDIT ADMIN LAIN
      const handleSaveTargetAdmin = async (e) => {
        e.preventDefault();
        try {
          await updateDoc(doc(db, 'admins', targetAdmin.id), {
            name: targetAdmin.name,
            username: targetAdmin.username,
            password: targetAdmin.password,
            email: targetAdmin.email || '',
            phone: targetAdmin.phone || '',
            photo: targetAdmin.photo || ''
          });
          alert(`Profil ${targetAdmin.name} berhasil diperbarui!`);
          setIsTargetAdminModalOpen(false);
          writeLog(`Mengedit profil admin: ${targetAdmin.name}`);
        } catch (error) { alert('Gagal menyimpan data admin.'); }
      };

      const toggleAdminStatus = async (adminId, currentStatus) => {
        const newStatus = currentStatus === 'Aktif' ? 'Tidak Aktif' : 'Aktif';
        await updateDoc(doc(db, 'admins', adminId), { status: newStatus });
      };

      // EXPORT CSV
      const exportCSV = (type) => {
        let csv = '';
        if (type === 'customers') {
          csv = 'Nama,Blok,Paket,Harga,Status\n';
          customers.forEach(c => csv += `${c.name},${c.block},${getPackage(c.packageId).speed},${getPackage(c.packageId).price},${c.status}\n`);
        } else {
          csv = 'Tanggal,Kategori,Uraian,Nominal,Admin\n';
          expenses.forEach(e => csv += `${e.date},${e.category},${e.description},${e.amount},${e.admin}\n`);
        }
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `MABUNET_${type}_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
      };

      // BLUETOOTH THERMAL PRINTING
      const triggerPrint = (cust) => {
        setPrintData(cust);
        setTimeout(() => {
          window.print();
          setPrintData(null); 
        }, 300);
      };

      const sendWAInvoice = (cust) => {
        const pkg = getPackage(cust.packageId);
        const text = `*TAGIHAN MABUNET*\nYth. Bapak/Ibu: *${cust.name}* (Blok ${cust.block})\nBulan: *${MONTHS[selectedMonth]} ${selectedYear}*\nTagihan: *${formatIDR(pkg.price)}*\nJatuh Tempo: *Tgl ${cust.dueDate}*\n\nMohon bayar ke BCA 1234567890. Abaikan jika sudah lunas.`;
        window.open(`https://wa.me/${cleanPhone(cust.phone)}?text=${encodeURIComponent(text)}`, '_blank');
      };
      
      const activeCustomersList = customers.filter(c => c.status === 'Aktif');
      const dueCustomers = activeCustomersList.filter(c => !c.payments || !c.payments[currentPeriodKey]).sort((a, b) => a.dueDate - b.dueDate);
      const customersDueToday = dueCustomers.filter(c => c.dueDate === todayDay);
      
      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const actualPaidRevenue = activeCustomersList.filter(c => c.payments && c.payments[currentPeriodKey]).reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const totalExpenseAmount = expenses.filter(e => e.date && e.date.startsWith(currentPeriodKey)).reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const netProfit = actualPaidRevenue - totalExpenseAmount;
      
      const chartData = [
        { name: 'Potensi', Rp: totalPotentialRevenue },
        { name: 'Masuk', Rp: actualPaidRevenue },
        { name: 'Keluar', Rp: totalExpenseAmount },
        { name: 'Net', Rp: netProfit }
      ];

      const maxChartVal = Math.max(...chartData.map(d => Math.abs(d.Rp))) || 1;

      const filteredCustomers = customers.filter(c => {
        const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
        const matchBlock = filterBlock === 'Semua Blok' ? true : (c.notes || '').includes(filterBlock) || c.block.includes(filterBlock);
        return matchSearch && matchBlock;
      });

      useEffect(() => { if (alarmEnabled && customersDueToday.length > 0) audioRef.current.play().catch(e => console.log(e)); }, [alarmEnabled, customersDueToday.length]);

      // ==========================================
      // VIEW: SCREEN LOGIN
      // ==========================================
      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-100 via-slate-200 to-slate-200 dark:from-slate-800 dark:via-slate-950 dark:to-slate-950 transition-colors duration-300">
            <div className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border border-slate-300 dark:border-slate-800 p-8 rounded-3xl max-w-sm w-full shadow-2xl relative overflow-hidden my-8">
              <div className="absolute -top-20 -right-20 w-40 h-40 bg-indigo-600/20 blur-3xl rounded-full"></div>
              
              {!db && ( <div className="mb-4 p-2 bg-amber-500/10 border border-amber-500/30 text-amber-600 dark:text-amber-400 text-[10px] rounded-lg text-center font-bold">⚠️ KONEKSI FIREBASE TERGANGGU. COBA REFRESH.</div> )}

              <button onClick={() => setIsDarkMode(!isDarkMode)} className="absolute top-4 right-4 text-slate-500 hover:text-indigo-500 transition-colors">
                {isDarkMode ? <Sun size={20}/> : <Moon size={20}/>}
              </button>

              <div className="text-center mb-6 relative z-10 flex flex-col items-center">
                <img src="./mabunetlogo.png" alt="MABUNET Logo" className="w-28 h-28 object-contain mb-4 drop-shadow-[0_0_15px_rgba(79,70,229,0.4)]" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
                <h1 className="text-3xl font-extrabold tracking-tight text-slate-800 dark:text-white">MABU<span className="text-indigo-600 dark:text-indigo-400">NET</span></h1>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 uppercase font-semibold">Real-time Cloud Gateway</p>
              </div>

              {loginError && <div className="mb-4 p-3 bg-rose-500/10 border border-rose-500/30 text-rose-600 dark:text-rose-400 text-xs rounded-xl flex items-center gap-2"><ShieldAlert size={14}/> {loginError}</div>}

              <form onSubmit={handleLogin} className="space-y-4 relative z-10 mt-6">
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><User size={16} /></div>
                  <input type="text" placeholder="Username (misal: admin2)" required value={loginForm.username} onChange={e => setLoginForm({...loginForm, username: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-sm outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                </div>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500"><Lock size={16} /></div>
                  <input type={showPassword ? "text" : "password"} placeholder="Password" required value={loginForm.password} onChange={e => setLoginForm({...loginForm, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-300 dark:border-slate-700 rounded-xl pl-9 pr-10 py-2.5 text-sm outline-none focus:border-indigo-500 text-slate-800 dark:text-slate-100 transition-colors" />
                  <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 dark:text-slate-500 hover:text-indigo-600 dark:hover:text-indigo-400">
                    {showPassword ? <EyeOff size={16}/> : <Eye size={16}/>}
                  </button>
                </div>
                <div className="flex justify-end">
                  <button type="button" onClick={() => alert('Silakan hubungi Super Admin (Hilman) untuk mereset password Anda.')} className="text-[11px] text-indigo-600 dark:text-indigo-400 hover:underline font-medium">Lupa Password?</button>
                </div>
                <button type="submit" className="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold shadow-lg hover:bg-indigo-700 transition-colors">Masuk Aplikasi</button>
              </form>

              <div className="w-full border-t border-slate-300 dark:border-slate-800 my-6 relative z-10"><span className="absolute left-1/2 -translate-x-1/2 -top-2.5 bg-white dark:bg-slate-900 px-2 text-xs text-slate-500 font-semibold transition-colors">ATAU</span></div>

              <div className="mt-2 flex flex-col items-center relative z-10">
                <button onClick={() => { localStorage.setItem('mabunet_device_user', loginForm.username ? admins.find(a=>a.username===loginForm.username)?.id || '' : ''); handleFingerprintScan(); }} disabled={isScanning} className="relative group flex flex-col items-center gap-2">
                  <div className={`w-14 h-14 rounded-2xl flex items-center justify-center border transition-all overflow-hidden relative ${isScanning ? 'bg-emerald-500/10 border-emerald-500/50 text-emerald-600 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 border-slate-300 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                    <Fingerprint size={28} strokeWidth={isScanning ? 2 : 1.5} className={isScanning ? 'opacity-50' : ''}/>
                    {isScanning && <div className="scanner-line"></div>}
                  </div>
                  <span className={`text-[10px] font-semibold text-center ${isScanning ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-600 dark:text-slate-400'}`}>
                    {isScanning ? 'Memindai...' : 'Login Sidik Jari Asli'} <br/> <span className="font-normal text-[8px] opacity-70">(Ingat Perangkat Saya)</span>
                  </span>
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // VIEW: MAIN DASHBOARD
      // ==========================================
      return (
        <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex flex-col relative transition-colors duration-300">
          
          {/* BAGIAN STRUK KASIR THERMAL 58mm */}
          {printData && (
            <div id="print-receipt">
              <div style={{textAlign: 'center', marginBottom: '10px', borderBottom: '1px dashed #000', paddingBottom: '5px'}}>
                <h2 style={{margin: '0', fontSize: '16px', fontWeight: 'bold'}}>MABUNET</h2>
                <p style={{margin: '0', fontSize: '10px'}}>Internet RT & Network</p>
              </div>
              <p style={{margin: '2px 0'}}>Tgl : {new Date().toLocaleDateString('id-ID')}</p>
              <p style={{margin: '2px 0'}}>Opr : {currentUser.name}</p>
              <p style={{margin: '2px 0'}}>Plg : {printData.name} ({printData.block})</p>
              <p style={{margin: '2px 0'}}>Paket: {getPackage(printData.packageId).speed}</p>
              <p style={{margin: '2px 0'}}>Bulan: {MONTHS[selectedMonth]} {selectedYear}</p>
              <div style={{borderTop: '1px dashed #000', marginTop: '5px', paddingTop: '5px'}}>
                <p style={{margin: '0', fontSize: '14px', fontWeight: 'bold'}}>TOTAL: {formatIDR(getPackage(printData.packageId).price)}</p>
                <p style={{margin: '0', fontSize: '12px', fontWeight: 'bold', marginTop: '5px'}}>STATUS: LUNAS</p>
              </div>
              <div style={{textAlign: 'center', marginTop: '15px', fontSize: '10px'}}>
                <p style={{margin: '0'}}>Terima Kasih</p>
                <p style={{margin: '0'}}>Telah Berlangganan</p>
                <p style={{margin: '0'}}>MABUNET</p>
              </div>
            </div>
          )}

          <header className="md:hidden fixed top-0 inset-x-0 h-16 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 z-40 flex items-center justify-between px-4 shadow-sm dark:shadow-lg transition-colors">
            <div className="flex items-center gap-3">
              <img src="./mabunetlogo.png" alt="Mabunet" className="w-10 h-10 object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
              <div>
                <h2 className="font-bold text-sm leading-tight text-slate-800 dark:text-slate-200">MABUNET</h2>
                <p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold">{currentUser.role}</p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-500 hover:text-indigo-500">{isDarkMode ? <Sun size={18}/> : <Moon size={18}/>}</button>
              {db ? <Server size={18} className="text-emerald-500 dark:text-emerald-400" /> : <Server size={18} className="text-rose-500 dark:text-rose-400 animate-pulse" />}
            </div>
          </header>

          <aside className="fixed z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-slate-200 dark:border-slate-800 flex items-center shadow-[0_-4px_24px_rgba(0,0,0,0.05)] dark:shadow-[0_0_24px_rgba(0,0,0,0.5)] 
                            inset-x-0 bottom-0 h-16 flex-row justify-around px-2 border-t transition-colors
                            md:inset-y-0 md:left-0 md:w-20 md:h-screen md:flex-col md:justify-start md:py-6 md:px-0 md:border-r md:border-t-0 md:shadow-[4px_0_24px_rgba(0,0,0,0.05)]">
            <div className="hidden md:flex flex-col items-center mb-8 gap-2">
              <img src="./mabunetlogo.png" alt="Mabunet" className="w-12 h-12 object-contain drop-shadow-md" onError={(e) => { e.target.onerror = null; e.target.style.display = 'none'; }} />
            </div>
            
            <nav className="flex flex-row md:flex-col gap-2 md:gap-4 w-full md:px-4 items-center justify-around md:justify-start flex-1">
              <button onClick={() => {setActiveTab('dashboard'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <LayoutDashboard size={22} />
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium z-50">Dashboard</span>
              </button>
              
              <button onClick={() => {setActiveTab('customers'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'customers' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <div className="relative"><Users size={22} />{isDbLoading && <span className="absolute -top-1 -right-1 w-2 h-2 bg-indigo-400 rounded-full animate-pulse"></span>}</div>
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium z-50">Data Pelanggan</span>
              </button>
              
              <button onClick={() => {setActiveTab('ledger'); setIsEditingProfile(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                <BookOpen size={22} />
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium z-50">Buku Kas</span>
              </button>
              
              <div className="hidden md:block w-full h-px bg-slate-200 dark:bg-slate-800 my-2"></div>
              <div className="md:hidden w-px h-8 bg-slate-200 dark:bg-slate-800 mx-1"></div>
              
              <button onClick={() => {setActiveTab('settings'); setEditProfile(currentUser); setShowPassword(false);}} className={`relative group flex justify-center p-3 rounded-xl transition-all ${activeTab === 'settings' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 dark:text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-700 dark:hover:text-slate-200'}`}>
                {currentUser.photo ? (
                  <img src={currentUser.photo} className="w-[22px] h-[22px] rounded-full object-cover border border-slate-300 dark:border-slate-600" />
                ) : (
                  <Settings size={22} />
                )}
                <span className="hidden md:block absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium z-50">Profil & Pengaturan</span>
              </button>

              <button onClick={handleLogout} className="md:hidden relative group flex justify-center p-3 rounded-xl text-rose-500 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all">
                <LogOut size={22} />
              </button>
            </nav>
            
            <div className="hidden md:flex mt-auto px-4 w-full flex-col gap-4 items-center">
              <button onClick={() => setIsDarkMode(!isDarkMode)} className="relative group flex justify-center p-3 rounded-xl text-amber-500 hover:bg-amber-100 dark:text-slate-400 dark:hover:bg-slate-800 transition-all">
                {isDarkMode ? <Sun size={22}/> : <Moon size={22}/>}
                <span className="absolute left-16 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 font-medium z-50">Ubah Tema</span>
              </button>
              <div className="relative group cursor-help">
                {db ? <Server size={18} className="text-emerald-500 dark:text-emerald-400" /> : <Server size={18} className="text-rose-500 dark:text-rose-400 animate-pulse" />}
                <span className="absolute left-10 top-1/2 -translate-y-1/2 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-slate-200 dark:border-slate-700 z-50">Status Server</span>
              </div>
              <button onClick={handleLogout} className="relative group w-full flex justify-center p-3 rounded-xl text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-500/10 transition-all">
                <LogOut size={22} />
                <span className="absolute left-16 top-1/2 -translate-y-1/2 bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap border border-rose-200 dark:border-rose-900 font-bold z-50">Keluar</span>
              </button>
            </div>
          </aside>

          <main className="flex-1 w-full pt-20 pb-24 px-4 md:pt-8 md:pb-8 md:px-8 md:ml-20 overflow-y-auto space-y-6">
            
            {activeTab !== 'settings' && (
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
                <div className="flex items-center gap-4">
                  <h2 className="text-xl font-bold">Periode Aktif</h2>
                  <button onClick={() => setAlarmEnabled(!alarmEnabled)} className={`flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${alarmEnabled ? 'bg-emerald-100 dark:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border-emerald-300 dark:border-emerald-500/50' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-300 dark:border-slate-700'}`}>
                    {alarmEnabled ? <Volume2 size={16}/> : <VolumeX size={16}/>} {alarmEnabled ? 'Alarm ON' : 'Alarm OFF'}
                  </button>
                </div>
                <div className="flex items-center gap-2">
                  <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none transition-colors">{MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}</select>
                  <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-1.5 text-sm outline-none transition-colors">{YEARS.map(y => <option key={y} value={y}>{y}</option>)}</select>
                </div>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Total Pelanggan</p><h3 className="text-3xl font-extrabold">{customers.length}</h3><p className="text-xs text-emerald-600 dark:text-emerald-400 mt-2">{activeCustomersList.length} Aktif</p></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Potensi Omset</p><h3 className="text-2xl font-extrabold">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Telah Terbayar</p><h3 className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">{formatIDR(actualPaidRevenue)}</h3></div>
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl transition-colors"><p className="text-xs text-slate-500 dark:text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl font-extrabold ${netProfit >= 0 ? 'text-indigo-600 dark:text-indigo-400' : 'text-rose-600 dark:text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                {/* GRAFIK ANALITIK NATIVE (AMAN & RINGAN KHUSUS PC) */}
                <div className="hidden md:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-xl transition-colors">
                  <h3 className="font-bold flex items-center gap-2 mb-4 text-indigo-600 dark:text-indigo-400"><TrendingUp size={20}/> Grafik Keuangan Bulan Ini</h3>
                  <div className="flex items-end h-64 gap-6 pt-4 border-b border-slate-200 dark:border-slate-800 relative">
                    {chartData.map((data, index) => {
                       const height = Math.abs(data.Rp) / maxChartVal * 100;
                       const isNegative = data.Rp < 0;
                       const color = index === 2 ? 'bg-rose-500' : index === 3 ? (isNegative ? 'bg-rose-500' : 'bg-indigo-500') : 'bg-emerald-500';
                       
                       return (
                         <div key={index} className="flex-1 flex flex-col justify-end items-center group relative h-full">
                           {/* Tooltip */}
                           <div className="absolute -top-8 opacity-0 group-hover:opacity-100 transition-opacity bg-slate-800 text-white text-[11px] font-bold py-1 px-3 rounded pointer-events-none z-10 whitespace-nowrap shadow-lg">
                             {formatIDR(data.Rp)}
                           </div>
                           {/* Bar */}
                           <div className={`w-full max-w-[80px] ${color} rounded-t-md transition-all duration-500 hover:brightness-110`} style={{ height: `${height}%`, minHeight: '4px' }}></div>
                           {/* Label */}
                           <div className="absolute -bottom-6 text-xs font-semibold text-slate-500 text-center w-full truncate">{data.name}</div>
                         </div>
                       )
                    })}
                  </div>
                  <div className="mt-8"></div>
                </div>

                {customersDueToday.length > 0 && (
                  <div className="bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-500/50 p-5 rounded-2xl shadow-[0_4px_20px_rgba(244,63,94,0.1)] dark:shadow-[0_0_20px_rgba(244,63,94,0.2)] transition-colors">
                    <div className="flex items-center gap-4">
                      <div className="p-3 bg-rose-200 dark:bg-rose-500/20 text-rose-600 dark:text-rose-400 rounded-full animate-ring"><BellRing size={28}/></div>
                      <div><h3 className="text-lg font-bold text-rose-700 dark:text-rose-400">Peringatan Jatuh Tempo Hari Ini! (Tgl {todayDay})</h3><p className="text-sm text-slate-600 dark:text-slate-300">Ada {customersDueToday.length} pelanggan yang harus ditagih hari ini.</p></div>
                    </div>
                  </div>
                )}

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-xl transition-colors">
                  <div className="p-5 border-b border-slate-200 dark:border-slate-800"><h3 className="font-bold flex items-center gap-2"><Bell size={18} className="text-rose-500 dark:text-rose-400"/> Daftar Tagihan Belum Lunas ({dueCustomers.length})</h3></div>
                  <div className="overflow-x-auto p-2">
                    <table className="w-full text-left text-sm min-w-[700px]">
                      <thead><tr className="text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800"><th className="py-3 px-4">Pelanggan</th><th className="py-3 px-4">Tagihan</th><th className="py-3 px-4">Jatuh Tempo</th><th className="py-3 px-4 text-right">Aksi</th></tr></thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {dueCustomers.map(cust => (
                          <tr key={cust.id} className={cust.dueDate === todayDay ? 'bg-rose-50 dark:bg-rose-500/10' : 'hover:bg-slate-50 dark:hover:bg-slate-800/40'}>
                            <td className="py-3 px-4"><span className="text-xs bg-indigo-100 dark:bg-indigo-500/20 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded mr-2">{cust.block}</span>{cust.name}</td>
                            <td className="py-3 px-4 font-semibold">{formatIDR(getPackage(cust.packageId).price)}</td>
                            <td className={`py-3 px-4 font-bold ${cust.dueDate === todayDay ? 'text-rose-600 dark:text-rose-400' : 'text-slate-600 dark:text-slate-300'}`}>Tgl {cust.dueDate}</td>
                            <td className="py-3 px-4 text-right space-x-2">
                              <button onClick={() => sendWAInvoice(cust)} className="px-3 py-1.5 bg-rose-600 rounded-lg text-white text-xs font-semibold hover:bg-rose-700">WA Tagih</button>
                              <button onClick={() => togglePayment(cust.id, currentPeriodKey)} className="px-3 py-1.5 bg-indigo-600 rounded-lg text-white text-xs font-semibold hover:bg-indigo-700">Set Lunas</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'customers' && (
              <div className="space-y-6">
                <div className="flex flex-wrap gap-4 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 transition-colors">
                  <input type="text" placeholder="Cari Nama/Blok..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm flex-1 text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors"/>
                  <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 outline-none focus:border-indigo-500 transition-colors">{BLOCKS.map(b => <option key={b}>{b}</option>)}</select>
                  
                  <div className="flex gap-2">
                    <button onClick={() => exportCSV('customers')} className="px-4 py-2 bg-emerald-600 rounded-xl text-white text-sm font-semibold shadow-lg hover:bg-emerald-700 flex items-center gap-2" title="Download Excel"><Download size={16}/> <span className="hidden sm:inline">Export</span></button>
                    <button onClick={() => { setEditingCustomer(null); setFormData({name: '', block: '', phone: '', packageId: '10mbps_150', dueDate: 1, status: 'Aktif', notes: ''}); setIsCustomerModalOpen(true); }} className="px-4 py-2 bg-indigo-600 rounded-xl text-white text-sm font-semibold shadow-lg hover:bg-indigo-700 flex items-center gap-2"><Plus size={16}/> <span className="hidden sm:inline">Tambah</span></button>
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-x-auto shadow-xl transition-colors">
                  {isDbLoading ? (
                    <div className="p-12 text-center text-slate-500 dark:text-slate-400 animate-pulse">Memuat Data dari Cloud...</div>
                  ) : customers.length === 0 ? (
                    <div className="p-12 text-center text-rose-500 font-bold">Data Pelanggan Kosong!</div>
                  ) : (
                    <table className="w-full text-left text-sm min-w-[1300px]">
                      <thead className="bg-slate-50 dark:bg-slate-950 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                        <tr>
                          <th className="py-3 px-4 w-48">Pelanggan</th>
                          <th className="py-3 px-4 w-32">Paket</th>
                          {MONTHS.map((m, i) => <th key={i} className="py-3 px-1 text-center text-[10px] uppercase tracking-wider">{m.substring(0,3)}</th>)}
                          <th className="py-3 px-4 text-right w-48">Opsi & Print</th>
                        </tr>

                  <div><label className="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Password</label><input type="text" required value={targetAdmin.password} onChange={e => setTargetAdmin({...targetAdmin, password: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Email</label><input type="email" value={targetAdmin.email} onChange={e => setTargetAdmin({...targetAdmin, email: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>
                  <div><label className="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">No WhatsApp</label><input type="text" value={targetAdmin.phone} onChange={e => setTargetAdmin({...targetAdmin, phone: e.target.value})} className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 text-sm text-slate-800 dark:text-slate-100 focus:border-indigo-500 outline-none transition-colors" /></div>

                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsTargetAdminModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold shadow-lg hover:bg-indigo-700">Simpan Data</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
