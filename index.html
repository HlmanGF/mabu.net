<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MABUNET Patcher — Client Cleanup (Final Fix)</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #0f172a; }
.card { background: white; padding: 28px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.06); }

.sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }

button { background: #1A2C5B; color: white; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; width: 100%; }
button:disabled { opacity: .4; cursor: not-allowed; }
#log { font-family: monospace; font-size: 12px; background: #0f172a; color: #a5f3fc; padding: 14px; border-radius: 8px; margin-top: 16px; display: none; white-space: pre-wrap; line-height: 1.6; }
#log.show { display: block; }
.ok { color: #10b981; }
.err { color: #ef4444; }
</style>
</head>
<body>
<div class="card">
  <h1>🧹 Master Patcher — Client Cleanup (v2)</h1>
  <p class="sub">Memperbaiki seluruh Portal Pelanggan. Pencarian penanda kini kebal terhadap perbedaan format spasi.</p>

  <div class="step">
    <p><b>1. Pilih file index.html Anda:</b></p>
    <input type="file" id="fileInput" accept=".html,.htm" style="margin-top:10px;">
  </div>

  <div class="step">
    <p><b>2. Klik tombol di bawah:</b></p>
    <button id="patchBtn" disabled>⚡ Patch & Download</button>
  </div>

  <div id="log"></div>
</div>

              <button type="submit" class="w-11 h-11 bg-kai-orange text-white rounded-full hover:bg-kai-orangedark transition-colors shadow-sm shrink-0 flex items-center justify-center active:scale-95"><svg class="w-5 h-5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg></button>

      <div id="upgradeModal" class="fixed inset-0 bg-black/80 z-[110] hidden flex-col justify-end">

              <h3 class="font-black text-lg mb-4">Upload Bukti Bayar</h3>
              <form id="formPaymentProof" class="space-y-4">
                  <input type="file" id="billProofInput" class="w-full text-xs" required>

      <div id="notifModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex-col justify-end">

          </div>
      </div>
      
      <div id="mainHeader" class="hidden bg-white w-full px-5 py-3 border-b z-40 shrink-0 shadow-sm">
          <div class="max-w-xl mx-auto flex justify-between items-center">
              <h1 class="text-base font-black text-kai-blue">MABU<span class="text-kai-orange">NET</span></h1>
              <button onclick="bukaNotifikasi()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center">
                  <svg class="w-5 h-5 text-kai-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
              </button>
          </div>
      </div>

      <div id="view-home" class="view-section max-w-xl mx-auto px-4 pt-4">
          <div class="bg-white rounded-[24px] shadow-sm border p-5 mb-5">
              <h2 class="text-xl font-black text-kai-blue" id="homeNamaClient">Memuat...</h2>
              <p class="text-xs font-bold text-slate-500" id="homeBlokClient">Blok -</p>
              <div class="grid grid-cols-2 gap-3 mt-4">
                  <div class="bg-slate-50 rounded-xl p-3"><p class="text-[9px] font-bold text-slate-400">STATUS</p><p class="text-sm font-black" id="homeStatusText">...</p></div>
                  <div class="bg-slate-50 rounded-xl p-3"><p class="text-[9px] font-bold text-slate-400">TAGIHAN</p><p class="text-sm font-black text-kai-orange" id="homeTagihanText">...</p></div>
              </div>
              <div class="mt-3 bg-kai-blue/5 rounded-xl p-3 text-[11px] font-black text-kai-blue" id="homePaketText">-</div>
          </div>
          <div class="grid grid-cols-3 gap-3">
              <button onclick="switchView('view-registrasi', null)" class="bg-white p-4 rounded-2xl border flex flex-col items-center"><span class="text-[10px] font-bold">Pasang Baru</span></button>
              <button onclick="switchView('view-pembayaran', document.getElementById('nav-pembayaran'))" class="bg-white p-4 rounded-2xl border flex flex-col items-center"><span class="text-[10px] font-bold">Bayar</span></button>
              <button onclick="switchView('view-bantuan', document.getElementById('nav-bantuan'))" class="bg-white p-4 rounded-2xl border flex flex-col items-center"><span class="text-[10px] font-bold">Bantuan</span></button>
          </div>
      </div>

      <div id="view-pembayaran" class="view-section max-w-xl mx-auto px-4 pt-4">
          <div class="bg-white rounded-3xl p-6 shadow-sm border text-center">
              <h2 class="text-lg font-black mb-2">Pembayaran Tagihan</h2>
              <p class="text-3xl font-black text-kai-blue mb-4" id="payTotalTagihan">Rp 0</p>
              <img src="./qris.jpg" class="w-48 h-48 mx-auto rounded-xl border mb-4">
              <button onclick="bukaPaymentProof()" class="w-full py-3 bg-emerald-500 text-white rounded-xl font-black">Upload Bukti</button>
          </div>
      </div>
      
      <div id="view-bantuan" class="view-section max-w-xl mx-auto px-4 pt-4">
          <div class="bg-white p-6 rounded-3xl shadow-sm border">
              <h3 class="text-lg font-black mb-4">Buat Laporan</h3>
              <form id="ticketForm" class="space-y-3">
                  <select id="ticketType" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                      <option value="">-- Pilih Topik --</option>
                      <option value="Internet Mati">Internet Mati</option>
                      <option value="Lainnya">Lainnya</option>
                  </select>
                  <textarea id="ticketDesc" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" rows="3" required></textarea>
                  <button type="submit" class="w-full py-3 bg-kai-blue text-white rounded-xl font-bold">Kirim</button>
              </form>
          </div>
      </div>               

      <div id="view-login" class="view-section flex flex-col justify-center p-6 w-full h-full">
          <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm mx-auto w-full text-center border">
              <img src="./mabunetlogo.png" class="w-16 h-16 mx-auto mb-4">
              <h2 class="text-2xl font-black text-kai-blue mb-6">Masuk Portal</h2>
              <form id="loginForm" class="space-y-4">
                  <input type="tel" id="loginWA" placeholder="08123456789" class="w-full h-12 px-4 rounded-xl border bg-slate-50 font-bold text-center" required>
                  <button type="submit" id="btnLogin" class="w-full h-12 bg-kai-blue text-white rounded-xl font-bold">Masuk</button>
              </form>
              <button onclick="masukSebagaiTamu()" class="mt-4 text-xs font-bold text-slate-500">Daftar Pasang Baru</button>
          </div>
      </div>

      <div id="view-profil" class="view-section max-w-xl mx-auto px-4 pt-4">
          <div class="bg-white p-6 rounded-3xl shadow-sm border text-center">
              <img id="profilImage" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-100">
              <h2 class="text-xl font-black text-kai-blue" id="profilNama">-</h2>
              <p class="text-xs font-bold text-slate-500 mb-6" id="profilBlok">-</p>
              <button onclick="logoutAkun()" class="w-full py-3 bg-rose-50 text-rose-600 rounded-xl font-bold">Keluar</button>
          </div>
      </div>

      <div id="view-registrasi" class="view-section max-w-xl mx-auto px-4 pt-4">
          <div class="bg-white p-6 rounded-3xl shadow-sm border">
              <h2 class="text-lg font-black text-kai-blue mb-4">Formulir Pendaftaran</h2>
              <form id="regForm" class="space-y-3">
                  <input type="text" id="nama" placeholder="Nama Lengkap" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                  <input type="tel" id="whatsapp" placeholder="No WhatsApp" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                  <input type="text" id="alamat" placeholder="Alamat" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                  <input type="text" id="ssid" placeholder="Nama WiFi" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                  <input type="text" id="password_wifi" placeholder="Password WiFi" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                  <select id="paket" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                      <option value="">Pilih Paket</option>
                      <option value="10mbps_150">10 Mbps</option>
                  </select>
                  <select id="area" class="w-full p-3 rounded-xl border bg-slate-50 font-bold" required>
                      <option value="">Pilih Area</option>
                      <option value="Mabu">Mabu</option>
                  </select>
                  <button type="submit" class="w-full py-3 bg-kai-orange text-white rounded-xl font-bold">Daftar</button>
              </form>
          </div>
      </div>

      <nav id="bottomNav" class="hidden w-full bg-white border-t flex justify-around p-2 pb-safe z-50">
          <button id="nav-home" class="nav-item flex flex-col items-center py-2 text-kai-orange" onclick="switchView('view-home', this)"><span class="text-[9px] font-black">Beranda</span></button>
          <button id="nav-pembayaran" class="nav-item flex flex-col items-center py-2 text-slate-400" onclick="switchView('view-pembayaran', this)"><span class="text-[9px] font-black">Bayar</span></button>
          <button id="nav-chat" class="nav-item flex flex-col items-center py-2 text-slate-400" onclick="bukaMenuChat(this)"><span class="text-[9px] font-black">Chat</span></button>
          <button id="nav-bantuan" class="nav-item flex flex-col items-center py-2 text-slate-400" onclick="switchView('view-bantuan', this)"><span class="text-[9px] font-black">Bantuan</span></button>
          <button id="nav-akun" class="nav-item flex flex-col items-center py-2 text-slate-400" onclick="bukaMenuAkun(this)"><span class="text-[9px] font-black">Akun</span></button>
      </nav>

<script id="js-client-template" type="text/plain">
    function checkRoute() {
        const isClient = window.location.pathname.includes('client') || window.location.hash === '#client';
        const clientUI = document.getElementById('client-ui');
        const adminUI = document.getElementById('root');
        if (isClient) {
            clientUI.classList.remove('hidden');
            adminUI.classList.add('hidden');
            document.body.className = 'bg-kai-bg text-slate-800 h-[100dvh] w-full overflow-hidden m-0 p-0';
            document.documentElement.className = 'h-full overflow-hidden';
            const savedUser = localStorage.getItem('mabunet_client_session');
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            if (savedUser) {
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                document.getElementById('view-home').classList.add('active');
            } else {
                document.getElementById('mainHeader').classList.add('hidden');
                document.getElementById('bottomNav').classList.add('hidden');
                document.getElementById('view-login').classList.add('active');
            }
        } else {
            clientUI.classList.add('hidden');
            adminUI.classList.remove('hidden');
            document.body.className = 'text-slate-800 antialiased h-screen overflow-hidden';
            document.documentElement.className = '';
        }
    }
    window.addEventListener('hashchange', checkRoute);
    window.addEventListener('load', checkRoute);
    setTimeout(checkRoute, 100);

    const firebaseConfig = {
        apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
        authDomain: "billing-mabunet.firebaseapp.com",
        projectId: "billing-mabunet",
        storageBucket: "billing-mabunet.firebasestorage.app",
        messagingSenderId: "362703627315",
        appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46"
    };
    let clientApp;
    try { clientApp = firebase.app('clientApp'); } catch (e) { clientApp = firebase.initializeApp(firebaseConfig, 'clientApp'); }
    const db = clientApp.firestore();
    
    let currentUserDocId = null;
    let globalName = ""; let globalBlock = ""; let globalPhone = ""; let globalDueDate = null;
    let profilListener = null;
    let chatListener = null;
    let currentChatTicketId = null;

    function switchView(viewId, btnElement) {
        document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(btnElement) {
            document.querySelectorAll('.nav-item').forEach(btn => { btn.classList.remove('text-kai-orange'); btn.classList.add('text-slate-400'); });
            btnElement.classList.remove('text-slate-400'); btnElement.classList.add('text-kai-orange');
        }
        window.scrollTo(0,0);
    }

    window.addEventListener('load', () => {
        const savedUser = localStorage.getItem('mabunet_client_session');
        if (savedUser) {
            const data = JSON.parse(savedUser);
            currentUserDocId = data.id;
            if(data.foto) document.getElementById('profilImage').src = data.foto;
            bukaAplikasiPenuh();
            mulaiListenerRealtime(); 
        }
    });

    function bukaAplikasiPenuh() {
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        switchView('view-home', document.getElementById('nav-home'));
    }

    function tutupAplikasiPenuh() {
        document.getElementById('mainHeader').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
        switchView('view-login', null);
        if(profilListener) profilListener();
    }
    
    function masukSebagaiTamu() {
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        switchView('view-registrasi', null);
    }

    function bukaMenuAkun(btn) {
        const savedUser = localStorage.getItem('mabunet_client_session');
        if (currentUserDocId || savedUser) switchView('view-profil', btn); 
        else switchView('view-login', btn); 
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        const wa = document.getElementById('loginWA').value.trim();
        btn.innerText = "Memeriksa..."; btn.disabled = true;
        const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
        const normalizedInput = cleanPhone(wa);
        const withZero = normalizedInput.startsWith('62') ? '0' + normalizedInput.substring(2) : normalizedInput;
        try {
            let snapshot = await db.collection('customers').where('phone', '==', wa).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', normalizedInput).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', withZero).get();
            if (snapshot.empty) {
                const allSnap = await db.collection('customers').get();
                const matched = allSnap.docs.find(d => cleanPhone(d.data().phone) === normalizedInput);
                if (matched) {
                    currentUserDocId = matched.id;
                    localStorage.setItem('mabunet_client_session', JSON.stringify({id: currentUserDocId, foto: matched.data().foto_profil}));
                    document.getElementById('loginForm').reset();
                    bukaAplikasiPenuh(); mulaiListenerRealtime(); return;
                }
                alert("Nomor WhatsApp tidak terdaftar.");
            } else {
                currentUserDocId = snapshot.docs[0].id;
                localStorage.setItem('mabunet_client_session', JSON.stringify({id: currentUserDocId, foto: snapshot.docs[0].data().foto_profil}));
                document.getElementById('loginForm').reset();
                bukaAplikasiPenuh(); mulaiListenerRealtime();
            }
        } catch (err) { alert("Error: " + err.message); } 
        finally { btn.innerText = "Masuk"; btn.disabled = false; }
    });

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerText = "Mengirim..."; btn.disabled = true;
        try {
            await db.collection('customers').add({
                name: document.getElementById('nama').value, 
                block: document.getElementById('area').value, 
                phone: document.getElementById('whatsapp').value, 
                packageId: document.getElementById('paket').value, 
                dueDate: 1, status: 'Non-Aktif', 
                notes: `Alamat: ${document.getElementById('alamat').value} | SSID: ${document.getElementById('ssid').value} | Pass: ${document.getElementById('password_wifi').value}`, 
                pppoe_user: document.getElementById('nama').value.split(' ')[0].toLowerCase() + '@mabu.net', 
                payments: {} 
            });
            alert("Pendaftaran berhasil!");
            document.getElementById('regForm').reset();
            switchView('view-home', document.getElementById('nav-home'));
        } catch (error) { alert("Error: " + error.message); } 
        finally { btn.innerText = "Daftar"; btn.disabled = false; }
    });

    function mulaiListenerRealtime() {
        if(!currentUserDocId) return;
        profilListener = db.collection('customers').doc(currentUserDocId).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                globalName = data.name || '-'; globalPhone = data.phone || '-'; globalBlock = data.block || '-';
                globalDueDate = data.dueDate || null;
                if (typeof updateHomeCard === 'function') updateHomeCard(data);
                document.getElementById('profilNama').innerText = globalName;
                document.getElementById('profilBlok').innerText = 'Blok ' + globalBlock;
                if (data.foto_profil) document.getElementById('profilImage').src = data.foto_profil;
                const PACKAGE_PRICES = { '5mbps_100': 100000, '10mbps_150': 150000, '15mbps_200': 200000, '20mbps_250': 250000, '25mbps_300': 300000 };
                const hargaPaket = PACKAGE_PRICES[data.packageId] || 0;
                const d = new Date(); const bulanSekarang = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const sudahBayar = data.payments && data.payments[bulanSekarang];
                const tagihanText = document.getElementById('payTotalTagihan');
                if (tagihanText) {
                    tagihanText.innerText = `Rp ${hargaPaket.toLocaleString('id-ID')}`;
                    if (sudahBayar || hargaPaket === 0) tagihanText.innerText = 'LUNAS';
                }
            }
        });      
        muatNotifikasi();
    }

    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.innerText = 'Mengirim...'; btn.disabled = true;
        try {
            const roomRef = db.collection('tickets').doc(currentUserDocId);
            const roomSnap = await roomRef.get();
            if (!roomSnap.exists) await roomRef.set({ customerId: currentUserDocId, name: globalName, block: globalBlock, phone: globalPhone, status: 'Open', timestamp: Date.now() });
            else await roomRef.update({ status: 'Open', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            await roomRef.collection('messages').add({ sender: 'client', senderName: globalName, text: `[${document.getElementById('ticketType').value}] ${document.getElementById('ticketDesc').value}`, time: Date.now() });
            await roomRef.update({ lastReply: `[${document.getElementById('ticketType').value}]` });
            document.getElementById('ticketForm').reset();
            alert("Pesan terkirim!");
        } catch (err) { alert("Gagal: " + err.message); } 
        finally { btn.innerText = 'Kirim'; btn.disabled = false; }
    });

    function bukaMenuChat(btn) {
        if (!currentUserDocId) { alert("Login dulu"); return; }
        document.querySelectorAll('.nav-item').forEach(b => { b.classList.remove('text-kai-orange'); b.classList.add('text-slate-400'); });
        btn.classList.remove('text-slate-400'); btn.classList.add('text-kai-orange');
        document.getElementById('chatModal').classList.remove('hidden');
        if(chatListener) chatListener();
        chatListener = db.collection('tickets').doc(currentUserDocId).collection('messages').orderBy('time', 'asc').onSnapshot(snapshot => {
            const chatBox = document.getElementById('chatMessages');
            let html = '';
            snapshot.forEach(doc => {
                const msg = doc.data();
                const isAdmin = msg.senderType === 'admin' || msg.isAdmin === true;
                const timeStr = new Date(msg.time).getHours() + ':' + (new Date(msg.time).getMinutes()<10?'0':'') + new Date(msg.time).getMinutes();
                if(!isAdmin) html += `<div class="flex justify-end"><div class="bg-kai-blue text-white rounded-2xl p-3 text-xs">${msg.text}<br><span class="text-[8px] opacity-70">${timeStr}</span></div></div>`;
                else html += `<div class="flex justify-start"><div class="bg-white border rounded-2xl p-3 text-xs">${msg.text}<br><span class="text-[8px] opacity-70">${timeStr}</span></div></div>`;
            });
            chatBox.innerHTML = html || '<p class="text-center text-xs text-slate-400">Mulai obrolan</p>';
            setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
        });
    }

    function tutupChat() {
        document.getElementById('chatModal').classList.add('hidden');
        if(chatListener) { chatListener(); chatListener = null; }
    }

    document.getElementById('chatForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const input = document.getElementById('chatInput'); const teks = input.value.trim();
        if(!teks) return;
        try {
            await db.collection('tickets').doc(currentUserDocId).collection('messages').add({ sender: 'client', senderName: globalName, senderType: 'client', text: teks, time: Date.now() });
            input.value = '';
        } catch(err) { alert("Gagal"); }
    });

    function bukaPaymentProof() { document.getElementById('paymentProofModal').classList.remove('hidden'); document.getElementById('paymentProofModal').classList.add('flex'); }
    function tutupPaymentProof() { document.getElementById('paymentProofModal').classList.add('hidden'); document.getElementById('paymentProofModal').classList.remove('flex'); }
    function previewBillProof(event) { }
    
    document.getElementById('formPaymentProof').addEventListener('submit', async function(e) {
        e.preventDefault();
        try {
            await db.collection('approvals').add({ customerId: currentUserDocId, type: 'payment', status: 'pending', time: Date.now() });
            tutupPaymentProof(); alert("Bukti terkirim");
        } catch (err) { alert("Gagal"); }
    });

    function bukaUpgrade() { document.getElementById('upgradeModal').classList.remove('hidden'); }
    function tutupUpgrade() { document.getElementById('upgradeModal').classList.add('hidden'); }

    function bukaNotifikasi() { document.getElementById('notifModal').classList.remove('hidden'); document.getElementById('notifModal').classList.add('flex'); }
    function tutupNotifikasi() { document.getElementById('notifModal').classList.add('hidden'); document.getElementById('notifModal').classList.remove('flex'); }
    
    async function muatNotifikasi() {
        if(!currentUserDocId) return;
        db.collection('announcements').orderBy('time', 'desc').limit(10).onSnapshot(snap => {
            const listDiv = document.getElementById('listNotif'); let htmlContent = '';
            snap.forEach(doc => { const ann = doc.data(); htmlContent += `<div class="p-3 bg-slate-50 rounded-xl border">${ann.title}</div>`; });
            listDiv.innerHTML = htmlContent || '<p class="text-xs text-center">Kosong</p>';
        });
    }

    function updateHomeCard(data) {
        document.getElementById('homeNamaClient').textContent = data.name || 'Pelanggan';
        document.getElementById('homeBlokClient').textContent = 'Blok ' + (data.block || '-');
        document.getElementById('homeStatusText').textContent = data.status || 'Aktif';
        document.getElementById('homePaketText').textContent = (data.packageId || '-').toUpperCase();
        document.getElementById('homeTagihanText').textContent = 'Cek Tagihan';
    }

    function logoutAkun() { if(confirm("Keluar?")) { currentUserDocId = null; localStorage.removeItem('mabunet_client_session'); tutupAplikasiPenuh(); } }
</script>

<script>
const fileInput = document.getElementById('fileInput');
const patchBtn = document.getElementById('patchBtn');
const logDiv = document.getElementById('log');
let originalContent = '';
let originalFilename = 'index.html';

const log = (msg, cls) => {
  logDiv.classList.add('show');
  const span = document.createElement('div');
  if (cls) span.className = cls;
  span.textContent = msg;
  logDiv.appendChild(span);
};

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) { patchBtn.disabled = true; return; }
  originalFilename = file.name;
  const reader = new FileReader();
  reader.onload = (ev) => {
    originalContent = ev.target.result;
    patchBtn.disabled = false;
    logDiv.innerHTML = '';
    log('[OK] File dimuat: ' + file.name, 'ok');
  };
  reader.readAsText(file);
});

patchBtn.addEventListener('click', () => {
  patchBtn.disabled = true;
  logDiv.innerHTML = '';
  log('Memulai patch (Metode Loose Match)...', 'info');
  try {
    let modified = originalContent;

    const clientHtml = document.getElementById('html-client-template').innerHTML;
    const clientJs = '<script>\n' + document.getElementById('js-client-template').textContent + '\n<' + '/script>\n</body>\n</html>';

    // Mencari index berdasarkan substring spesifik, mengabaikan format spasi/baris baru
    let htmlStartIdx = modified.indexOf('<!-- 2. AREA PORTAL CLIENT');
    let htmlEndIdx = modified.indexOf('<!-- 3. SCRIPT ADMIN');
    
    if (htmlStartIdx === -1 || htmlEndIdx === -1) {
      log('[FAIL] Penanda HTML tidak ditemukan! Pastikan Anda memilih file index.html yang benar.', 'err');
      patchBtn.disabled = false; return;
    }

    // Ganti HTML
    modified = modified.slice(0, htmlStartIdx) + clientHtml + modified.slice(htmlEndIdx);
    log('[OK] HTML Client berhasil diganti.', 'ok');
    
    // Ganti JS
    let jsStartIdx = modified.indexOf('<!-- 4. SCRIPT CLIENT');
    let bodyEndIdx = modified.lastIndexOf('</body>');

    if (jsStartIdx !== -1 && bodyEndIdx !== -1) {
      modified = modified.slice(0, jsStartIdx) + clientJs;
      log('[OK] JS Client berhasil diganti.', 'ok');
    } else {
      log('[FAIL] Penanda JS Client tidak ditemukan!', 'err');
      patchBtn.disabled = false; return;
    }
    
    log('=== SELESAI ===', 'ok');
    log('Berhasil mengganti Client UI.', 'ok');

    const blob = new Blob([modified], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = originalFilename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    log('[DONE] File di-download.', 'ok');
    patchBtn.disabled = false;

  } catch (e) {
    log('[ERROR] ' + e.message, 'err');
    patchBtn.disabled = false;
  }
});
</script>
