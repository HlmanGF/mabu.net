    // --- KOMPONEN UTAMA REACT ---
    function App() {
      // State Autentikasi & Multi-Admin
      const [user, setUser] = useState(null);
      const [activeAdmin, setActiveAdmin] = useState(null);
      const [isAuthReady, setIsAuthReady] = useState(false);

      // Tab & Navigasi
      const [activeTab, setActiveTab] = useState('dashboard');

      // Periode Penagihan
      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState(new Date().getMonth());

      // Data Database
      const [customers, setCustomers] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [loading, setLoading] = useState(true);

      // Filter & Pencarian
      const [searchTerm, setSearchTerm] = useState('');
      const [filterBlock, setFilterBlock] = useState('Semua Blok');
      const [filterStatus, setFilterStatus] = useState('Semua');

      // Modal Pelanggan
      const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [formData, setFormData] = useState({
        name: '', block: '', phone: '', packageId: PACKAGES[1].id,
        installDate: new Date().toISOString().split('T')[0],
        dueDate: new Date().getDate(), status: 'Aktif', notes: ''
      });

      // Modal Buku Kas
      const [isExpenseModalOpen, setIsExpenseModalOpen] = useState(false);
      const [editingExpense, setEditingExpense] = useState(null);
      const [expenseForm, setExpenseForm] = useState({
        date: new Date().toISOString().split('T')[0],
        category: 'Operasional', description: '', amount: ''
      });

      // --- FIREBASE AUTHENTICATION ---
      useEffect(() => {
        if (!auth) {
          setIsAuthReady(true); // Bypass jika firebase config kosong
          return;
        }
        const initAuth = async () => {
          try { await signInAnonymously(auth); } 
          catch (err) { console.error("Auth error:", err); }
        };
        initAuth();

        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setIsAuthReady(true);
        });
        return () => unsubscribe();
      }, []);

      // --- REALTIME DATA FETCHING ---
      useEffect(() => {
        if (!user || !db) {
          // Dummy data jika Firebase gagal dimuat
          setCustomers(SEED_CUSTOMERS.map((c, i) => ({ id: `dummy-${i}`, ...c })));
          setLoading(false);
          return;
        }
        setLoading(true);

        const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'mabu_customers');
        const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'mabu_expenses');

        const unsubCust = onSnapshot(customersRef, (snapshot) => {
          const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          setCustomers(data);
          setLoading(false);
        }, (err) => console.error(err));

        const unsubExp = onSnapshot(expensesRef, (snapshot) => {
          const data = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          setExpenses(data);
        }, (err) => console.error(err));

        return () => {
          unsubCust();
          unsubExp();
        };
      }, [user]);

      // Seed data awal ke Firebase
      const seedInitialData = async () => {
        if (!user || !db) return alert("Firebase tidak terkonfigurasi. Tidak dapat menyimpan data.");
        try {
          const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'mabu_customers');
          for (const item of SEED_CUSTOMERS) {
            await addDoc(customersRef, {
              ...item,
              payments: { [`${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`]: false },
              createdAt: serverTimestamp()
            });
          }
          alert("189 Data berhasil di-load ke database!");
        } catch (e) {
          console.error("Error seeding:", e);
        }
      };

      // Helpers Format
      const formatIDR = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(val || 0);
      const cleanPhone = (phoneStr) => {
        let p = (phoneStr || '').replace(/\D/g, '');
        if (p.startsWith('0')) p = '62' + p.substring(1);
        return p;
      };

      const currentPeriodKey = `${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`;
      const todayDay = new Date().getDate();
      const getPackage = (pkgId) => PACKAGES.find(p => p.id === pkgId) || PACKAGES[1];

      // Kalkulasi Statistik
      const activeCustomersList = customers.filter(c => c.status === 'Aktif');
      const inactiveCustomersList = customers.filter(c => c.status === 'Tidak Aktif' || c.status === 'Isolir');

      const totalPotentialRevenue = activeCustomersList.reduce((sum, c) => sum + getPackage(c.packageId).price, 0);
      const paidCustomersCount = activeCustomersList.filter(c => c.payments && c.payments[currentPeriodKey]).length;
      const actualPaidRevenue = activeCustomersList
        .filter(c => c.payments && c.payments[currentPeriodKey])
        .reduce((sum, c) => sum + getPackage(c.packageId).price, 0);

      const dueCustomers = useMemo(() => {
        return activeCustomersList.filter(c => {
          const isPaid = c.payments && c.payments[currentPeriodKey];
          return !isPaid;
        }).sort((a, b) => a.dueDate - b.dueDate);
      }, [activeCustomersList, currentPeriodKey]);

      const currentPeriodExpenses = useMemo(() => {
        return expenses.filter(exp => {
          if (!exp.date) return false;
          return exp.date.startsWith(currentPeriodKey);
        });
      }, [expenses, currentPeriodKey]);

      const totalExpenseAmount = currentPeriodExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
      const netProfit = actualPaidRevenue - totalExpenseAmount;

      // --- HANDLER PELANGGAN ---
      const handleOpenCustomerModal = (cust = null) => {
        if (cust) {
          setEditingCustomer(cust);
          setFormData({
            name: cust.name || '', block: cust.block || '', phone: cust.phone || '',
            packageId: cust.packageId || PACKAGES[1].id, installDate: cust.installDate || '',
            dueDate: cust.dueDate || 1, status: cust.status || 'Aktif', notes: cust.notes || ''
          });
        } else {
          setEditingCustomer(null);
          setFormData({
            name: '', block: '', phone: '', packageId: PACKAGES[1].id,
            installDate: new Date().toISOString().split('T')[0], dueDate: new Date().getDate(),
            status: 'Aktif', notes: ''
          });
        }
        setIsCustomerModalOpen(true);
      };

      const handleSaveCustomer = async (e) => {
        e.preventDefault();
        if (!user || !db) return alert("Firebase tidak terkonfigurasi");
        try {
          const customersRef = collection(db, 'artifacts', appId, 'public', 'data', 'mabu_customers');
          const payload = {
            name: formData.name, block: formData.block.toUpperCase(), phone: formData.phone,
            packageId: formData.packageId, installDate: formData.installDate,
            dueDate: Number(formData.dueDate), status: formData.status, notes: formData.notes,
            updatedAt: serverTimestamp()
          };

          if (editingCustomer) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_customers', editingCustomer.id), payload);
          } else {
            payload.createdAt = serverTimestamp();
            payload.payments = { [currentPeriodKey]: false };
            await addDoc(customersRef, payload);
          }
          setIsCustomerModalOpen(false);
        } catch (err) { console.error("Save error:", err); }
      };

      const toggleCustomerStatus = async (cust) => {
        if (!user || !db) return;
        const newStatus = cust.status === 'Aktif' ? 'Tidak Aktif' : 'Aktif';
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_customers', cust.id), {
            status: newStatus, updatedAt: serverTimestamp()
          });
        } catch (err) { console.error(err); }
      };

      const togglePayment = async (cust) => {
        if (!user || !db) return;
        const currentStatus = cust.payments && cust.payments[currentPeriodKey];
        
        // Simpan dengan histori
        const paymentData = !currentStatus ? {
          status: true,
          paidAt: new Date().toISOString(),
          receivedBy: activeAdmin.name
        } : false;

        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_customers', cust.id), {
            [`payments.${currentPeriodKey}`]: paymentData,
            updatedAt: serverTimestamp()
          });
        } catch (err) { console.error(err); }
      };

      const handleDeleteCustomer = async (id) => {
        if (!user || !db) return;
        if (confirm('Yakin ingin menghapus pelanggan ini?')) {
          try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_customers', id)); } 
          catch (err) { console.error(err); }
        }
      };

      // --- HANDLER KAS & EXPORT ---
      const handleOpenExpenseModal = (exp = null) => {
        if (exp) {
          setEditingExpense(exp);
          setExpenseForm({ date: exp.date, category: exp.category, description: exp.description, amount: exp.amount });
        } else {
          setEditingExpense(null);
          setExpenseForm({ date: new Date().toISOString().split('T')[0], category: 'Operasional', description: '', amount: '' });
        }
        setIsExpenseModalOpen(true);
      };

      const handleSaveExpense = async (e) => {
        e.preventDefault();
        if (!user || !db) return alert("Firebase tidak terkonfigurasi");
        try {
          const payload = {
            date: expenseForm.date, category: expenseForm.category, description: expenseForm.description,
            amount: Number(expenseForm.amount), admin: activeAdmin.name, updatedAt: serverTimestamp()
          };

          if (editingExpense) {
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_expenses', editingExpense.id), payload);
          } else {
            payload.createdAt = serverTimestamp();
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'mabu_expenses'), payload);
          }
          setIsExpenseModalOpen(false);
        } catch (err) { console.error(err); }
      };

      const handleDeleteExpense = async (id) => {
        if (!user || !db) return;
        if (confirm('Hapus pencatatan kas ini?')) {
          try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mabu_expenses', id)); } 
          catch (err) { console.error(err); }
        }
      };

      const exportToCSV = (data, filename) => {
        if (data.length === 0) return alert("Tidak ada data untuk diekspor");
        const headers = Object.keys(data[0]).join(",");
        const csvRows = data.map(row => Object.values(row).map(val => `"${String(val).replace(/"/g, '""')}"`).join(","));
        const csvContent = [headers, ...csvRows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", `${filename}_${MONTHS[selectedMonth]}_${selectedYear}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const exportBukuKas = () => {
        const exportData = currentPeriodExpenses.map(e => ({
          Tanggal: e.date, Kategori: e.category, Uraian: e.description, Nominal: e.amount, DicatatOleh: e.admin
        }));
        exportToCSV(exportData, "Laporan_Kas_MABUNET");
      };

      // WA Generator
      const sendWhatsAppNotification = (cust) => {
        const pkg = getPackage(cust.packageId);
        const phone = cleanPhone(cust.phone);
        const amountStr = formatIDR(pkg.price);
        const periodName = `${MONTHS[selectedMonth]} ${selectedYear}`;
        const text = 
          `*PEMBERITAHUAN TAGIHAN INTERNET MABUNET*\n\n` +
          `Yth. Bapak/Ibu: *${cust.name}*\nLokasi/Blok: *${cust.block}*\n` +
          `Paket: *${pkg.speed}*\nPeriode: *${periodName}*\nJumlah Tagihan: *${amountStr}*\n` +
          `Jatuh Tempo: *Tgl ${cust.dueDate} ${MONTHS[selectedMonth]}*\n\n` +
          `Mohon melakukan pembayaran tagihan tepat waktu agar kelancaran internet tetap terjaga.\n\n` +
          `*Metode Pembayaran:*\n• BCA: 1234567890 (a.n MABUNET)\n• DANA/GoPay: 081234567890\n\n` +
          `Konfirmasi bukti bayar ke nomor ini. Abaikan pesan ini bila telah membayar.\n_Salam Hangat, Admin (${activeAdmin.name})_`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
      };

      // Filtered Customers
      const filteredCustomers = useMemo(() => {
        return customers.filter(c => {
          const matchSearch = (c.name || '').toLowerCase().includes(searchTerm.toLowerCase()) || 
                              (c.block || '').toLowerCase().includes(searchTerm.toLowerCase());
          const matchBlock = filterBlock === 'Semua Blok' ? true : 
              (filterBlock === 'Mabu' ? c.notes === '' : (c.notes || '').includes(filterBlock));
          
          let matchStatus = true;
          if (filterStatus === 'Aktif') matchStatus = c.status === 'Aktif';
          else if (filterStatus === 'Tidak Aktif') matchStatus = c.status === 'Tidak Aktif' || c.status === 'Isolir';
          else if (filterStatus === 'Belum Lunas') matchStatus = c.status === 'Aktif' && (!c.payments || !c.payments[currentPeriodKey]);

          return matchSearch && matchBlock && matchStatus;
        }).sort((a, b) => (a.block || '').localeCompare(b.block || ''));
      }, [customers, searchTerm, filterBlock, filterStatus, currentPeriodKey]);

      // --- TAMPILAN ---
      if (!activeAdmin) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
              <div className="text-center mb-8">
                <div className="inline-flex p-4 rounded-2xl bg-indigo-600/20 text-indigo-400 mb-4"><Wifi size={44} /></div>
                <h1 className="text-3xl font-extrabold">MABU<span className="text-indigo-400">NET</span></h1>
                <p className="text-xs text-slate-400 mt-1">Sistem Penagihan Terpadu (189 Pelanggan)</p>
              </div>
              <div className="space-y-3">
                {ADMINS.map(adm => (
                  <button key={adm.id} onClick={() => setActiveAdmin(adm)} disabled={!isAuthReady}
                    className="w-full flex items-center justify-between p-4 bg-slate-800 hover:bg-indigo-600/20 rounded-2xl text-left border border-slate-700 hover:border-indigo-500 transition-colors">
                    <div>
                      <h3 className="font-semibold text-slate-200">{adm.name}</h3>
                      <p className="text-xs text-slate-400">{adm.role}</p>
                    </div>
                    <ChevronRight size={18} className="text-slate-500" />
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col md:flex-row">
          {/* SIDEBAR */}
          <aside className="w-full md:w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 md:h-screen sticky top-0 z-30">
            <div className="p-6 border-b border-slate-800 flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center"><Wifi size={22} /></div>
              <div><h1 className="font-extrabold text-lg">MABUNET</h1><p className="text-[10px] text-indigo-400">Billing Ops</p></div>
            </div>
            <nav className="p-4 space-y-2 flex-1">
              <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'dashboard' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}><LayoutDashboard size={18} /> Dashboard</button>
              <button onClick={() => setActiveTab('customers')} className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'customers' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}>
                <div className="flex items-center gap-3"><Users size={18} /> Data Pelanggan</div>
                <span className="text-xs bg-slate-800 px-2 rounded-full text-slate-300">{customers.length}</span>
              </button>
              <button onClick={() => setActiveTab('ledger')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium ${activeTab === 'ledger' ? 'bg-indigo-600' : 'text-slate-400 hover:bg-slate-800'}`}><BookOpen size={18} /> Buku Kas</button>
            </nav>
            <div className="p-4 border-t border-slate-800 bg-slate-900">
              <div className="flex items-center gap-3 mb-3"><div className="text-sm truncate font-semibold">{activeAdmin.name}</div></div>
              <button onClick={() => setActiveAdmin(null)} className="w-full flex justify-center gap-2 py-2 text-xs font-semibold text-rose-400 border border-rose-500/20 rounded-lg hover:bg-rose-500/10"><LogOut size={14} /> Ganti Admin</button>
            </div>
          </aside>

          {/* KONTEN UTAMA */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
            
            {/* TOOLBAR ATAS */}
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
              <div><h2 className="text-xl font-bold">Periode Penagihan Aktif</h2></div>
              <div className="flex items-center gap-2">
                <select value={selectedMonth} onChange={(e) => setSelectedMonth(Number(e.target.value))} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-sm font-semibold outline-none cursor-pointer">
                  {MONTHS.map((m, idx) => <option key={idx} value={idx}>{m}</option>)}
                </select>
                <select value={selectedYear} onChange={(e) => setSelectedYear(Number(e.target.value))} className="bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-sm font-semibold outline-none cursor-pointer">
                  {YEARS.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
                {customers.length === 0 && db && (
                  <button onClick={seedInitialData} className="px-3 py-1.5 bg-indigo-600/30 text-indigo-300 rounded-xl text-xs font-semibold">Muat Data Master (189)</button>
                )}
              </div>
            </div>

            {/* TAB DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Pelanggan</p><h3 className="text-3xl font-extrabold">{customers.length}</h3><p className="text-xs text-emerald-400 mt-2">{activeCustomersList.length} Aktif</p></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Potensi Omset</p><h3 className="text-2xl font-extrabold">{formatIDR(totalPotentialRevenue)}</h3></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Telah Terbayar</p><h3 className="text-2xl font-extrabold text-emerald-400">{formatIDR(actualPaidRevenue)}</h3><p className="text-xs text-slate-400 mt-2">{paidCustomersCount} Lunas</p></div>
                  <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl"><p className="text-xs text-slate-400">Kas Bersih (Net)</p><h3 className={`text-2xl font-extrabold ${netProfit >= 0 ? 'text-indigo-400' : 'text-rose-400'}`}>{formatIDR(netProfit)}</h3></div>
                </div>

                {/* TABEL JATUH TEMPO */}
                <div className="bg-slate-900 border border-rose-500/30 rounded-2xl overflow-hidden shadow-2xl">
                  <div className="p-5 bg-gradient-to-r from-rose-950/40 border-b border-rose-500/20 flex justify-between"><h3 className="font-bold flex gap-2"><Bell size={20} className="text-rose-400"/> Alarm Jatuh Tempo ({dueCustomers.length})</h3></div>
                  <div className="overflow-x-auto p-2">
                    <table className="w-full text-left text-sm min-w-[700px]">
                      <thead><tr className="text-slate-400 border-b border-slate-800"><th className="py-3 px-4">Pelanggan</th><th className="py-3 px-4">Tarif</th><th className="py-3 px-4">Jatuh Tempo</th><th className="py-3 px-4 text-right">Aksi</th></tr></thead>
                      <tbody className="divide-y divide-slate-800">
                        {dueCustomers.map(cust => {
                          const pkg = getPackage(cust.packageId);
                          return (
                            <tr key={cust.id} className="hover:bg-slate-800/40">
                              <td className="py-3 px-4"><span className="text-xs font-bold bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded mr-2">{cust.block}</span><span className="font-bold">{cust.name}</span></td>
                              <td className="py-3 px-4 font-semibold">{formatIDR(pkg.price)}</td>
                              <td className="py-3 px-4 text-rose-400 font-bold">Tgl {cust.dueDate}</td>
                              <td className="py-3 px-4 text-right space-x-2">
                                <button onClick={() => sendWhatsAppNotification(cust)} className="px-3 py-1.5 bg-emerald-600 rounded-lg text-xs font-semibold">WA</button>
                                <button onClick={() => togglePayment(cust)} className="px-3 py-1.5 bg-indigo-600 rounded-lg text-xs font-semibold">Set Lunas</button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB CUSTOMERS */}
            {activeTab === 'customers' && (
              <div className="space-y-6">
                <div className="flex flex-wrap gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
                  <input type="text" placeholder="Cari Nama/Blok..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm flex-1"/>
                  <select value={filterBlock} onChange={e => setFilterBlock(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm">
                    {BLOCKS.map(b => <option key={b}>{b}</option>)}
                  </select>
                  <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-sm">
                    <option value="Semua">Semua Status</option><option value="Aktif">Hanya Aktif</option><option value="Belum Lunas">Belum Lunas</option>
                  </select>
                  <button onClick={() => handleOpenCustomerModal()} className="px-4 py-2 bg-indigo-600 rounded-xl text-sm font-semibold shadow-lg">Tambah Baru</button>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-x-auto shadow-xl">
                  <table className="w-full text-left text-sm min-w-[900px]">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800">
                      <tr><th className="py-3 px-4">Blok</th><th className="py-3 px-4">Nama Pelanggan</th><th className="py-3 px-4">Paket & Tarif</th><th className="py-3 px-4">Tempo</th><th className="py-3 px-4">Layanan</th><th className="py-3 px-4">Bayar</th><th className="py-3 px-4 text-right">Opsi</th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {filteredCustomers.map(cust => {
                        const pkg = getPackage(cust.packageId);
                        const isPaid = cust.payments && cust.payments[currentPeriodKey];
                        return (
                          <tr key={cust.id} className="hover:bg-slate-800/40">
                            <td className="py-3 px-4 font-mono font-bold text-indigo-300">{cust.block}<br/><span className="text-[10px] font-normal text-slate-500">{cust.notes}</span></td>
                            <td className="py-3 px-4 font-semibold">{cust.name}</td>
                            <td className="py-3 px-4"><span className="font-medium">{pkg.speed}</span><p className="text-xs text-slate-400">{formatIDR(pkg.price)}</p></td>
                            <td className="py-3 px-4 font-bold">Tgl {cust.dueDate}</td>
                            <td className="py-3 px-4"><button onClick={() => toggleCustomerStatus(cust)} className={`px-2 py-1 rounded text-xs border ${cust.status === 'Aktif' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}`}>{cust.status}</button></td>
                            <td className="py-3 px-4"><button onClick={() => togglePayment(cust)} className={`px-2 py-1 rounded text-xs border font-bold ${isPaid ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}`}>{isPaid ? 'Lunas' : 'Belum'}</button></td>
                            <td className="py-3 px-4 text-right">
                              <button onClick={() => handleOpenCustomerModal(cust)} className="p-1 text-slate-400 hover:text-indigo-400"><Edit3 size={16} /></button>
                              <button onClick={() => handleDeleteCustomer(cust.id)} className="p-1 text-slate-400 hover:text-rose-400"><Trash2 size={16} /></button>
                            </td>
                          </tr>
                        )
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* TAB BUKU KAS */}
            {activeTab === 'ledger' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between bg-slate-900 p-5 rounded-2xl border border-slate-800">
                  <h3 className="text-lg font-bold">Buku Kas ({MONTHS[selectedMonth]})</h3>
                  <div className="flex gap-2">
                    <button onClick={exportBukuKas} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold flex gap-2"><ArrowDownRight size={16}/> Export Excel</button>
                    <button onClick={() => handleOpenExpenseModal()} className="px-4 py-2 bg-rose-600 text-white rounded-xl text-sm font-semibold flex gap-2"><Plus size={16}/> Catat Pengeluaran</button>
                  </div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p className="text-xs text-slate-400">Pemasukan</p><p className="text-xl font-bold text-emerald-400">{formatIDR(actualPaidRevenue)}</p></div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p className="text-xs text-slate-400">Pengeluaran</p><p className="text-xl font-bold text-rose-400">{formatIDR(totalExpenseAmount)}</p></div>
                  <div className="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p className="text-xs text-slate-400">Saldo Bersih</p><p className="text-xl font-bold text-indigo-400">{formatIDR(netProfit)}</p></div>
                </div>
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <table className="w-full text-left text-sm min-w-[700px]">
                    <thead className="bg-slate-950 text-slate-400 border-b border-slate-800"><tr><th className="py-3 px-4">Tanggal</th><th className="py-3 px-4">Uraian</th><th className="py-3 px-4">Admin</th><th className="py-3 px-4">Nominal</th><th className="py-3 px-4 text-right">Aksi</th></tr></thead>
                    <tbody className="divide-y divide-slate-800">
                      {currentPeriodExpenses.map(exp => (
                        <tr key={exp.id}>
                          <td className="py-3 px-4">{exp.date}</td>
                          <td className="py-3 px-4 font-medium"><span className="text-[10px] bg-slate-800 px-1 py-0.5 rounded border border-slate-700 mr-2">{exp.category}</span>{exp.description}</td>
                          <td className="py-3 px-4 text-xs">{exp.admin}</td>
                          <td className="py-3 px-4 font-bold text-rose-400">{formatIDR(exp.amount)}</td>
                          <td className="py-3 px-4 text-right">
                            <button onClick={() => handleOpenExpenseModal(exp)} className="p-1 text-slate-400 hover:text-indigo-400"><Edit3 size={16} /></button>
                            <button onClick={() => handleDeleteExpense(exp.id)} className="p-1 text-slate-400 hover:text-rose-400"><Trash2 size={16} /></button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* MODALS */}
          {isCustomerModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-lg p-6">
                <h3 className="text-lg font-bold mb-4">{editingCustomer ? 'Edit Pelanggan' : 'Tambah Pelanggan'}</h3>
                <form onSubmit={handleSaveCustomer} className="space-y-4">
                  <div className="grid grid-cols-2 gap-4">
                    <input type="text" required placeholder="Blok (Misl: A2)" value={formData.block} onChange={e => setFormData({...formData, block: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm uppercase"/>
                    <input type="text" required placeholder="Nama Pelanggan" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  </div>
                  <input type="text" placeholder="No HP/WA (0812...)" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <select value={formData.packageId} onChange={e => setFormData({...formData, packageId: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    {PACKAGES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
                  </select>
                  <div className="grid grid-cols-2 gap-4">
                    <input type="number" required placeholder="Tgl Tempo (1-31)" min="1" max="31" value={formData.dueDate} onChange={e => setFormData({...formData, dueDate: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                    <select value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                      <option value="Aktif">Aktif</option><option value="Tidak Aktif">Tidak Aktif</option><option value="Isolir">Isolir</option>
                    </select>
                  </div>
                  <input type="text" placeholder="Keterangan (Lokasi: Ranau, dsb)" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsCustomerModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-700">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {isExpenseModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-md p-6">
                <h3 className="text-lg font-bold mb-4">Input Kas Keluar</h3>
                <form onSubmit={handleSaveExpense} className="space-y-4">
                  <input type="date" required value={expenseForm.date} onChange={e => setExpenseForm({...expenseForm, date: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <select value={expenseForm.category} onChange={e => setExpenseForm({...expenseForm, category: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm">
                    <option value="Operasional">Operasional</option><option value="Maintenance">Maintenance</option><option value="FAM / Konsumsi">FAM / Konsumsi</option><option value="Lainnya">Lainnya</option>
                  </select>
                  <input type="text" required placeholder="Uraian" value={expenseForm.description} onChange={e => setExpenseForm({...expenseForm, description: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <input type="number" required placeholder="Nominal (Rp)" value={expenseForm.amount} onChange={e => setExpenseForm({...expenseForm, amount: e.target.value})} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm"/>
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setIsExpenseModalOpen(false)} className="flex-1 py-2 rounded-xl border border-slate-700">Batal</button>
                    <button type="submit" className="flex-1 py-2 rounded-xl bg-rose-600 text-white font-semibold">Simpan</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render Aplikasi ke DOM
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
