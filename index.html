// ============ 4. UTILITAS ============
function formatIDRClient(v) {
    return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0 }).format(v || 0);
}
function getPackageLabel(id) {
    const map = {
        'free_0':'Gratis - Rp 0','5mbps_100':'Standar 5 Mbps - Rp 100.000',
        '10mbps_150':'Standar 10 Mbps - Rp 150.000','15mbps_200':'Standar 15 Mbps - Rp 200.000',
        '20mbps_250':'Standar 20 Mbps - Rp 250.000','25mbps_300':'Standar 25 Mbps - Rp 300.000',
        '30mbps_350':'Standar 30 Mbps - Rp 350.000',
        'netflix_10mbps_200':'Netflix 10 Mbps - Rp 200.000','netflix_15mbps_250':'Netflix 15 Mbps - Rp 250.000'
    };
    return map[id] || id || '-';
}
function getPackagePrice(id) {
    const map = {
        'free_0':0,'5mbps_100':100000,'10mbps_150':150000,'15mbps_200':200000,'20mbps_250':250000,
        '25mbps_300':300000,'30mbps_350':350000,'netflix_10mbps_200':200000,'netflix_15mbps_250':250000
    };
    return map[id] || 0;
}
function cleanPhoneJS(p) {
    let x = (p || '').replace(/\D/g, '');
    if (x.startsWith('0')) x = '62' + x.substring(1);
    return x;
}
function compressClientImage(file, maxWidth = 900, quality = 0.75) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ============ 9. LOGIN ============
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    const wa = document.getElementById('loginWA').value.trim();
    btn.innerText = "Memeriksa..."; btn.disabled = true;

    const normalized = cleanPhoneJS(wa);
    const withZero = normalized.startsWith('62') ? '0' + normalized.substring(2) : normalized;

    try {
        let matched = null;
        for (const q of [wa, normalized, withZero]) {
            const snap = await db.collection('customers').where('phone', '==', q).get();
            if (!snap.empty) { matched = snap.docs[0]; break; }
        }
        if (!matched) {
            const all = await db.collection('customers').get();
            const found = all.docs.find(d => cleanPhoneJS(d.data().phone) === normalized);
            if (found) matched = found;
        }
        if (!matched) {
            alert("Nomor WhatsApp tidak terdaftar. Silakan daftar dulu.");
            return;
        }
        currentUserDocId = matched.id;
        const data = matched.data();
        localStorage.setItem('mabunet_client_session', JSON.stringify({ id: currentUserDocId, foto: data.foto_profil || '' }));
        document.getElementById('loginForm').reset();
        bukaAplikasiPenuh();
        mulaiListenerRealtime();
    } catch (err) {
        alert("Gagal login: " + err.message);
    } finally {
        btn.innerText = "Masuk ke Portal"; btn.disabled = false;
    }
});

// ============ 11. REAL-TIME LISTENER (PROFIL, TAGIHAN, NOTIF) ============
function mulaiListenerRealtime() {
    if (!currentUserDocId) return;

    // Listener data pelanggan
    if (profilListener) profilListener();
    profilListener = db.collection('customers').doc(currentUserDocId).onSnapshot(doc => {
        if (!doc.exists) return;
        const data = doc.data();
        globalName    = data.name || '';
        globalBlock   = data.block || '';
        globalPhone   = data.phone || '';
        globalDueDate = data.dueDate || 1;

        document.getElementById('homeNamaClient').textContent = data.name || 'Pelanggan';
        document.getElementById('homeBlokClient').textContent = data.block || '-';
        document.getElementById('homePaketText').textContent = getPackageLabel(data.packageId);
        document.getElementById('homeStatusText').textContent = data.status || '-';
        document.getElementById('homeStatusDot').className = 'w-2 h-2 rounded-full ' +
            (data.status === 'Aktif' ? 'bg-emerald-400' : 'bg-rose-400');

        document.getElementById('profilNama').value  = data.name || '';
        document.getElementById('profilWA').value    = data.phone || '';
        document.getElementById('profilStatus').value= data.status || '-';
        document.getElementById('profilBlok').value  = data.block || '-';
        document.getElementById('profilTempo').value = data.dueDate ? `Tgl ${data.dueDate}` : '-';
        document.getElementById('profilPaket').value = getPackageLabel(data.packageId);
        if (data.foto_profil) document.getElementById('profilImage').src = data.foto_profil;

        // Pending upgrade
        const alertBox = document.getElementById('pendingUpgradeAlert');
        const btnUp = document.getElementById('btnBukaUpgrade');
        if (data.pendingUpgrade) {
            alertBox.classList.remove('hidden');
            document.getElementById('pendingPackageName').textContent = getPackageLabel(data.pendingUpgrade.packageId);
            if (btnUp) { btnUp.disabled = true; btnUp.classList.add('opacity-50'); }
        } else {
            alertBox.classList.add('hidden');
            if (btnUp) { btnUp.disabled = false; btnUp.classList.remove('opacity-50'); }
        }

        // Tagihan
        const monthKey = new Date().toISOString().slice(0, 7);
        const isPaid = data.payments && data.payments[monthKey];
        const price = getPackagePrice(data.packageId);
        document.getElementById('homeTagihanText').textContent = formatIDRClient(price);
        document.getElementById('payTotalTagihan').textContent = formatIDRClient(price);
        const stat = document.getElementById('payStatusTagihan');
        stat.textContent = isPaid
            ? '✓ LUNAS bulan ini'
            : `Belum lunas — Jatuh tempo tgl ${data.dueDate || 1}`;
        stat.className = 'text-[10px] mt-2 ' + (isPaid ? 'text-emerald-300' : 'text-rose-300');
    });

    // Listener pengumuman
    if (announcementsListener) announcementsListener();
    announcementsListener = db.collection('announcements').orderBy('time', 'desc').limit(20).onSnapshot(snap => {
        announcementsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const seen = JSON.parse(localStorage.getItem('mabunet_notif_seen') || '[]');
        const hasNew = announcementsCache.some(a => !seen.includes(a.id));
        document.getElementById('notifBadge').classList.toggle('hidden', !hasNew);
    });
}

// ============ 13. CHAT CLIENT ============
function bukaChat(ticketId, ticketType, status) {
    currentChatTicketId = ticketId;
    document.getElementById('chatTicketType').textContent = ticketType || 'Obrolan Layanan';
    document.getElementById('chatTicketStatus').textContent = 'Status: ' + (status || 'Open');
    const modal = document.getElementById('chatModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');

    if (chatListener) chatListener();
    chatListener = db.collection('tickets').doc(ticketId).collection('messages').onSnapshot(snap => {
        const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        msgs.sort((a, b) => (a.time || 0) - (b.time || 0));
        renderClientChatMessages(msgs);
    });
}
function tutupChat() {
    const modal = document.getElementById('chatModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    if (chatListener) { chatListener(); chatListener = null; }
    currentChatTicketId = null;
    hapusPreviewGambarChat();
}
function renderClientChatMessages(msgs) {
    const container = document.getElementById('chatMessages');
    if (!msgs.length) {
        container.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Belum ada pesan. Ketik pesan pertama Anda.</div>';
        return;
    }
    container.innerHTML = msgs.map(msg => {
        const isAdmin = msg.senderType === 'admin' || msg.role === 'admin' || msg.isAdmin === true;
        const sender = isAdmin ? (msg.sender || 'Admin') : 'Anda';
        const text = msg.text || msg.message || '';
        const img = msg.imageUrl || msg.attachment || null;
        const safeText = (typeof text === 'string' && !text.startsWith('data:image')) ? text.replace(/</g, '&lt;') : '';
        return `
            <div class="flex ${isAdmin ? 'justify-start' : 'justify-end'}">
                <div class="max-w-[80%] rounded-2xl p-3 shadow-sm ${isAdmin ? 'bg-white border border-slate-200 rounded-tl-none' : 'bg-kai-blue text-white rounded-tr-none'}">
                    <p class="text-[10px] font-extrabold mb-1 ${isAdmin ? 'text-kai-orange' : 'text-blue-200'}">${sender}</p>
                    ${safeText ? `<p class="text-xs whitespace-pre-line">${safeText}</p>` : ''}
                    ${img ? `<img src="${img}" class="mt-2 rounded-xl max-h-60 w-auto object-cover cursor-pointer" onclick="window.open('${img}','_blank')" />` : ''}
                </div>
            </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
}
async function handleClientChatImage(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
        const b64 = await compressClientImage(file);
        document.getElementById('clientChatImagePreview').src = b64;
        document.getElementById('clientChatImagePreviewContainer').classList.remove('hidden');
    } catch (err) { alert("Gagal proses gambar: " + err.message); }
    e.target.value = null;
}
function hapusPreviewGambarChat() {
    document.getElementById('clientChatImagePreview').src = '';
    document.getElementById('clientChatImagePreviewContainer').classList.add('hidden');
    const cam = document.getElementById('clientChatCamera');
    const gal = document.getElementById('clientChatGallery');
    if (cam) cam.value = null;
    if (gal) gal.value = null;
}
document.getElementById('chatForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!currentChatTicketId) { alert("Tidak ada obrolan aktif."); return; }
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    const preview = document.getElementById('clientChatImagePreview').src;
    if (!text && !preview) return;
    try {
        input.value = '';
        const payload = {
            sender: globalName || 'Pelanggan',
            senderName: globalName || 'Pelanggan',
            senderType: 'client', role: 'client', isAdmin: false,
            text: text || '📷 Mengirim Foto',
            message: text || '📷 Mengirim Foto',
            time: Date.now(),
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        if (preview) { payload.imageUrl = preview; payload.attachment = preview; }
        await db.collection('tickets').doc(currentChatTicketId).collection('messages').add(payload);
        await db.collection('tickets').doc(currentChatTicketId).update({
            status: 'In Progress',
            lastReply: text || '📷 Foto',
            lastImage: preview || null,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        hapusPreviewGambarChat();
    } catch (err) { alert("Gagal kirim: " + err.message); }
});

// ============ 14. NAV CHAT (auto create ticket if none) ============
async function bukaMenuChat(btn) {
    if (!currentUserDocId) {
        alert("Silakan login dulu.");
        switchView('view-login', null);
        return;
    }
    try {
        let snap = await db.collection('tickets').where('customerId', '==', currentUserDocId).get();
        if (snap.empty && globalPhone) {
            snap = await db.collection('tickets').where('phone', '==', globalPhone).get();
        }
        if (!snap.empty) {
            const sorted = snap.docs.sort((a, b) => (b.data().time || 0) - (a.data().time || 0));
            const t = sorted[0];
            bukaChat(t.id, t.data().subject || 'Obrolan Layanan', t.data().status || 'Open');
        } else {
            // Buat tiket baru otomatis
            const ref = await db.collection('tickets').add({
                customerId: currentUserDocId,
                customerName: globalName, name: globalName,
                block: globalBlock, phone: globalPhone,
                subject: 'Obrolan Layanan MABUNET',
                issueType: 'Chat Umum', category: 'Chat Umum', type: 'Chat Umum',
                status: 'New',
                message: 'Memulai obrolan dengan admin.',
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                time: Date.now()
            });
            bukaChat(ref.id, 'Obrolan Layanan MABUNET', 'Open');
        }
    } catch (err) {
        alert("Gagal membuka chat: " + err.message);
    }
}

// ============ 16. UPGRADE PAKET ============
function bukaUpgrade() {
    const modal = document.getElementById('upgradeModal');
    const content = document.getElementById('upgradeContent');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    setTimeout(() => content.classList.remove('translate-y-full'), 10);
}
function tutupUpgrade() {
    const modal = document.getElementById('upgradeModal');
    const content = document.getElementById('upgradeContent');
    content.classList.add('translate-y-full');
    setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }, 300);
    document.getElementById('formUpgrade').reset();
    document.getElementById('upgradeProofPreview').classList.add('hidden');
    tempUpgradeProofBase64 = null;
}
function previewUpgradeProof(e) {
    const file = e.target.files[0];
    if (!file) { tempUpgradeProofBase64 = null; document.getElementById('upgradeProofPreview').classList.add('hidden'); return; }
    compressClientImage(file, 1000, 0.8).then(b64 => {
        tempUpgradeProofBase64 = b64;
        const prev = document.getElementById('upgradeProofPreview');
        prev.src = b64; prev.classList.remove('hidden');
    });
}
document.getElementById('formUpgrade').addEventListener('submit', async function(e) {
    e.preventDefault();
    if (!currentUserDocId) return alert("Silakan login dulu.");
    if (!tempUpgradeProofBase64) return alert("Upload bukti pembayaran dulu.");
    const targetPkg = document.getElementById('upgradeSelect').value;
    if (!targetPkg) return alert("Pilih paket baru dulu.");
    const btn = document.getElementById('btnSubmitUpgrade');
    btn.innerText = "Mengirim..."; btn.disabled = true;
    try {
        const ticketRef = await db.collection('tickets').add({
            customerId: currentUserDocId,
            customerName: globalName, name: globalName,
            block: globalBlock, phone: globalPhone,
            subject: 'Upgrade Paket',
            issueType: 'Upgrade', category: 'upgrade', type: 'upgrade',
            status: 'New',
            message: `Pengajuan upgrade ke: ${getPackageLabel(targetPkg)}`,
            imageUrl: tempUpgradeProofBase64,
            targetPackageId: targetPkg, newPackageId: targetPkg, packageId: targetPkg,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            time: Date.now()
        });
        await db.collection('approvals').add({
            type: 'upgrade', category: 'upgrade', status: 'pending',
            customerId: currentUserDocId,
            customerName: globalName, name: globalName,
            block: globalBlock, phone: globalPhone,
            targetPackageId: targetPkg,
            imageUrl: tempUpgradeProofBase64,
            ticketId: ticketRef.id,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            time: Date.now()
        });
        await db.collection('customers').doc(currentUserDocId).update({
            pendingUpgrade: { packageId: targetPkg, requestedAt: Date.now() }
        });
        alert("Pengajuan upgrade terkirim! Menunggu konfirmasi admin.");
        tutupUpgrade();
    } catch (err) {
        alert("Gagal kirim: " + err.message);
    } finally {
        btn.innerText = "Ajukan & Kirim Bukti"; btn.disabled = false;
    }
});
async function batalkanUpgrade() {

// ============ 18. CROPPER FOTO PROFIL ============
function openCropper(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        document.getElementById('imageToCrop').src = ev.target.result;
        document.getElementById('cropperModal').classList.remove('hidden');
        document.getElementById('cropperModal').classList.add('flex');
        setTimeout(() => {
            if (cropperInstance) cropperInstance.destroy();
            cropperInstance = new Cropper(document.getElementById('imageToCrop'), {
                aspectRatio: 1, viewMode: 1, autoCropArea: 1,
                background: false, movable: true, zoomable: true
            });
        }, 100);
    };
    reader.readAsDataURL(file);
    e.target.value = null;
}
function closeCropper() {
    if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
    document.getElementById('cropperModal').classList.add('hidden');
    document.getElementById('cropperModal').classList.remove('flex');
}
async function cropImage() {
    if (!cropperInstance) return;
    const canvas = cropperInstance.getCroppedCanvas({ width: 400, height: 400, fillColor: '#fff' });
    const b64 = canvas.toDataURL('image/jpeg', 0.85);
    document.getElementById('profilImage').src = b64;
    closeCropper();
    if (currentUserDocId) {
        try {
            await db.collection('customers').doc(currentUserDocId).update({ foto_profil: b64 });
            const saved = JSON.parse(localStorage.getItem('mabunet_client_session') || '{}');
            saved.foto = b64;
            localStorage.setItem('mabunet_client_session', JSON.stringify(saved));
        } catch (err) { console.error(err); }
    }
}

// ============ 20. RIWAYAT PEMBAYARAN ============
async function bukaRiwayat() {
    switchView('view-riwayat', document.getElementById('nav-akun'));
    const list = document.getElementById('listRiwayat');
    list.innerHTML = '<div class="text-center text-xs text-slate-400 py-10 animate-pulse">Memuat riwayat...</div>';
    if (!currentUserDocId) {
        list.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Silakan login dulu.</div>';
        return;
    }
    try {
        const docRef = await db.collection('customers').doc(currentUserDocId).get();
        const data = docRef.data();
        const payments = data.payments || {};
        const entries = Object.entries(payments).filter(([_, v]) => v).sort((a, b) => b[0].localeCompare(a[0]));
        if (!entries.length) {
            list.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Belum ada riwayat pembayaran.</div>';
            return;
        }
        const bulanArr = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        list.innerHTML = entries.map(([mk]) => {
            const [y, m] = mk.split('-');
            const bulan = bulanArr[parseInt(m) - 1] || m;
            return `
                <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm flex justify-between items-center">
                    <div>
                        <p class="font-extrabold text-sm text-kai-blue">${bulan} ${y}</p>
                        <p class="text-[10px] font-bold text-emerald-600 mt-1">✓ LUNAS</p>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-slate-400">Paket Aktif</p>
                        <p class="text-xs font-black text-kai-orange">${getPackageLabel(data.packageId)}</p>
                    </div>
                </div>`;
        }).join('');
    } catch (err) {
        list.innerHTML = '<div class="text-center text-xs text-rose-500 py-10">Gagal memuat: ' + err.message + '</div>';
    }
}

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        const wa = document.getElementById('loginWA').value.trim();
        btn.innerText = "Memeriksa Data..."; btn.disabled = true;

        const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
        const normalizedInput = cleanPhone(wa);
        const withZero = normalizedInput.startsWith('62') ? '0' + normalizedInput.substring(2) : normalizedInput;

        try {
            let snapshot = await db.collection('customers').where('phone', '==', wa).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', normalizedInput).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', withZero).get();
            
            if (snapshot.empty) {
                const allSnap = await db.collection('customers').get();
                const matched = allSnap.docs.find(d => cleanPhone(d.data().phone) === normalizedInput);

    function mulaiListenerRealtime() {
        if(!currentUserDocId) return;

        profilListener = db.collection('customers').doc(currentUserDocId).onSnapshot(doc => {

                const data = doc.data();
                globalName = data.name || '-'; globalPhone = data.phone || '-'; globalBlock = data.block || '-';
                globalDueDate = data.dueDate || null;
                
                if(document.getElementById('profilNama')) {
                    document.getElementById('profilNama').value = globalName;
                    document.getElementById('profilWA').value = globalPhone;
                    document.getElementById('profilBlok').value = globalBlock;
                    document.getElementById('profilTempo').value = data.dueDate ? `Tanggal ${data.dueDate}` : '-';
                    
                    currentPackageName = data.packageId || 'Belum Ada Paket';
                    document.getElementById('profilPaket').value = currentPackageName.replace(/_/g, ' ').toUpperCase();

                    const statEl = document.getElementById('profilStatus');
                    statEl.value = data.status || '-';
                    if(data.status === 'Aktif') { statEl.classList.add('text-emerald-600'); statEl.classList.remove('text-rose-600'); } 
                    else { statEl.classList.add('text-rose-600'); statEl.classList.remove('text-emerald-600'); }
                    if (data.foto_profil) document.getElementById('profilImage').src = data.foto_profil;
                    
                    // --- UPDATE TAGIHAN DI MENU PEMBAYARAN ---
                    const PACKAGE_PRICES = { '5mbps_100': 100000, '10mbps_150': 150000, '15mbps_200': 200000, '20mbps_250': 250000, '25mbps_300': 300000, 'netflix_10mbps_200': 200000, 'netflix_15mbps_250': 250000 };
                    const hargaPaket = PACKAGE_PRICES[data.packageId] || 0;
                    const d = new Date();
                    const bulanSekarang = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    const sudahBayar = data.payments && data.payments[bulanSekarang];
                    
                    const tagihanText = document.getElementById('payTotalTagihan');
                    const statusText = document.getElementById('payStatusTagihan');
                    
                    if (tagihanText) {
                        if (sudahBayar || hargaPaket === 0) {
                            tagihanText.innerText = 'LUNAS';
                            tagihanText.classList.add('text-emerald-500');
                            tagihanText.classList.remove('text-kai-orange');
                            if(statusText) statusText.innerText = 'Tagihan bulan ini sudah dibayar.';
                        } else {
                            tagihanText.innerText = `Rp ${hargaPaket.toLocaleString('id-ID')}`;
                            tagihanText.classList.remove('text-emerald-500');
                            tagihanText.classList.add('text-kai-orange');
                            if(statusText) statusText.innerText = 'Mohon selesaikan pembayaran.';
                        }
                    }
                    // ----------------------------------------

                    if (data.pendingUpgrade) {
                        document.getElementById('pendingUpgradeAlert').classList.remove('hidden');
                        document.getElementById('pendingPackageName').innerText = data.pendingUpgrade.packageId.replace(/_/g, ' ').toUpperCase();
                        document.getElementById('btnBukaUpgrade').classList.add('hidden');
                    } else {
                        document.getElementById('pendingUpgradeAlert').classList.add('hidden');
                        document.getElementById('btnBukaUpgrade').classList.remove('hidden');
                    }
                }
            }
        });      
        muatNotifikasi();
    }

    function handleClientChatImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                const maxWidth = 900;
                if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                clientChatImageData = canvas.toDataURL('image/jpeg', 0.75);
                
                document.getElementById('clientChatImagePreview').src = clientChatImageData;
                document.getElementById('clientChatImagePreviewContainer').classList.remove('hidden');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = null;
    }

        db.collection('announcements').orderBy('time', 'desc').limit(10).onSnapshot(snap => {

            }

            listDiv.innerHTML = hasNotif ? htmlContent : `<div class="text-center py-10"><p class="text-[10px] font-bold text-slate-400">Belum ada pengumuman.</p></div>`;
            if(hasNotif) document.getElementById('notifBadge').classList.remove('hidden'); 
        });

    document.getElementById('profilForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSimpanProfil');
        btn.innerText = "Menyimpan..."; btn.disabled = true;

        const fotoBaru = document.getElementById('profilImage').src;
        try {
            await db.collection('customers').doc(currentUserDocId).update({ foto_profil: fotoBaru });
            const ls = JSON.parse(localStorage.getItem('mabunet_client_session'));
            ls.foto = fotoBaru;
            localStorage.setItem('mabunet_client_session', JSON.stringify(ls));
            alert("Foto profil berhasil diperbarui!");
        } catch(err) {
            alert("Gagal menyimpan foto.");
        } finally {
            btn.innerText = "Simpan Perubahan Foto"; btn.disabled = false;
        }
    });

    function logoutAkun() {
        if(confirm("Yakin ingin keluar dari portal?")) {
            currentUserDocId = null;
            localStorage.removeItem('mabunet_client_session');
            tutupAplikasiPenuh();
        }
    }

    function openCropper(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imageToCrop').src = e.target.result;
                document.getElementById('cropperModal').classList.remove('hidden');
                document.getElementById('cropperModal').classList.add('flex');
                if (cropperInstance) cropperInstance.destroy();
                cropperInstance = new Cropper(document.getElementById('imageToCrop'), { aspectRatio: 1, viewMode: 1, autoCropArea: 1 });
            };
            reader.readAsDataURL(file);
        }
        event.target.value = ''; 
    }

    function closeCropper() {
        document.getElementById('cropperModal').classList.add('hidden');
        document.getElementById('cropperModal').classList.remove('flex');
        if (cropperInstance) { cropperInstance.destroy(); cropperInstance = null; }
    }

    function cropImage() {
        if (!cropperInstance) return;
        const canvas = cropperInstance.getCroppedCanvas({ width: 300, height: 300 });
        document.getElementById('profilImage').src = canvas.toDataURL('image/jpeg');
        closeCropper();
    }
  </script>
</body>
</html>
