  <style>
    /* CSS Admin */
    body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
    .dark body { background-color: #0f172a; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    .custom-scrollbar::-webkit-scrollbar { display: none; width: 0px; }
    .custom-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .ticket-divider { background-image: linear-gradient(to bottom, #e2e8f0 50%, rgba(255,255,255,0) 0%); background-position: right; background-size: 2px 10px; background-repeat: repeat-y; }
    .dark .ticket-divider { background-image: linear-gradient(to bottom, #334155 50%, rgba(255,255,255,0) 0%); }
    .pb-safe { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    
    /* CSS Client */
    .view-section:not(.active) { display: none !important; }
    .view-section { animation: fadeIn 0.3s ease; width: 100%; flex: 1; overflow-y: auto; padding-bottom: 20px; }
    .view-section.active { display: block; }
    .view-section.active.flex { display: flex; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .accordion-content { max-height: 0; transition: max-height 0.3s ease-out; }
    .accordion-item.active .accordion-icon { transform: rotate(180deg); }

    @media print {
      body * { visibility: hidden; }
      #print-receipt, #print-receipt * { visibility: visible; }
      #print-receipt { position: absolute; left: 0; top: 0; width: 58mm; margin: 0; padding: 5px; font-family: monospace; font-size: 11px; color: #000; background: #fff; }
      @page { margin: 0; }
    }
  </style>
</head>
<body>




  <!-- ========================================== -->
  <!-- 4. SCRIPT CLIENT (VANILLA JS)              -->
  <!-- ========================================== -->
  <script>
    function checkRoute() {
        const isClient = window.location.pathname.includes('client') || window.location.hash === '#client';
        const clientUI = document.getElementById('client-ui');
        const adminUI = document.getElementById('root');
        
        if (isClient) {
            clientUI.classList.remove('hidden');
            adminUI.classList.add('hidden');
            
            // KUNCI BODY AGAR TIDAK BISA DI-SCROLL LIAR
            document.body.className = 'bg-kai-bg text-slate-800 h-[100dvh] w-full overflow-hidden m-0 p-0';
            document.documentElement.className = 'h-full overflow-hidden';
            document.title = 'Portal Pelanggan MabuNet';
            
            const savedUser = localStorage.getItem('mabunet_client_session');
            
            // Sembunyikan semua halaman terlebih dahulu
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            
            if (savedUser) {
                // Jika sudah login
                document.getElementById('mainHeader').classList.remove('hidden');
                document.getElementById('bottomNav').classList.remove('hidden');
                document.getElementById('view-home').classList.add('active');
            } else {
                // Jika BELUM login
                document.getElementById('mainHeader').classList.add('hidden');
                document.getElementById('bottomNav').classList.add('hidden');
                document.getElementById('view-login').classList.add('active');
            }
        } else {
            clientUI.classList.add('hidden');
            adminUI.classList.remove('hidden');
            document.body.className = 'text-slate-800 dark:text-slate-100 antialiased h-screen overflow-hidden transition-colors duration-300';
            document.documentElement.className = '';
            document.title = 'MABUNET - Master Billing & Network';
        }
    }
    window.addEventListener('hashchange', checkRoute);
    window.addEventListener('load', checkRoute);
    setTimeout(checkRoute, 100);

    // --- LOGIKA CLIENT MABUNET ---
    const firebaseConfig = {
        apiKey: "AIzaSyCE-kFF6ZaDZ5UodX2MJfvooshQT8LH0ak",
        authDomain: "billing-mabunet.firebaseapp.com",
        projectId: "billing-mabunet",
        storageBucket: "billing-mabunet.firebasestorage.app",
        messagingSenderId: "362703627315",
        appId: "1:362703627315:web:a24bf8a6ba9d07f13e6f46"
    };
    let clientApp;
    try {
        clientApp = firebase.app('clientApp');
    } catch (e) {
        clientApp = firebase.initializeApp(firebaseConfig, 'clientApp');
    }
    const db = clientApp.firestore();
    
    let currentUserDocId = null;
    let cropperInstance = null;
    let currentPackageName = ""; 
    let globalName = ""; let globalBlock = ""; let globalPhone = ""; let globalDueDate = null;
    
    let profilListener = null;
    let ticketsListener = null;
    let chatListener = null;
    let currentChatTicketId = null;

    let tempUpgradeProofBase64 = null;
    let tempBillProofBase64 = null;

    document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', function() {
            const item = this.parentElement; const content = item.querySelector('.accordion-content');
            const isActive = item.classList.contains('active');
            document.querySelectorAll('.accordion-item').forEach(otherItem => {
                otherItem.classList.remove('active'); otherItem.querySelector('.accordion-content').style.maxHeight = null;
            });
            if (!isActive) { item.classList.add('active'); content.style.maxHeight = content.scrollHeight + "px"; }
        });
    });

    function switchView(viewId, btnElement) {
        document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        
        if(btnElement) {
            document.querySelectorAll('.nav-item').forEach(btn => {
                btn.classList.remove('active', 'text-kai-orange', 'scale-110'); btn.classList.add('text-slate-400');
            });
            btnElement.classList.remove('text-slate-400'); btnElement.classList.add('active', 'text-kai-orange', 'scale-110');
        }
        window.scrollTo(0,0);
    }

    window.addEventListener('load', () => {
        const savedUser = localStorage.getItem('mabunet_client_session');
        if (savedUser) {
            const data = JSON.parse(savedUser);
            currentUserDocId = data.id;
            if(data.foto) document.getElementById('profilImage').src = data.foto;
            bukaAplikasiPenuh();
            mulaiListenerRealtime(); 
        }
    });

    function bukaAplikasiPenuh() {
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        switchView('view-home', document.getElementById('nav-home'));
    }

    function tutupAplikasiPenuh() {
        document.getElementById('mainHeader').classList.add('hidden');
        document.getElementById('bottomNav').classList.add('hidden');
        switchView('view-login', null);
        if(profilListener) profilListener();
        if(ticketsListener) ticketsListener();
    }
    
    function masukSebagaiTamu() {
        document.getElementById('mainHeader').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        switchView('view-registrasi', document.getElementById('nav-registrasi'));
    }

    function bukaMenuAkun(btn) {
        const savedUser = localStorage.getItem('mabunet_client_session');
        if (currentUserDocId || savedUser) { 
            switchView('view-profil', btn); 
        } else { 
            switchView('view-login', btn); 
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnLogin');
        const wa = document.getElementById('loginWA').value.trim();
        btn.innerText = "Memeriksa Data..."; btn.disabled = true;

        const cleanPhone = (phoneStr) => { let p = (phoneStr || '').replace(/\D/g, ''); if (p.startsWith('0')) p = '62' + p.substring(1); return p; };
        const normalizedInput = cleanPhone(wa);
        const withZero = normalizedInput.startsWith('62') ? '0' + normalizedInput.substring(2) : normalizedInput;

        try {
            let snapshot = await db.collection('customers').where('phone', '==', wa).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', normalizedInput).get();
            if (snapshot.empty) snapshot = await db.collection('customers').where('phone', '==', withZero).get();
            
            if (snapshot.empty) {
                const allSnap = await db.collection('customers').get();
                const matched = allSnap.docs.find(d => cleanPhone(d.data().phone) === normalizedInput);
                if (matched) {
                    currentUserDocId = matched.id;
                    const userData = matched.data();
                    localStorage.setItem('mabunet_client_session', JSON.stringify({id: currentUserDocId, foto: userData.foto_profil}));
                    document.getElementById('loginForm').reset();
                    bukaAplikasiPenuh(); 
                    mulaiListenerRealtime();
                    return;
                }
                alert("Nomor WhatsApp Anda tidak terdaftar dalam sistem."); 
            } else {
                currentUserDocId = snapshot.docs[0].id;
                const userData = snapshot.docs[0].data();
                localStorage.setItem('mabunet_client_session', JSON.stringify({id: currentUserDocId, foto: userData.foto_profil}));
                document.getElementById('loginForm').reset();
                bukaAplikasiPenuh(); 
                mulaiListenerRealtime();
            }
        } catch (err) { alert("Terjadi kesalahan jaringan: " + err.message); } 
        finally { btn.innerText = "Masuk ke Portal"; btn.disabled = false; }
    });

    document.getElementById('regForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const nama = document.getElementById('nama').value;
        const whatsapp = document.getElementById('whatsapp').value;
        const paket = document.getElementById('paket').value; 
        const area = document.getElementById('area').value; 
        const alamat = document.getElementById('alamat').value;
        const ssid = document.getElementById('ssid').value;
        const password_wifi = document.getElementById('password_wifi').value;

        if(whatsapp.replace(/\D/g, '').length < 9) { alert("Nomor WA tidak valid"); return; }
        if(password_wifi.length < 8) { alert("Password WiFi minimal 8 karakter"); return; }

        btn.innerText = "Mengirim Data..."; btn.disabled = true;

        let pppoe_secret = "";
        const namaDepan = nama.split(' ')[0].toLowerCase().replace(/[^a-z]/g, '');
        const regexBlok = /(?:blok\s+)?([a-zA-Z])\s*(\d*)\s*(?:no\.?|nomor|blk|\.|-|\/)?\s*(\d+)/i;
        const match = alamat.match(regexBlok);

        if (match) {
            const hurufBlok = match[1].toLowerCase();
            const angkaBlok = match[2];               
            const noRumah = match[3];                 
            if (angkaBlok) { pppoe_secret = `${hurufBlok}${angkaBlok}.${noRumah}@mabu.net`; } 
            else { pppoe_secret = `${hurufBlok}${noRumah}@mabu.net`; }
        } else { pppoe_secret = `${namaDepan}@mabu.net`; }

        try {
            await db.collection('customers').add({
                name: nama, block: area, phone: whatsapp, packageId: paket, dueDate: 1, 
                status: 'Non-Aktif', notes: `Alamat: ${alamat} | SSID: ${ssid} | Pass: ${password_wifi}`, 
                pppoe_user: pppoe_secret, payments: {} 
            });
            alert("Pendaftaran berhasil! Tim MabuNet akan segera menghubungi WhatsApp Anda.");
            document.getElementById('regForm').reset();
            switchView('view-home', document.getElementById('nav-home'));
        } catch (error) { alert("Terjadi kesalahan jaringan: " + error.message); } 
        finally { btn.innerText = "Kirim Pendaftaran"; btn.disabled = false; }
    });

    function mulaiListenerRealtime() {
        if(!currentUserDocId) return;

        profilListener = db.collection('customers').doc(currentUserDocId).onSnapshot(doc => {
            if (doc.exists) {
                const data = doc.data();
                globalName = data.name || '-'; globalPhone = data.phone || '-'; globalBlock = data.block || '-';
                globalDueDate = data.dueDate || null;
                
                if(document.getElementById('profilNama')) {
                    document.getElementById('profilNama').value = globalName;
                    document.getElementById('profilWA').value = globalPhone;
                    document.getElementById('profilBlok').value = globalBlock;
                    document.getElementById('profilTempo').value = data.dueDate ? `Tanggal ${data.dueDate}` : '-';
                    
                    currentPackageName = data.packageId || 'Belum Ada Paket';
                    document.getElementById('profilPaket').value = currentPackageName.replace(/_/g, ' ').toUpperCase();

                    const statEl = document.getElementById('profilStatus');
                    statEl.value = data.status || '-';
                    if(data.status === 'Aktif') { statEl.classList.add('text-emerald-600'); statEl.classList.remove('text-rose-600'); } 
                    else { statEl.classList.add('text-rose-600'); statEl.classList.remove('text-emerald-600'); }
                    if (data.foto_profil) document.getElementById('profilImage').src = data.foto_profil;
                    // --- UPDATE TAGIHAN DI MENU PEMBAYARAN ---
                    const PACKAGE_PRICES = { '5mbps_100': 100000, '10mbps_150': 150000, '15mbps_200': 200000, '20mbps_250': 250000, '25mbps_300': 300000, 'netflix_10mbps_200': 200000, 'netflix_15mbps_250': 250000 };
                    const hargaPaket = PACKAGE_PRICES[data.packageId] || 0;
                    const d = new Date();
                    const bulanSekarang = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                    const sudahBayar = data.payments && data.payments[bulanSekarang];
                    
                    const tagihanText = document.getElementById('payTotalTagihan');
                    const statusText = document.getElementById('payStatusTagihan');
                    
                    if (tagihanText) {
                        if (sudahBayar || hargaPaket === 0) {
                            tagihanText.innerText = 'LUNAS';
                            tagihanText.classList.add('text-emerald-500');
                            tagihanText.classList.remove('text-kai-orange');
                            if(statusText) statusText.innerText = 'Tagihan bulan ini sudah dibayar.';
                        } else {
                            tagihanText.innerText = `Rp ${hargaPaket.toLocaleString('id-ID')}`;
                            tagihanText.classList.remove('text-emerald-500');
                            tagihanText.classList.add('text-kai-orange');
                            if(statusText) statusText.innerText = 'Mohon selesaikan pembayaran.';
                        }
                    }
                    // ----------------------------------------

                    if (data.pendingUpgrade) {
                        document.getElementById('pendingUpgradeAlert').classList.remove('hidden');
                        document.getElementById('pendingPackageName').innerText = data.pendingUpgrade.packageId.replace(/_/g, ' ').toUpperCase();
                        document.getElementById('btnBukaUpgrade').classList.add('hidden');
                    } else {
                        document.getElementById('pendingUpgradeAlert').classList.add('hidden');
                        document.getElementById('btnBukaUpgrade').classList.remove('hidden');
                    }
                }
            }
        });      
        muatNotifikasi();
    }

    document.getElementById('ticketForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if(!currentUserDocId) { alert("Login dahulu."); return; }

        const btn = document.getElementById('btnSubmitTicket');
        btn.innerHTML = `Mengirim...`; btn.disabled = true;

        const type = document.getElementById('ticketType').value;
        const desc = document.getElementById('ticketDesc').value;

        try {
            const roomRef = db.collection('tickets').doc(currentUserDocId);
            const roomSnap = await roomRef.get();

            if (!roomSnap.exists) {
                await roomRef.set({
                    customerId: currentUserDocId,
                    customerName: globalName, name: globalName, block: globalBlock, phone: globalPhone,
                    issueType: 'Obrolan Layanan', subject: 'Obrolan Layanan', status: 'Open', 
                    timestamp: Date.now(), dateStr: new Date().toLocaleString('id-ID')
                });
            } else {
                await roomRef.update({ status: 'Open', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
            }

            await roomRef.collection('messages').add({
                sender: 'client', senderName: globalName, senderType: 'client', role: 'client', isAdmin: false,
                text: `[${type}] ${desc}`, message: `[${type}] ${desc}`, 
                time: Date.now(), timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            await roomRef.update({ lastReply: `[${type}] ${desc}` });

            document.getElementById('ticketForm').reset();
            alert("Pesan berhasil dikirim! Silakan cek di 'Daftar Tiket & Pesan Anda'.");
        } catch (err) { alert("Gagal mengirim: " + err.message); } 
        finally { btn.innerHTML = `Kirim Pesan`; btn.disabled = false; }
    });

    let clientChatImageData = null;

    function bukaMenuChat(btn) {
        if (!currentUserDocId) {
            alert("Anda harus login untuk menggunakan fitur chat.");
            switchView('view-login', document.getElementById('nav-akun'));
            return;
        }
        
        document.querySelectorAll('.nav-item').forEach(b => {
            b.classList.remove('text-kai-orange', 'scale-110'); b.classList.add('text-slate-400');
        });
        btn.classList.remove('text-slate-400'); btn.classList.add('text-kai-orange', 'scale-110');
        
        bukaChat(currentUserDocId, 'Obrolan Layanan', 'Open');
    }

    function bukaChat(ticketId, type, status) {
        currentChatTicketId = ticketId;
        document.getElementById('chatTicketType').innerText = type || 'Obrolan Layanan';
        document.getElementById('chatTicketStatus').innerText = `Status: ${status}`;
        document.getElementById('chatModal').classList.remove('hidden');
        document.getElementById('chatModal').classList.add('flex');

        if(chatListener) chatListener();

        chatListener = db.collection('tickets').doc(ticketId).collection('messages').orderBy('time', 'asc').onSnapshot(snapshot => {
            const chatBox = document.getElementById('chatMessages');
            let html = '';
            
            if (snapshot.empty) {
                html = '<div class="text-center text-slate-400 text-xs py-10">Mulai obrolan...</div>';
            } else {
                snapshot.forEach(doc => {
                    const msg = doc.data();
                    const isAdmin = msg.senderType === 'admin' || msg.role === 'admin' || msg.isAdmin === true || msg.sender !== 'client';
                    
                    const dateObj = msg.time ? new Date(msg.time) : new Date();
                    const timeStr = dateObj.getHours() + ':' + (dateObj.getMinutes()<10?'0':'') + dateObj.getMinutes();
                    
                    const senderLabel = isAdmin ? 'Admin MABUNET' : (globalName || 'Anda');
                    const imgAttachment = msg.attachmentUrl || msg.imageUrl || msg.image || msg.attachment;
                    const textMsg = msg.text || msg.message || '';
                    
                    const clientPhoto = document.getElementById('profilImage').src;
                    const avatarAdmin = `<div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center shrink-0 border border-slate-300 shadow-sm"><svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>`;
                    const avatarClient = `<div class="w-8 h-8 rounded-full overflow-hidden shrink-0 border border-slate-200 shadow-sm"><img src="${clientPhoto}" class="w-full h-full object-cover"></div>`;

                    if(!isAdmin) {
                        html += `<div class="flex justify-end items-end gap-2">`;
                        html += `<div class="max-w-[75%] flex flex-col items-end">`;
                        html += `<div class="bg-kai-blue text-white rounded-2xl rounded-tr-sm p-3 shadow-sm">`;
                        if(textMsg) html += `<p class="text-xs whitespace-pre-line leading-relaxed">${textMsg}</p>`;
                        if(imgAttachment) html += `<img src="${imgAttachment}" class="mt-2 rounded-xl max-h-60 w-auto object-cover cursor-pointer border border-white/20" onclick="window.open('${imgAttachment}', '_blank')">`;
                        html += `</div>`;
                        html += `<p class="text-[8px] text-slate-400 mt-1 mr-1">${timeStr}</p>`;
                        html += `</div>`;
                        html += avatarClient;
                        html += `</div>`;
                    } else {
                        html += `<div class="flex justify-start items-end gap-2">`;
                        html += avatarAdmin;
                        html += `<div class="max-w-[75%] flex flex-col items-start">`;
                        html += `<div class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 rounded-2xl rounded-tl-sm p-3 shadow-sm">`;
                        html += `<p class="text-[9px] font-black text-kai-orange mb-1">${senderLabel}</p>`;
                        if(textMsg) html += `<p class="text-xs whitespace-pre-line leading-relaxed">${textMsg}</p>`;
                        if(imgAttachment) html += `<img src="${imgAttachment}" class="mt-2 rounded-xl max-h-60 w-auto object-cover cursor-pointer border border-slate-200 dark:border-slate-700" onclick="window.open('${imgAttachment}', '_blank')">`;
                        html += `</div>`;
                        html += `<p class="text-[8px] text-slate-400 mt-1 ml-1">${timeStr}</p>`;
                        html += `</div>`;
                        html += `</div>`;
                    }
                });
            }
            
            chatBox.innerHTML = html;
            setTimeout(() => chatBox.scrollTop = chatBox.scrollHeight, 50);
        });
    }

    function tutupChat() {
        document.getElementById('chatModal').classList.add('hidden');
        document.getElementById('chatModal').classList.remove('flex');
        if(chatListener) { chatListener(); chatListener = null; }
        currentChatTicketId = null;
        hapusPreviewGambarChat();
        
        const activeView = document.querySelector('.view-section.active');
        if (activeView) {
            let navId = 'nav-home';
            if (activeView.id === 'view-pembayaran') navId = 'nav-pembayaran';
            else if (activeView.id === 'view-bantuan') navId = 'nav-bantuan';
            else if (activeView.id === 'view-profil' || activeView.id === 'view-riwayat') navId = 'nav-akun';
            
            document.querySelectorAll('.nav-item').forEach(b => {
                b.classList.remove('text-kai-orange', 'scale-110'); b.classList.add('text-slate-400');
            });

    function handleClientChatImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                let width = img.width, height = img.height;
                const maxWidth = 900;
                if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                clientChatImageData = canvas.toDataURL('image/jpeg', 0.75);
                
                document.getElementById('clientChatImagePreview').src = clientChatImageData;
                document.getElementById('clientChatImagePreviewContainer').classList.remove('hidden');
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
        event.target.value = null;
    }

    async function muatNotifikasi() {
        if(!currentUserDocId) return;
        const listDiv = document.getElementById('listNotif'); let hasNotif = false; let htmlContent = '';
        
        if(globalDueDate) {
            const dueDay = parseInt(globalDueDate); const currentDay = new Date().getDate();
            if (currentDay >= dueDay - 3 && currentDay <= dueDay) {
                hasNotif = true;
                htmlContent += `<div class="bg-rose-50 border border-rose-200 rounded-2xl p-4 mb-2"><h4 class="font-black text-sm text-slate-800">Jatuh Tempo Tgl ${dueDay}</h4><p class="text-[10px] text-slate-600 mb-2">Segera bayar tagihan Anda.</p></div>`;
            }
        }
        try {
            const snap = await db.collection('announcements').orderBy('time', 'desc').limit(5).get();
            if(!snap.empty) {
                hasNotif = true;
                snap.forEach(doc => {
                    htmlContent += `<div class="bg-white border border-slate-200 rounded-2xl p-4 mb-2"><h4 class="font-black text-sm text-kai-blue">${doc.data().title}</h4><p class="text-[10px] text-slate-600">${doc.data().body}</p></div>`;
                });
            }
        } catch(e) {}

        listDiv.innerHTML = hasNotif ? htmlContent : `<div class="text-center py-10"><p class="text-[10px] font-bold text-slate-400">Belum ada pengumuman.</p></div>`;
        if(hasNotif) document.getElementById('notifBadge').classList.remove('hidden'); 
    }

    async function bukaRiwayat() {

        if(navAkun) { navAkun.classList.remove('text-slate-400'); navAkun.classList.add('active', 'text-kai-orange', 'scale-110'); }

        window.scrollTo(0,0);
        
        const listDiv = document.getElementById('listRiwayat');
        listDiv.innerHTML = `<div class="flex justify-center py-8"><svg class="animate-spin h-6 w-6 text-kai-blue" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg></div>`;

        try {
            const doc = await db.collection('customers').doc(currentUserDocId).get();
            if (doc.exists) {
                const data = doc.data();
                const payments = data.payments || {};
                listDiv.innerHTML = '';
                
                const keys = Object.keys(payments);
                if (keys.length === 0) {
                    listDiv.innerHTML = `<div class="text-center py-10"><p class="text-xs font-bold text-slate-400">Belum ada riwayat tagihan.</p></div>`;
                    return;
                }

                keys.sort().reverse().forEach(bulan => {
                    const status = payments[bulan];
                    const isLunas = String(status).toLowerCase() === 'lunas' || status === true;
                    
                    listDiv.innerHTML += `
                        <div class="flex justify-between items-center p-4 rounded-xl border shadow-sm ${isLunas ? 'bg-emerald-50/50 border-emerald-100' : 'bg-rose-50 border-rose-100'}">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${isLunas ? 'bg-emerald-100 text-emerald-500' : 'bg-rose-100 text-rose-500'}">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        ${isLunas ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>' : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>'}
                                    </svg>
                                </div>
                                <div>
                                    <h4 class="font-black text-sm ${isLunas ? 'text-emerald-800' : 'text-rose-800'}">${bulan}</h4>
                                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wide mt-0.5">${currentPackageName.replace(/_/g, ' ')}</p>
                                </div>
                            </div>
                            <div class="px-3 py-1 rounded-md ${isLunas ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'} text-[9px] font-black uppercase tracking-wider shadow-sm">
                                ${isLunas ? 'LUNAS' : 'BELUM BAYAR'}
                            </div>
                        </div>
                    `;
                });
            }
        } catch(e) { listDiv.innerHTML = '<p class="text-center text-xs font-bold text-rose-500 mt-4">Gagal memuat data.</p>'; }
    }
